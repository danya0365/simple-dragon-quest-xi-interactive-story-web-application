<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="childGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE4B5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="childAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFE0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.1" />
    </radialGradient>
    <filter id="childSparkle">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background aura -->
  <circle cx="100" cy="100" r="90" fill="url(#childAura)"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="35" ry="45" fill="url(#childGlow)" stroke="#FFB347" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="25" fill="url(#childGlow)" stroke="#FFB347" stroke-width="2"/>
  
  <!-- Hair -->
  <path d="M 75 60 Q 100 45 125 60 Q 120 50 100 48 Q 80 50 75 60" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="68" r="3" fill="#4169E1"/>
  <circle cx="110" cy="68" r="3" fill="#4169E1"/>
  <circle cx="91" cy="67" r="1" fill="white"/>
  <circle cx="111" cy="67" r="1" fill="white"/>
  
  <!-- Smile -->
  <path d="M 90 75 Q 100 80 110 75" stroke="#FF69B4" stroke-width="2" fill="none"/>
  
  <!-- Arms -->
  <ellipse cx="70" cy="120" rx="8" ry="20" fill="url(#childGlow)" stroke="#FFB347" stroke-width="1" transform="rotate(-20 70 120)"/>
  <ellipse cx="130" cy="120" rx="8" ry="20" fill="url(#childGlow)" stroke="#FFB347" stroke-width="1" transform="rotate(20 130 120)"/>
  
  <!-- Legs -->
  <ellipse cx="85" cy="175" rx="8" ry="25" fill="url(#childGlow)" stroke="#FFB347" stroke-width="1"/>
  <ellipse cx="115" cy="175" rx="8" ry="25" fill="url(#childGlow)" stroke="#FFB347" stroke-width="1"/>
  
  <!-- Light particles around child -->
  <circle cx="60" cy="50" r="2" fill="#FFFFE0" filter="url(#childSparkle)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="60" r="2" fill="#FFFFE0" filter="url(#childSparkle)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="100" r="2" fill="#FFFFE0" filter="url(#childSparkle)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="120" r="2" fill="#FFFFE0" filter="url(#childSparkle)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inherited light symbol on chest -->
  <path d="M 100 125 L 95 130 L 100 135 L 105 130 Z" fill="#FFD700" stroke="#FFA500" stroke-width="1" filter="url(#childSparkle)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </path>
</svg>
