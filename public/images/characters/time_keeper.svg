<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Temporal Aura Effect -->
  <defs>
    <radialGradient id="temporalAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:0.3">
        <animate attributeName="stop-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#3f51b5;stop-opacity:0.2">
        <animate attributeName="stop-opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:0"/>
    </radialGradient>
    
    <linearGradient id="robeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5c6bc0"/>
      <stop offset="50%" style="stop-color:#3f51b5"/>
      <stop offset="100%" style="stop-color:#283593"/>
    </linearGradient>
    
    <radialGradient id="clockFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="70%" style="stop-color:#e0e0e0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#9e9e9e;stop-opacity:0.7"/>
    </radialGradient>
    
    <radialGradient id="timeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:0.8">
        <animate attributeName="stop-opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#3f51b5;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:0.2"/>
    </radialGradient>
    
    <filter id="temporalGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Temporal Aura Background -->
  <circle cx="100" cy="100" r="90" fill="url(#temporalAura)">
    <animate attributeName="r" values="90;100;90" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Body and Robe -->
  <ellipse cx="100" cy="140" rx="35" ry="40" fill="url(#robeGradient)"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="25" fill="#fdbcb4"/>
  
  <!-- Hair -->
  <path d="M 75 60 Q 100 50 125 60 Q 130 70 125 80 Q 100 85 75 80 Q 70 70 75 60" fill="#6d4c41"/>
  
  <!-- Beard -->
  <path d="M 85 80 Q 100 85 115 80 Q 115 90 100 95 Q 85 90 85 80" fill="#6d4c41"/>
  
  <!-- Robe Details -->
  <path d="M 65 120 Q 100 115 135 120 L 135 160 Q 100 165 65 160 Z" fill="url(#robeGradient)" opacity="0.8"/>
  
  <!-- Clock Staff -->
  <rect x="95" y="40" width="10" height="80" fill="#8d6e63"/>
  
  <!-- Clock Face -->
  <circle cx="100" cy="35" r="15" fill="url(#clockFace)" stroke="#616161" stroke-width="1" filter="url(#temporalGlow)">
    <animate attributeName="r" values="15;17;15" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Clock Numbers -->
  <text x="100" y="25" text-anchor="middle" font-size="4" fill="#424242">12</text>
  <text x="110" y="37" text-anchor="middle" font-size="4" fill="#424242">3</text>
  <text x="100" y="47" text-anchor="middle" font-size="4" fill="#424242">6</text>
  <text x="90" y="37" text-anchor="middle" font-size="4" fill="#424242">9</text>
  
  <!-- Clock Hands -->
  <line x1="100" y1="35" x2="100" y2="28" stroke="#424242" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 100 35;360 100 35" dur="12s" repeatCount="indefinite"/>
  </line>
  
  <line x1="100" y1="35" x2="105" y2="35" stroke="#424242" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 100 35;360 100 35" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Clock Center -->
  <circle cx="100" cy="35" r="1.5" fill="#424242"/>
  
  <!-- Hands -->
  <circle cx="85" cy="90" r="8" fill="#fdbcb4"/>
  <circle cx="115" cy="90" r="8" fill="#fdbcb4"/>
  
  <!-- Temporal Energy Swirls -->
  <path d="M 100 50 Q 120 65 115 85 T 100 120 Q 80 105 85 85 T 100 50" 
        fill="none" stroke="#00bcd4" stroke-width="1.5" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 100 100;360 100 100" dur="8s" repeatCount="indefinite"/>
  </path>
  
  <path d="M 100 50 Q 80 65 85 85 T 100 120 Q 120 105 115 85 T 100 50" 
        fill="none" stroke="#3f51b5" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 100 100;-360 100 100" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Floating Time Particles -->
  <circle cx="80" cy="60" r="2" fill="#00bcd4" opacity="0.8">
    <animate attributeName="cy" values="60;50;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="120" cy="70" r="1.5" fill="#3f51b5" opacity="0.7">
    <animate attributeName="cy" values="70;60;70" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="85" cy="130" r="2" fill="#00bcd4" opacity="0.6">
    <animate attributeName="cy" values="130;120;130" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="115" cy="125" r="1" fill="#3f51b5" opacity="0.9">
    <animate attributeName="cy" values="125;115;125" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Temporal Energy Burst Effect -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#00bcd4" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="40;70;40" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="100" r="45" fill="none" stroke="#3f51b5" stroke-width="0.3" opacity="0">
    <animate attributeName="r" values="45;75;45" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Eyes with Temporal Glow -->
  <ellipse cx="92" cy="68" rx="3" ry="4" fill="#424242"/>
  <ellipse cx="108" cy="68" rx="3" ry="4" fill="#424242"/>
  <ellipse cx="92" cy="68" rx="1.5" ry="2" fill="#00bcd4" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="108" cy="68" rx="1.5" ry="2" fill="#00bcd4" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
</svg>
