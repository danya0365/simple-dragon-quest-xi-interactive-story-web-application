<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Prince Faris Character -->
  
  <!-- Body - Royal attire -->
  <ellipse cx="100" cy="140" rx="35" ry="45" fill="#4169e1" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Royal cape -->
  <path d="M65 120 Q50 140 55 160 L65 155 Q60 140 65 120" fill="#dc143c" stroke="#8b0000" stroke-width="2"/>
  <path d="M135 120 Q150 140 145 160 L135 155 Q140 140 135 120" fill="#dc143c" stroke="#8b0000" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="25" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Hair - Royal blonde hair -->
  <path d="M75 60 Q100 45 125 60 Q120 50 100 45 Q80 50 75 60" fill="#ffd700"/>
  <path d="M75 65 Q85 55 100 60 Q115 55 125 65" fill="#ffed4e"/>
  
  <!-- Eyes - Blue royal eyes -->
  <circle cx="90" cy="70" r="3" fill="#4169e1"/>
  <circle cx="110" cy="70" r="3" fill="#4169e1"/>
  
  <!-- Nose -->
  <path d="M100 75 L98 80 L102 80 Z" fill="#e8a298"/>
  
  <!-- Mouth - Confident smile -->
  <path d="M92 88 Q100 92 108 88" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Crown -->
  <path d="M75 55 L80 45 L85 50 L90 40 L95 50 L100 45 L105 50 L110 40 L115 50 L120 45 L125 55" fill="#ffd700" stroke="#daa520" stroke-width="2"/>
  <circle cx="80" cy="45" r="3" fill="#ff6347"/>
  <circle cx="90" cy="40" r="3" fill="#ff6347"/>
  <circle cx="100" cy="45" r="3" fill="#ff6347"/>
  <circle cx="110" cy="40" r="3" fill="#ff6347"/>
  <circle cx="120" cy="45" r="3" fill="#ff6347"/>
  
  <!-- Arms -->
  <ellipse cx="70" cy="130" rx="12" ry="30" fill="#4169e1" stroke="#1e3a8a" stroke-width="2" transform="rotate(-20 70 130)"/>
  <ellipse cx="130" cy="130" rx="12" ry="30" fill="#4169e1" stroke="#1e3a8a" stroke-width="2" transform="rotate(20 130 130)"/>
  
  <!-- Hands -->
  <circle cx="60" cy="155" r="8" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  <circle cx="140" cy="155" r="8" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Legs -->
  <ellipse cx="85" cy="180" rx="12" ry="25" fill="#4169e1" stroke="#1e3a8a" stroke-width="2"/>
  <ellipse cx="115" cy="180" rx="12" ry="25" fill="#4169e1" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Boots -->
  <ellipse cx="85" cy="200" rx="15" ry="8" fill="#1e3a8a"/>
  <ellipse cx="115" cy="200" rx="15" ry="8" fill="#1e3a8a"/>
  
  <!-- Royal emblem on chest -->
  <circle cx="100" cy="130" r="12" fill="#ffd700" stroke="#daa520" stroke-width="2"/>
  <path d="M100 125 L95 130 L100 135 L105 130 Z" fill="#dc143c"/>
  
  <!-- Belt -->
  <rect x="65" y="155" width="70" height="8" fill="#ffd700" stroke="#daa520" stroke-width="2"/>
  
  <!-- Sword at side -->
  <rect x="145" y="140" width="4" height="40" fill="#c0c0c0" stroke="#808080" stroke-width="1" transform="rotate(15 147 160)"/>
  <ellipse cx="147" cy="180" rx="6" ry="3" fill="#8b4513" transform="rotate(15 147 180)"/>
  
  <!-- Animation: Noble stance -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="scale"
    values="1;1.02;1"
    dur="5s"
    repeatCount="indefinite"
    additive="sum"/>
</svg>
