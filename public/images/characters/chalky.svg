<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Chalky - Grandpa -->
  <circle cx="50" cy="35" r="18" fill="#fdbcb4" stroke="#333" stroke-width="2"/>
  <!-- White hair -->
  <path d="M32 25 Q50 15 68 25 Q65 20 50 18 Q35 20 32 25" fill="#F5F5F5" stroke="#333" stroke-width="1"/>
  <path d="M30 30 Q35 25 40 30" fill="none" stroke="#F5F5F5" stroke-width="3"/>
  <path d="M60 30 Q65 25 70 30" fill="none" stroke="#F5F5F5" stroke-width="3"/>
  
  <!-- Face -->
  <circle cx="42" cy="33" r="2" fill="#333"/>
  <circle cx="58" cy="33" r="2" fill="#333"/>
  <path d="M45 40 Q50 43 55 40" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Wrinkles -->
  <path d="M35 30 Q40 28 45 30" fill="none" stroke="#666" stroke-width="0.5"/>
  <path d="M55 30 Q60 28 65 30" fill="none" stroke="#666" stroke-width="0.5"/>
  
  <!-- Body - Elder clothes -->
  <rect x="32" y="50" width="36" height="40" rx="5" fill="#8B4513" stroke="#333" stroke-width="2"/>
  <!-- Pattern on clothes -->
  <rect x="40" y="60" width="20" height="3" fill="#654321"/>
  <rect x="40" y="70" width="20" height="3" fill="#654321"/>
  <rect x="40" y="80" width="20" height="3" fill="#654321"/>
  
  <!-- Arms -->
  <rect x="22" y="55" width="15" height="25" rx="7" fill="#fdbcb4" stroke="#333" stroke-width="1.5"/>
  <rect x="63" y="55" width="15" height="25" rx="7" fill="#fdbcb4" stroke="#333" stroke-width="1.5"/>
  
  <!-- Legs -->
  <rect x="35" y="90" width="12" height="8" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/>
  <rect x="53" y="90" width="12" height="8" rx="4" fill="#333" stroke="#333" stroke-width="1.5"/>
  
  <!-- Walking stick -->
  <rect x="15" y="45" width="3" height="50" fill="#8B4513" stroke="#333" stroke-width="1"/>
  <circle cx="16.5" cy="95" r="4" fill="#654321" stroke="#333" stroke-width="1"/>
</svg>
