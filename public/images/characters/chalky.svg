<svg width="180" height="240" viewBox="0 0 180 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Chalky - Companion character with white/gray outfit -->
  
  <!-- Body -->
  <ellipse cx="90" cy="170" rx="32" ry="42" fill="#D3D3D3"/>
  
  <!-- Arms -->
  <ellipse cx="62" cy="152" rx="11" ry="28" fill="#FDBCB4" transform="rotate(-15 62 152)"/>
  <ellipse cx="118" cy="152" rx="11" ry="28" fill="#FDBCB4" transform="rotate(15 118 152)"/>
  
  <!-- Head -->
  <circle cx="90" cy="75" r="28" fill="#FDBCB4"/>
  
  <!-- Hair -->
  <path d="M 62 65 Q 90 45 118 65 Q 113 55 90 50 Q 67 55 62 65" fill="#F5F5F5"/>
  <path d="M 62 70 Q 77 60 90 65 Q 103 60 118 70" fill="#F5F5F5"/>
  
  <!-- Eyes -->
  <circle cx="82" cy="75" r="3" fill="#000000"/>
  <circle cx="98" cy="75" r="3" fill="#000000"/>
  
  <!-- Mouth -->
  <path d="M 85 85 Q 90 90 95 85" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Staff -->
  <rect x="108" y="130" width="6" height="70" fill="#8B4513"/>
  <circle cx="111" cy="125" r="8" fill="#9370DB"/>
  
  <!-- Belt -->
  <rect x="58" y="165" width="64" height="7" fill="#696969"/>
  
  <!-- Legs -->
  <rect x="76" y="210" width="14" height="23" fill="#D3D3D3"/>
  <rect x="90" y="210" width="14" height="23" fill="#D3D3D3"/>
  
  <!-- Boots -->
  <ellipse cx="83" cy="236" rx="11" ry="7" fill="#696969"/>
  <ellipse cx="97" cy="236" rx="11" ry="7" fill="#696969"/>
  
  <!-- Magical aura -->
  <circle cx="111" cy="125" r="15" fill="none" stroke="#9370DB" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
