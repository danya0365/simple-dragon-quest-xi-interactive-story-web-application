<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Prison Guard - Authority figure -->
  
  <!-- Body - Guard uniform -->
  <ellipse cx="100" cy="140" rx="28" ry="38" fill="#2F4F4F"/>
  <rect x="72" y="120" width="56" height="40" fill="#708090" opacity="0.8"/>
  
  <!-- Arms -->
  <ellipse cx="72" cy="130" rx="8" ry="22" fill="#FDBCB4" transform="rotate(-15 72 130)"/>
  <ellipse cx="128" cy="130" rx="8" ry="22" fill="#FDBCB4" transform="rotate(15 128 130)"/>
  
  <!-- Guard sleeves -->
  <ellipse cx="67" cy="125" rx="10" ry="15" fill="#708090"/>
  <ellipse cx="133" cy="125" rx="10" ry="15" fill="#708090"/>
  
  <!-- Legs -->
  <ellipse cx="90" cy="175" rx="8" ry="25" fill="#2F4F4F"/>
  <ellipse cx="110" cy="175" rx="8" ry="25" fill="#2F4F4F"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="26" fill="#FDBCB4"/>
  
  <!-- Guard helmet -->
  <ellipse cx="100" cy="65" rx="30" ry="20" fill="#2F4F4F"/>
  <rect x="85" y="55" width="30" height="8" fill="#708090"/>
  <circle cx="100" cy="60" r="3" fill="#FFD700"/>
  
  <!-- Face details -->
  <g stroke="#D2691E" stroke-width="1" fill="none">
    <path d="M 88 75 Q 92 77 96 75"/>
    <path d="M 104 75 Q 108 77 112 75"/>
  </g>
  
  <!-- Eyes - Stern eyes -->
  <circle cx="88" cy="80" r="3" fill="#8B0000"/>
  <circle cx="112" cy="80" r="3" fill="#8B0000"/>
  <circle cx="89" cy="79" r="1" fill="#FFFFFF"/>
  <circle cx="113" cy="79" r="1" fill="#FFFFFF"/>
  
  <!-- Mouth - Disapproving frown -->
  <path d="M 92 90 Q 100 87 108 90" stroke="#000000" stroke-width="1.5" fill="none"/>
  
  <!-- Baton/weapon -->
  <g transform="rotate(-30 65 140)">
    <rect x="63" y="120" width="4" height="35" fill="#8B4513"/>
    <ellipse cx="65" cy="115" rx="5" ry="3" fill="#A0522D"/>
  </g>
  
  <!-- Guard badge -->
  <circle cx="100" cy="130" r="5" fill="#FFD700"/>
  <text x="100" y="133" text-anchor="middle" font-size="6" fill="#000000">G</text>
  
  <!-- Belt with keys -->
  <rect x="75" y="135" width="50" height="5" fill="#8B4513"/>
  <g transform="translate(85, 145)">
    <ellipse cx="0" cy="0" rx="3" ry="5" fill="#FFD700"/>
    <rect x="-1" y="-3" width="2" height="3" fill="#FFD700"/>
  </g>
  <g transform="translate(100, 145)">
    <ellipse cx="0" cy="0" rx="3" ry="5" fill="#C0C0C0"/>
    <rect x="-1" y="-3" width="2" height="3" fill="#C0C0C0"/>
  </g>
  
  <!-- Authority aura -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#2F4F4F" stroke-width="1.5" opacity="0.3"/>
</svg>
