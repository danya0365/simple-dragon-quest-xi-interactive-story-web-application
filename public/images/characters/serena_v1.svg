<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Serena - The Healing Priestess -->
  
  <!-- Head -->
  <circle cx="32" cy="20" r="12" fill="#FDBCB4" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Holy headdress -->
  <path d="M 22 12 Q 32 8 42 12 L 40 15 Q 32 12 24 15 Z" fill="#FFFFFF" stroke="#FFD700" stroke-width="1"/>
  <circle cx="32" cy="10" r="2" fill="#FFD700"/>
  
  <!-- Face features (gentle) -->
  <circle cx="28" cy="18" r="1" fill="#000000"/>
  <circle cx="36" cy="18" r="1" fill="#000000"/>
  <path d="M 28 24 Q 32 25 36 24" stroke="#8B4513" stroke-width="1" fill="none"/>
  
  <!-- Long blonde hair -->
  <path d="M 20 15 Q 18 10 20 6 Q 24 3 32 4 Q 40 3 44 6 Q 46 10 44 15 Q 46 18 44 22 Q 42 26 38 28 Q 34 30 30 28 Q 26 26 24 22 Q 22 18 20 15" fill="#FFD700"/>
  
  <!-- Body (priestess robe) -->
  <rect x="24" y="32" width="16" height="20" fill="#FFFFFF" stroke="#FFD700" stroke-width="1"/>
  
  <!-- Holy cross on chest -->
  <line x1="32" y1="38" x2="32" y2="44" stroke="#FFD700" stroke-width="2"/>
  <line x1="29" y1="41" x2="35" y2="41" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Arms -->
  <rect x="18" y="34" width="6" height="12" fill="#FDBCB4" stroke="#8B4513" stroke-width="1"/>
  <rect x="40" y="34" width="6" height="12" fill="#FDBCB4" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Healing staff in hand -->
  <line x1="16" y1="40" x2="10" y2="25" stroke="#8B4513" stroke-width="2"/>
  <circle cx="10" cy="25" r="3" fill="#87CEEB"/>
  <polygon points="10,25 8,22 12,22" fill="#FFFFFF"/>
  
  <!-- Hands -->
  <circle cx="18" cy="46" r="2" fill="#FDBCB4"/>
  <circle cx="46" cy="46" r="2" fill="#FDBCB4"/>
  
  <!-- Legs -->
  <rect x="26" y="52" width="5" height="10" fill="#FFFFFF" stroke="#FFD700" stroke-width="1"/>
  <rect x="33" y="52" width="5" height="10" fill="#FFFFFF" stroke="#FFD700" stroke-width="1"/>
  
  <!-- Boots -->
  <ellipse cx="28.5" cy="62" rx="3" ry="2" fill="#FFD700"/>
  <ellipse cx="35.5" cy="62" rx="3" ry="2" fill="#FFD700"/>
  
  <!-- Healing aura -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#87CEEB" stroke-width="1" opacity="0.3"/>
  
  <!-- Holy light particles -->
  <circle cx="15" cy="30" r="1" fill="#87CEEB" opacity="0.8"/>
  <circle cx="50" cy="35" r="1" fill="#FFD700" opacity="0.8"/>
  <circle cx="20" cy="50" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="45" cy="55" r="1" fill="#87CEEB" opacity="0.8"/>
  
  -- Gentle smile indicator -->
  <path d="M 30 26 Q 32 27 34 26" stroke="#FF69B4" stroke-width="0.5" fill="none" opacity="0.6"/>
</svg>
