<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Serena Character -->
  
  <!-- Body - Healer outfit -->
  <ellipse cx="100" cy="140" rx="32" ry="45" fill="#87ceeb" stroke="#4682b4" stroke-width="2"/>
  
  <!-- Healer dress -->
  <path d="M68 130 Q100 150 132 130 L128 165 Q100 175 72 165 Z" fill="#add8e6" stroke="#87ceeb" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="23" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Hair - Long blonde hair -->
  <path d="M77 60 Q100 45 123 60 Q120 50 100 48 Q80 50 77 60" fill="#ffd700"/>
  
  <!-- Long hair flowing down -->
  <path d="M77 65 Q70 90 72 120 Q75 140 80 160" fill="#ffd700" stroke="#daa520" stroke-width="2"/>
  <path d="M123 65 Q130 90 128 120 Q125 140 120 160" fill="#ffd700" stroke="#daa520" stroke-width="2"/>
  <path d="M100 65 Q95 85 97 115 Q98 135 100 155" fill="#ffed4e" stroke="#daa520" stroke-width="1"/>
  
  <!-- Hair ribbon -->
  <rect x="95" y="55" width="10" height="8" fill="#87ceeb" stroke="#4682b4" stroke-width="1"/>
  <path d="M90 59 L100 54 L110 59" fill="#add8e6" stroke="#87ceeb" stroke-width="1"/>
  
  <!-- Eyes - Gentle blue eyes -->
  <circle cx="90" cy="70" r="3" fill="#4169e1"/>
  <circle cx="110" cy="70" r="3" fill="#4169e1"/>
  
  <!-- Nose -->
  <path d="M100 75 L98 79 L102 79 Z" fill="#e8a298"/>
  
  <!-- Mouth - Gentle smile -->
  <path d="M92 87 Q100 90 108 87" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Healer hat -->
  <ellipse cx="100" cy="50" rx="25" ry="12" fill="#87ceeb" stroke="#4682b4" stroke-width="2"/>
  <ellipse cx="100" cy="45" rx="18" ry="8" fill="#add8e6" stroke="#87ceeb" stroke-width="1"/>
  <circle cx="100" cy="42" r="4" fill="#ffd700"/>
  
  <!-- Arms -->
  <ellipse cx="68" cy="125" rx="10" ry="28" fill="#fdbcb4" stroke="#e8a298" stroke-width="2" transform="rotate(-10 68 125)"/>
  <ellipse cx="132" cy="125" rx="10" ry="28" fill="#fdbcb4" stroke="#e8a298" stroke-width="2" transform="rotate(10 132 125)"/>
  
  <!-- Hands -->
  <circle cx="58" cy="148" r="7" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  <circle cx="142" cy="148" r="7" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Legs -->
  <ellipse cx="88" cy="175" rx="10" ry="20" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  <ellipse cx="112" cy="175" rx="10" ry="20" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Shoes -->
  <ellipse cx="88" cy="190" rx="12" ry="6" fill="#4682b4"/>
  <ellipse cx="112" cy="190" rx="12" ry="6" fill="#4682b4"/>
  
  <!-- Healing staff -->
  <rect x="145" y="105" width="3" height="45" fill="#8b4513" stroke="#654321" stroke-width="1" transform="rotate(5 146 127)"/>
  <ellipse cx="147" cy="100" rx="8" ry="10" fill="#87ceeb" stroke="#4682b4" stroke-width="2"/>
  <path d="M147 95 L145 100 L147 105 L149 100 Z" fill="#add8e6"/>
  
  <!-- Healing cross on staff -->
  <path d="M147 98 L147 102 M145 100 L149 100" stroke="#fff" stroke-width="2"/>
  
  <!-- Healing aura -->
  <circle cx="147" cy="100" r="15" fill="none" stroke="#87ceeb" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Cross pendant on chest -->
  <circle cx="100" cy="125" r="8" fill="#ffd700" stroke="#daa520" stroke-width="2"/>
  <path d="M100 121 L100 129 M96 125 L104 125" stroke="#fff" stroke-width="2"/>
  
  -- Gentle expression lines -->
  <path d="M85 82 Q90 84 95 82" fill="none" stroke="#e8a298" stroke-width="1"/>
  <path d="M105 82 Q110 84 115 82" fill="none" stroke="#e8a298" stroke-width="1"/>
  
  <!-- Animation: Gentle healing glow -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="scale"
    values="1;1.02;1"
    dur="4s"
    repeatCount="indefinite"
    additive="sum"/>
</svg>
