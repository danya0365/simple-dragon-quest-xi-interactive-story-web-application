<svg width="190" height="250" viewBox="0 0 190 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Jasper - General of Heliodor, loyal to the King -->
  
  <!-- Body - Military uniform -->
  <ellipse cx="95" cy="175" rx="38" ry="48" fill="#4B0082"/>
  
  <!-- Military collar -->
  <rect x="57" y="145" width="76" height="14" fill="#FFD700"/>
  
  <!-- Arms -->
  <ellipse cx="62" cy="157" rx="11" ry="30" fill="#FDBCB4" transform="rotate(-18 62 157)"/>
  <ellipse cx="128" cy="157" rx="11" ry="30" fill="#FDBCB4" transform="rotate(18 128 157)"/>
  
  <!-- Head -->
  <circle cx="95" cy="80" r="30" fill="#FDBCB4"/>
  
  <!-- Military cap -->
  <ellipse cx="95" cy="50" rx="35" ry="12" fill="#4B0082"/>
  <rect x="85" y="35" width="20" height="18" fill="#4B0082"/>
  <rect x="83" y="33" width="24" height="4" fill="#FFD700"/>
  <circle cx="95" cy="42" r="3" fill="#FFD700"/>
  
  <!-- Hair -->
  <path d="M 65 70 Q 95 50 125 70 Q 120 60 95 55 Q 70 60 65 70" fill="#000000"/>
  <path d="M 65 75 Q 80 65 95 70 Q 110 65 125 75" fill="#000000"/>
  
  <!-- Eyes - Sharp, focused -->
  <circle cx="85" cy="80" r="3" fill="#000000"/>
  <circle cx="105" cy="80" r="3" fill="#000000"/>
  
  <!-- Eyebrows - Determined -->
  <path d="M 78 73 Q 85 70 92 73" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M 98 73 Q 105 70 112 73" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Mouth - Firm, serious -->
  <path d="M 88 92 Q 95 96 102 92" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Military insignia on chest -->
  <rect x="85" y="155" width="20" height="25" fill="#FFD700"/>
  <text x="95" y="172" text-anchor="middle" font-size="12" fill="#4B0082">★</text>
  
  <!-- Dark Blade weapon -->
  <rect x="132" y="135" width="5" height="45" fill="#2F4F4F"/>
  <rect x="130" y="130" width="9" height="6" fill="#8B4513"/>
  <polygon points="134.5,120 130,130 139,130" fill="#2F4F4F"/>
  
  <!-- Military uniform details -->
  <g stroke="#FFD700" stroke-width="2" fill="none">
    <path d="M 65 170 Q 70 165 75 170"/>
    <path d="M 115 170 Q 120 165 125 170"/>
    <path d="M 65 190 Q 70 185 75 190"/>
    <path d="M 115 190 Q 120 185 125 190"/>
    <path d="M 65 210 Q 70 205 75 210"/>
    <path d="M 115 210 Q 120 205 125 210"/>
  </g>
  
  <!-- Belt -->
  <rect x="58" y="170" width="74" height="8" fill="#8B4513"/>
  
  <!-- Legs -->
  <rect x="77" y="220" width="17" height="24" fill="#4B0082"/>
  <rect x="98" y="220" width="17" height="24" fill="#4B0082"/>
  
  <!-- Military boots -->
  <ellipse cx="85" cy="247" rx="11" ry="7" fill="#2F4F4F"/>
  <ellipse cx="106" cy="247" rx="11" ry="7" fill="#2F4F4F"/>
  
  <!-- Military discipline aura -->
  <ellipse cx="95" cy="125" rx="55" ry="65" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Loyal energy particles -->
  <g opacity="0.5">
    <circle cx="45" cy="95" r="1.5" fill="#FFD700">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="105" r="1.5" fill="#FFD700">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
