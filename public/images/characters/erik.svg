<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Erik - The thief character -->
  
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="25" ry="35" fill="#800080"/>
  
  <!-- Arms -->
  <ellipse cx="75" cy="130" rx="8" ry="20" fill="#FDBCB4" transform="rotate(-15 75 130)"/>
  <ellipse cx="125" cy="130" rx="8" ry="20" fill="#FDBCB4" transform="rotate(15 125 130)"/>
  
  <!-- Legs -->
  <ellipse cx="90" cy="170" rx="8" ry="25" fill="#4B0082"/>
  <ellipse cx="110" cy="170" rx="8" ry="25" fill="#4B0082"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="25" fill="#FDBCB4"/>
  
  <!-- Hair - Spiky green hair -->
  <path d="M 80 65 L 85 55 L 90 60 L 95 50 L 100 55 L 105 50 L 110 60 L 115 55 L 120 65" fill="#32CD32" stroke="#228B22" stroke-width="1"/>
  <path d="M 85 70 Q 100 60 115 70" fill="#3CB371"/>
  
  <!-- Eyes - Sharp, cunning eyes -->
  <circle cx="90" cy="78" r="3" fill="#006400"/>
  <circle cx="110" cy="78" r="3" fill="#006400"/>
  <circle cx="91" cy="77" r="1" fill="#FFFFFF"/>
  <circle cx="111" cy="77" r="1" fill="#FFFFFF"/>
  
  <!-- Mouth - Confident smirk -->
  <path d="M 95 88 Q 100 91 105 88" stroke="#000000" stroke-width="1.5" fill="none"/>
  
  <!-- Dagger in hand -->
  <g transform="rotate(30 125 125)">
    <rect x="123" y="110" width="3" height="25" fill="#C0C0C0"/>
    <polygon points="124.5,105 127,110 122,110" fill="#C0C0C0"/>
    <rect x="122" y="135" width="5" height="8" fill="#8B4513"/>
  </g>
  
  <!-- Thief scarf -->
  <path d="M 70 85 Q 100 95 130 85 Q 125 100 100 105 Q 75 100 70 85" fill="#FF1493" opacity="0.8"/>
  
  <!-- Belt with pouch -->
  <rect x="75" y="135" width="50" height="6" fill="#8B4513"/>
  <ellipse cx="95" cy="145" rx="8" ry="6" fill="#654321"/>
  
  <!-- Mysterious aura -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#800080" stroke-width="1.5" opacity="0.2"/>
</svg>
