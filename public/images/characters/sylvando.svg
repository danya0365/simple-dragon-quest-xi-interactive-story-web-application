<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Sylvando - The Handsome Entertainer -->
  
  <!-- Head -->
  <circle cx="32" cy="20" r="12" fill="#FDBCB4" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Flamboyant hair -->
  <path d="M 20 15 Q 15 8 20 5 Q 25 2 32 3 Q 39 2 44 5 Q 49 8 44 15 Q 46 12 48 15 Q 50 18 48 20 Q 46 22 44 20" fill="#FF69B4"/>
  
  <!-- Face features (handsome) -->
  <circle cx="28" cy="18" r="1" fill="#000000"/>
  <circle cx="36" cy="18" r="1" fill="#000000"/>
  <path d="M 28 24 Q 32 26 36 24" stroke="#8B4513" stroke-width="1" fill="none"/>
  
  <!-- Sparkle near eye -->
  <polygon points="40,16 42,14 44,16 42,18" fill="#FFD700"/>
  
  <!-- Body (performer outfit) -->
  <rect x="24" y="32" width="16" height="20" fill="#FF1493" stroke="#8B008B" stroke-width="1"/>
  
  <!-- Fringe on outfit -->
  <path d="M 24 36 L 26 38 L 28 36 L 30 38 L 32 36 L 34 38 L 36 36 L 38 38 L 40 36" stroke="#FFD700" stroke-width="1" fill="none"/>
  
  <!-- Arms (dramatic pose) -->
  <rect x="16" y="30" width="6" height="14" fill="#FDBCB4" stroke="#8B4513" stroke-width="1" transform="rotate(-15 19 37)"/>
  <rect x="42" y="30" width="6" height="14" fill="#FDBCB4" stroke="#8B4513" stroke-width="1" transform="rotate(15 45 37)"/>
  
  <!-- Hands -->
  <circle cx="16" cy="42" r="3" fill="#FDBCB4"/>
  <circle cx="48" cy="42" r="3" fill="#FDBCB4"/>
  
  <!-- Legs -->
  <rect x="26" y="52" width="5" height="10" fill="#FF1493" stroke="#8B008B" stroke-width="1"/>
  <rect x="33" y="52" width="5" height="10" fill="#FF1493" stroke="#8B008B" stroke-width="1"/>
  
  <!-- Boots (stylish) -->
  <ellipse cx="28.5" cy="62" rx="3" ry="2" fill="#8B008B"/>
  <ellipse cx="35.5" cy="62" rx="3" ry="2" fill="#8B008B"/>
  
  <!-- Rose in hand -->
  <circle cx="16" cy="40" r="2" fill="#FF0000"/>
  <line x1="16" y1="42" x2="16" y2="45" stroke="#228B22" stroke-width="1"/>
  
  <!-- Performance sparkles -->
  <polygon points="10,10 12,8 14,10 12,12" fill="#FFD700" opacity="0.8"/>
  <polygon points="50,15 52,13 54,15 52,17" fill="#FFD700" opacity="0.8"/>
  <polygon points="45,25 47,23 49,25 47,27" fill="#FF69B4" opacity="0.8"/>
</svg>
