<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sylvando Character -->
  
  <!-- Body - Colorful performer outfit -->
  <ellipse cx="100" cy="140" rx="35" ry="45" fill="#ff69b4" stroke="#c71585" stroke-width="2"/>
  
  <!-- Frilly collar -->
  <ellipse cx="100" cy="105" rx="25" ry="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <path d="M75 105 Q85 100 95 105 Q105 100 115 105 Q125 100 135 105" fill="none" stroke="#ddd" stroke-width="1"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="25" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Hair - Stylish pink hair -->
  <path d="M75 60 Q100 40 125 60 Q120 45 100 40 Q80 45 75 60" fill="#ff1493"/>
  <path d="M70 65 Q75 55 85 60" fill="#ff69b4"/>
  <path d="M130 65 Q125 55 115 60" fill="#ff69b4"/>
  
  <!-- Eyes - Expressive eyes -->
  <circle cx="90" cy="70" r="3" fill="#4169e1"/>
  <circle cx="110" cy="70" r="3" fill="#4169e1"/>
  
  <!-- Eyelashes -->
  <path d="M87 67 L85 65 M90 67 L90 65 M93 67 L95 65" stroke="#333" stroke-width="1"/>
  <path d="M107 67 L105 65 M110 67 L110 65 M113 67 L115 65" stroke="#333" stroke-width="1"/>
  
  <!-- Nose -->
  <path d="M100 75 L98 80 L102 80 Z" fill="#e8a298"/>
  
  <!-- Mouth - Cheerful smile -->
  <path d="M90 88 Q100 94 110 88" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Cheek blush -->
  <circle cx="80" cy="80" r="4" fill="#ff69b4" opacity="0.3"/>
  <circle cx="120" cy="80" r="4" fill="#ff69b4" opacity="0.3"/>
  
  <!-- Hat - Performer's hat -->
  <ellipse cx="100" cy="50" rx="30" ry="8" fill="#9370db" stroke="#663399" stroke-width="2"/>
  <ellipse cx="100" cy="45" rx="20" ry="12" fill="#9370db" stroke="#663399" stroke-width="2"/>
  <circle cx="100" cy="40" r="5" fill="#ffd700"/>
  
  <!-- Arms - Dramatic pose -->
  <ellipse cx="65" cy="125" rx="12" ry="35" fill="#ff69b4" stroke="#c71585" stroke-width="2" transform="rotate(-45 65 125)"/>
  <ellipse cx="135" cy="125" rx="12" ry="35" fill="#ff69b4" stroke="#c71585" stroke-width="2" transform="rotate(45 135 125)"/>
  
  <!-- Hands -->
  <circle cx="45" cy="145" r="8" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  <circle cx="155" cy="145" r="8" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Legs -->
  <ellipse cx="85" cy="180" rx="12" ry="25" fill="#ff69b4" stroke="#c71585" stroke-width="2"/>
  <ellipse cx="115" cy="180" rx="12" ry="25" fill="#ff69b4" stroke="#c71585" stroke-width="2"/>
  
  <!-- Boots - Stylish boots -->
  <ellipse cx="85" cy="200" rx="15" ry="8" fill="#9370db"/>
  <ellipse cx="115" cy="200" rx="15" ry="8" fill="#9370db"/>
  
  <!-- Rose on chest -->
  <circle cx="100" cy="125" r="8" fill="#ff1493" stroke="#c71585" stroke-width="1"/>
  <circle cx="100" cy="125" r="5" fill="#ff69b4"/>
  <circle cx="100" cy="125" r="2" fill="#fff"/>
  
  <!-- Belt -->
  <rect x="65" y="155" width="70" height="8" fill="#ffd700" stroke="#daa520" stroke-width="2"/>
  
  <!-- Ribbon on arm -->
  <rect x="40" y="140" width="15" height="4" fill="#ffd700" stroke="#daa520" stroke-width="1" transform="rotate(-30 47 142)"/>
  <rect x="145" y="140" width="15" height="4" fill="#ffd700" stroke="#daa520" stroke-width="1" transform="rotate(30 152 142)"/>
  
  <!-- Animation: Performer's flourish -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="rotate"
    values="0 100 100; 5 100 100; 0 100 100; -5 100 100; 0 100 100"
    dur="3s"
    repeatCount="indefinite"
    additive="sum"/>
</svg>
