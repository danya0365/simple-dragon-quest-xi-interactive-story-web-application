<svg width="200" height="260" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
  <!-- King Carnelian - King of Heliodor who believes Luminary is Darkspawn -->
  
  <!-- Body - Royal robes -->
  <ellipse cx="100" cy="185" rx="40" ry="50" fill="#8B0000"/>
  
  <!-- Royal collar -->
  <rect x="60" y="155" width="80" height="15" fill="#FFD700"/>
  
  <!-- Arms -->
  <ellipse cx="65" cy="165" rx="12" ry="32" fill="#FDBCB4" transform="rotate(-20 65 165)"/>
  <ellipse cx="135" cy="165" rx="12" ry="32" fill="#FDBCB4" transform="rotate(20 135 165)"/>
  
  <!-- Head -->
  <circle cx="100" cy="85" r="32" fill="#FDBCB4"/>
  
  <!-- Crown -->
  <rect x="70" y="45" width="60" height="25" fill="#FFD700"/>
  <polygon points="70,45 100,25 130,45" fill="#FFD700"/>
  <circle cx="85" cy="35" r="4" fill="#FF1493"/>
  <circle cx="100" cy="30" r="4" fill="#FF1493"/>
  <circle cx="115" cy="35" r="4" fill="#FF1493"/>
  
  <!-- Hair -->
  <path d="M 68 75 Q 100 55 132 75 Q 127 65 100 60 Q 73 65 68 75" fill="#696969"/>
  <path d="M 68 80 Q 85 70 100 75 Q 115 70 132 80" fill="#696969"/>
  
  <!-- Eyes - Stern expression -->
  <circle cx="88" cy="85" r="3" fill="#000000"/>
  <circle cx="112" cy="85" r="3" fill="#000000"/>
  
  <!-- Eyebrows - Angry/firm -->
  <path d="M 82 78 Q 88 75 94 78" stroke="#696969" stroke-width="3" fill="none"/>
  <path d="M 106 78 Q 112 75 118 78" stroke="#696969" stroke-width="3" fill="none"/>
  
  <!-- Mouth - Firm/disapproving -->
  <path d="M 90 98 Q 100 102 110 98" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Beard -->
  <path d="M 75 105 Q 100 115 125 105 Q 120 120 100 125 Q 80 120 75 105" fill="#696969"/>
  
  <!-- Royal scepter -->
  <rect x="140" y="140" width="6" height="50" fill="#8B4513"/>
  <circle cx="143" cy="135" r="8" fill="#FFD700"/>
  <polygon points="143,125 138,135 148,135" fill="#FFD700"/>
  
  <!-- Royal robe details -->
  <rect x="90" y="160" width="20" height="60" fill="#FFD700"/>
  <g stroke="#FFD700" stroke-width="2" fill="none">
    <path d="M 70 180 Q 75 175 80 180"/>
    <path d="M 120 180 Q 125 175 130 180"/>
    <path d="M 70 200 Q 75 195 80 200"/>
    <path d="M 120 200 Q 125 195 130 200"/>
  </g>
  
  <!-- Legs -->
  <rect x="80" y="230" width="18" height="25" fill="#8B0000"/>
  <rect x="102" y="230" width="18" height="25" fill="#8B0000"/>
  
  <!-- Royal boots -->
  <ellipse cx="89" cy="258" rx="12" ry="8" fill="#8B4513"/>
  <ellipse cx="111" cy="258" rx="12" ry="8" fill="#8B4513"/>
  
  <!-- Royal authority aura -->
  <circle cx="100" cy="130" r="70" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="70;75;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Dark suspicion particles -->
  <g opacity="0.4">
    <circle cx="50" cy="100" r="2" fill="#8B0000">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="110" r="1.5" fill="#8B0000">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
