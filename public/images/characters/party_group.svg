<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Unity aura gradient -->
    <radialGradient id="unityAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.4" />
      <stop offset="30%" style="stop-color:#FFA500;stop-opacity:0.3" />
      <stop offset="60%" style="stop-color:#FF69B4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#4169E1;stop-opacity:0.1" />
    </radialGradient>
    
    <!-- Character colors -->
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="mageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9370DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A2BE2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="warriorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B22222;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="healerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Unity aura background -->
  <circle cx="100" cy="100" r="90" 
          fill="url(#unityAura)" 
          filter="url(#glow)">
    <animate attributeName="r" 
             values="90;95;90" 
             dur="4s" 
             repeatCount="indefinite"/>
    <animate attributeName="opacity" 
             values="0.4;0.6;0.4" 
             dur="4s" 
             repeatCount="indefinite"/>
  </circle>
  
  <!-- Central unity symbol -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="15" 
            fill="#FFD700" 
            stroke="#FFA500" 
            stroke-width="2"
            filter="url(#glow)">
      <animate attributeName="r" 
               values="15;18;15" 
               dur="3s" 
               repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" 
          font-family="serif" 
          font-size="16" 
          fill="#FFFFFF" 
          text-anchor="middle"
          font-weight="bold">✦</text>
  </g>
  
  <!-- Hero character (top-left) -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="20" 
            fill="url(#heroGradient)" 
            stroke="#4169E1" 
            stroke-width="2"
            filter="url(#shadow)"/>
    <!-- Hero head -->
    <circle cx="0" cy="-5" r="8" fill="#FDBCB4"/>
    <!-- Hero body -->
    <ellipse cx="0" cy="5" rx="12" ry="10" fill="url(#heroGradient)"/>
    <!-- Sword -->
    <rect x="8" y="-10" width="2" height="15" fill="#C0C0C0"/>
    <polygon points="9,-10 7,-10 8,-15" fill="#C0C0C0"/>
    <!-- Hero symbol -->
    <text x="0" y="8" 
          font-family="serif" 
          font-size="10" 
          fill="#FFFFFF" 
          text-anchor="middle">⚔</text>
  </g>
  
  <!-- Mage character (top-right) -->
  <g transform="translate(140, 60)">
    <circle cx="0" cy="0" r="20" 
            fill="url(#mageGradient)" 
            stroke="#9370DB" 
            stroke-width="2"
            filter="url(#shadow)"/>
    <!-- Mage head -->
    <circle cx="0" cy="-5" r="8" fill="#FDBCB4"/>
    <!-- Mage body -->
    <ellipse cx="0" cy="5" rx="12" ry="10" fill="url(#mageGradient)"/>
    <!-- Staff -->
    <rect x="-10" y="-15" width="2" height="20" fill="#8B4513"/>
    <circle cx="-9" cy="-15" r="3" fill="#9370DB"/>
    <!-- Mage symbol -->
    <text x="0" y="8" 
          font-family="serif" 
          font-size="10" 
          fill="#FFFFFF" 
          text-anchor="middle">✦</text>
  </g>
  
  <!-- Warrior character (bottom-left) -->
  <g transform="translate(60, 140)">
    <circle cx="0" cy="0" r="20" 
            fill="url(#warriorGradient)" 
            stroke="#DC143C" 
            stroke-width="2"
            filter="url(#shadow)"/>
    <!-- Warrior head -->
    <circle cx="0" cy="-5" r="8" fill="#FDBCB4"/>
    <!-- Warrior body -->
    <ellipse cx="0" cy="5" rx="12" ry="10" fill="url(#warriorGradient)"/>
    <!-- Shield -->
    <ellipse cx="-10" cy="0" rx="6" ry="8" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
    <!-- Warrior symbol -->
    <text x="0" y="8" 
          font-family="serif" 
          font-size="10" 
          fill="#FFFFFF" 
          text-anchor="middle">🛡</text>
  </g>
  
  <!-- Healer character (bottom-right) -->
  <g transform="translate(140, 140)">
    <circle cx="0" cy="0" r="20" 
            fill="url(#healerGradient)" 
            stroke="#32CD32" 
            stroke-width="2"
            filter="url(#shadow)"/>
    <!-- Healer head -->
    <circle cx="0" cy="-5" r="8" fill="#FDBCB4"/>
    <!-- Healer body -->
    <ellipse cx="0" cy="5" rx="12" ry="10" fill="url(#healerGradient)"/>
    <!-- Staff -->
    <rect x="8" y="-15" width="2" height="20" fill="#8B4513"/>
    <circle cx="9" cy="-15" r="3" fill="#32CD32"/>
    <!-- Healer symbol -->
    <text x="0" y="8" 
          font-family="serif" 
          font-size="10" 
          fill="#FFFFFF" 
          text-anchor="middle">✚</text>
  </g>
  
  <!-- Connection lines between characters -->
  <g stroke="#FFD700" stroke-width="1" fill="none" opacity="0.5">
    <line x1="60" y1="60" x2="100" y2="100">
      <animate attributeName="opacity" 
               values="0.5;0.8;0.5" 
               dur="2s" 
               repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="60" x2="100" y2="100">
      <animate attributeName="opacity" 
               values="0.5;0.8;0.5" 
               dur="2s" 
               begin="0.5s"
               repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="140" x2="100" y2="100">
      <animate attributeName="opacity" 
               values="0.5;0.8;0.5" 
               dur="2s" 
               begin="1s"
               repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="140" x2="100" y2="100">
      <animate attributeName="opacity" 
               values="0.5;0.8;0.5" 
               dur="2s" 
               begin="1.5s"
               repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Floating friendship hearts -->
  <g opacity="0.7">
    <path d="M 40,40 C 38,38 35,38 35,41 C 35,44 40,50 40,50 C 40,50 45,44 45,41 C 45,38 42,38 40,40 Z" 
          fill="#FF69B4">
      <animate attributeName="cy" 
               values="40;30;40" 
               dur="3s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.7;0.3;0.7" 
               dur="3s" 
               repeatCount="indefinite"/>
    </path>
    <path d="M 160,40 C 158,38 155,38 155,41 C 155,44 160,50 160,50 C 160,50 165,44 165,41 C 165,38 162,38 160,40 Z" 
          fill="#FFB6C1">
      <animate attributeName="cy" 
               values="40;30;40" 
               dur="3.5s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.7;0.3;0.7" 
               dur="3.5s" 
               repeatCount="indefinite"/>
    </path>
    <path d="M 40,160 C 38,158 35,158 35,161 C 35,164 40,170 40,170 C 40,170 45,164 45,161 C 45,158 42,158 40,160 Z" 
          fill="#FF69B4">
      <animate attributeName="cy" 
               values="160;150;160" 
               dur="4s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.7;0.3;0.7" 
               dur="4s" 
               repeatCount="indefinite"/>
    </path>
    <path d="M 160,160 C 158,158 155,158 155,161 C 155,164 160,170 160,170 C 160,170 165,164 165,161 C 165,158 162,158 160,160 Z" 
          fill="#FFB6C1">
      <animate attributeName="cy" 
               values="160;150;160" 
               dur="3.8s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.7;0.3;0.7" 
               dur="3.8s" 
               repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Unity energy particles -->
  <g opacity="0.6">
    <circle cx="80" cy="80" r="2" fill="#FFD700">
      <animate attributeName="r" 
               values="2;4;2" 
               dur="2s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.6;0.2;0.6" 
               dur="2s" 
               repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="80" r="2" fill="#FFA500">
      <animate attributeName="r" 
               values="2;4;2" 
               dur="2s" 
               begin="0.5s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.6;0.2;0.6" 
               dur="2s" 
               begin="0.5s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="120" r="2" fill="#FF69B4">
      <animate attributeName="r" 
               values="2;4;2" 
               dur="2s" 
               begin="1s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.6;0.2;0.6" 
               dur="2s" 
               begin="1s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="120" r="2" fill="#4169E1">
      <animate attributeName="r" 
               values="2;4;2" 
               dur="2s" 
               begin="1.5s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.6;0.2;0.6" 
               dur="2s" 
               begin="1.5s"
               repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
