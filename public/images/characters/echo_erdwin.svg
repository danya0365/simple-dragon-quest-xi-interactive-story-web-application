<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="luminaryCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFACD;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFE4B5;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="ancientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFACD;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFE4B5;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.4" />
    </linearGradient>
    
    <linearGradient id="etherealRobe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#FFEFD5;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#FFDEAD;stop-opacity:0.5" />
    </linearGradient>
    
    <radialGradient id="hopeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFFACD;stop-opacity:0.8" />
      <stop offset="80%" style="stop-color:#FFD700;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.4" />
    </radialGradient>
    
    <filter id="ancientGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="etherealShine">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Ancient light aura -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.4" filter="url(#ancientGlow)">
    <animate attributeName="r" values="85;95;85" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="100" r="65" fill="none" stroke="#FFE4B5" stroke-width="1.5" opacity="0.5" filter="url(#ancientGlow)">
    <animate attributeName="r" values="65;75;65" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ethereal body (translucent) -->
  <ellipse cx="100" cy="115" rx="35" ry="50" fill="url(#etherealRobe)" stroke="#FFD700" stroke-width="2" opacity="0.8"/>
  
  <!-- Robe details -->
  <path d="M 70 115 Q 100 105 130 115 L 130 145 Q 100 155 70 145 Z" 
        fill="url(#ancientLight)" 
        opacity="0.6"/>
  
  <path d="M 75 125 Q 100 120 125 125 L 125 140 Q 100 145 75 140 Z" 
        fill="url(#ancientLight)" 
        opacity="0.4"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="22" fill="url(#luminaryCore)" stroke="#FFD700" stroke-width="2" opacity="0.9"/>
  
  <!-- Hair (flowing, ethereal) -->
  <path d="M 85 60 Q 80 45 85 35 Q 90 30 95 35 Q 100 30 105 35 Q 110 30 115 35 Q 120 45 115 60" 
        fill="url(#ancientLight)" 
        stroke="#FFD700" 
        stroke-width="1" 
        opacity="0.7">
    <animate attributeName="d" values="M 85 60 Q 80 45 85 35 Q 90 30 95 35 Q 100 30 105 35 Q 110 30 115 35 Q 120 45 115 60;M 85 60 Q 82 47 87 37 Q 92 32 97 37 Q 102 32 107 37 Q 112 32 117 37 Q 118 47 115 60;M 85 60 Q 80 45 85 35 Q 90 30 95 35 Q 100 30 105 35 Q 110 30 115 35 Q 120 45 115 60" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Face (gentle, wise) -->
  <circle cx="92" cy="70" r="2" fill="#8B4513"/>
  <circle cx="108" cy="70" r="2" fill="#8B4513"/>
  
  <!-- Gentle smile -->
  <path d="M 92 78 Q 100 82 108 78" fill="none" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Arms (ethereal) -->
  <ellipse cx="65" cy="105" rx="8" ry="25" fill="url(#etherealRobe)" stroke="#FFD700" stroke-width="1" opacity="0.8"/>
  <ellipse cx="135" cy="105" rx="8" ry="25" fill="url(#etherealRobe)" stroke="#FFD700" stroke-width="1" opacity="0.8"/>
  
  <!-- Hands (gentle, glowing) -->
  <circle cx="65" cy="125" r="6" fill="url(#hopeGlow)" filter="url(#etherealShine)">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="135" cy="125" r="6" fill="url(#hopeGlow)" filter="url(#etherealShine)">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ancient staff -->
  <rect x="97" y="85" width="6" height="35" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Staff orb (ancient light) -->
  <circle cx="100" cy="85" r="8" fill="url(#luminaryCore)" filter="url(#ancientGlow)">
    <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Staff decorations -->
  <circle cx="100" cy="95" r="2" fill="#FFD700"/>
  <circle cx="100" cy="105" r="2" fill="#FFD700"/>
  <circle cx="100" cy="115" r="2" fill="#FFD700"/>
  
  <!-- Light particles -->
  <circle cx="60" cy="80" r="2" fill="#FFFACD" opacity="0.8">
    <animate attributeName="cx" values="60;40;60" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="140" cy="90" r="1.5" fill="#FFE4B5" opacity="0.7">
    <animate attributeName="cx" values="140;160;140" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;70;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="70" cy="130" r="2.5" fill="#FFD700" opacity="0.6">
    <animate attributeName="cx" values="70;50;70" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;150;130" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="130" cy="140" r="1.8" fill="#FFFACD" opacity="0.9">
    <animate attributeName="cx" values="130;150;130" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;150;130" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Light rays from staff -->
  <g opacity="0.5">
    <line x1="100" y1="85" x2="100" y2="50" stroke="#FFD700" stroke-width="1">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="85" x2="120" y2="70" stroke="#FFE4B5" stroke-width="1">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="85" x2="80" y2="70" stroke="#FFE4B5" stroke-width="1">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Hope energy waves -->
  <g opacity="0.3">
    <ellipse cx="100" cy="100" rx="45" ry="35" fill="none" stroke="#FFD700" stroke-width="1">
      <animate attributeName="rx" values="45;55;45" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="35;45;35" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="100" rx="35" ry="28" fill="none" stroke="#FFE4B5" stroke-width="1">
      <animate attributeName="rx" values="35;45;35" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="28;38;28" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Luminary symbol on chest -->
  <g transform="translate(100, 115)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.7"/>
    <path d="M 0,-6 L 2,-2 L 6,-2 L 3,1 L 4,5 L 0,3 L -4,5 L -3,1 L -6,-2 L -2,-2 Z" 
          fill="#FFD700" 
          opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Ethereal glow around entire figure -->
  <ellipse cx="100" cy="115" rx="40" ry="60" fill="url(#ancientLight)" opacity="0.2" filter="url(#etherealShine)">
    <animate attributeName="rx" values="40;45;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="60;65;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Leg area (translucent) -->
  <ellipse cx="90" cy="160" rx="8" ry="15" fill="url(#etherealRobe)" stroke="#FFD700" stroke-width="1" opacity="0.7"/>
  <ellipse cx="110" cy="160" rx="8" ry="15" fill="url(#etherealRobe)" stroke="#FFD700" stroke-width="1" opacity="0.7"/>
</svg>
