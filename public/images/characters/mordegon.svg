<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Mordegon Character - Dark Lord -->
  <g transform="translate(100, 100)">
    <!-- Dark Aura Background -->
    <ellipse cx="0" cy="20" rx="50" ry="60" fill="#4B0082" opacity="0.3"/>
    
    <!-- Mordegon's Body - Dark Robes -->
    <ellipse cx="0" cy="20" rx="35" ry="50" fill="#2F2F2F" stroke="#000000" stroke-width="3"/>
    
    <!-- Dark Armor Details -->
    <rect x="-30" y="-10" width="60" height="35" rx="5" fill="#1C1C1C" stroke="#000000" stroke-width="2"/>
    <rect x="-25" y="-5" width="50" height="8" rx="2" fill="#4B0082"/>
    <rect x="-25" y="8" width="50" height="8" rx="2" fill="#4B0082"/>
    <rect x="-25" y="21" width="50" height="8" rx="2" fill="#4B0082"/>
    
    <!-- Head -->
    <circle cx="0" cy="-30" r="20" fill="#8B4513" stroke="#000000" stroke-width="2"/>
    
    <!-- Dark Crown/Helmet -->
    <path d="M -20 -40 Q -22 -50, -15 -52 Q -8 -54, 0 -53 Q 8 -54, 15 -52 Q 22 -50, 20 -40" fill="#1C1C1C" stroke="#000000" stroke-width="2"/>
    <path d="M -18 -42 Q -19 -48, -14 -49 Q -7 -50, 0 -49 Q 7 -50, 14 -49 Q 19 -48, 18 -42" fill="#4B0082" stroke="#000000" stroke-width="1"/>
    
    <!-- Crown Spikes -->
    <path d="M -15 -45 L -13 -52 L -11 -45" fill="#8B0000" stroke="#000000" stroke-width="1"/>
    <path d="M -5 -46 L -3 -53 L -1 -46" fill="#8B0000" stroke="#000000" stroke-width="1"/>
    <path d="M 5 -46 L 3 -53 L 1 -46" fill="#8B0000" stroke="#000000" stroke-width="1"/>
    <path d="M 15 -45 L 13 -52 L 11 -45" fill="#8B0000" stroke="#000000" stroke-width="1"/>
    
    <!-- Evil Eyes - Glowing Red -->
    <circle cx="-7" cy="-30" r="3" fill="#FF0000"/>
    <circle cx="7" cy="-30" r="3" fill="#FF0000"/>
    <circle cx="-7" cy="-31" r="1" fill="#FF6347"/>
    <circle cx="7" cy="-31" r="1" fill="#FF6347"/>
    
    <!-- Evil Eyebrows -->
    <path d="M -15 -38 L -2 -35" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15 -38 L 2 -35" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Dark Beard -->
    <path d="M -15 -20 Q -18 -10, -15 0 Q -10 5, -5 8 Q 0 10, 5 8 Q 10 5, 15 0 Q 18 -10, 15 -20" fill="#1C1C1C" stroke="#000000" stroke-width="1"/>
    
    <!-- Dark Arms -->
    <ellipse cx="-28" cy="10" rx="10" ry="25" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
    <ellipse cx="28" cy="10" rx="10" ry="25" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
    
    <!-- Dark Gauntlets -->
    <ellipse cx="-28" cy="30" rx="12" ry="10" fill="#1C1C1C" stroke="#000000" stroke-width="2"/>
    <ellipse cx="28" cy="30" rx="12" ry="10" fill="#1C1C1C" stroke="#000000" stroke-width="2"/>
    
    <!-- Dark Staff -->
    <g transform="translate(35, -20)">
      <rect x="-3" y="0" width="6" height="50" fill="#1C1C1C" stroke="#000000" stroke-width="1"/>
      <circle cx="0" cy="-5" r="8" fill="#4B0082" stroke="#000000" stroke-width="2"/>
      <circle cx="0" cy="-5" r="5" fill="#8B0000" stroke="#000000" stroke-width="1"/>
      
      <!-- Staff Dark Energy -->
      <circle cx="0" cy="-5" r="12" fill="none" stroke="#8B0000" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Dark Cape -->
    <path d="M -30 -5 Q -40 10, -35 40 L -25 50 L -20 45 L -15 50 L -10 45 L -5 50 L 0 45 L 5 50 L 10 45 L 15 50 L 20 45 L 25 50 L 35 40 Q 40 10, 30 -5" fill="#1C1C1C" stroke="#000000" stroke-width="2" opacity="0.8"/>
    
    <!-- Cape Interior -->
    <path d="M -25 0 Q -30 15, -25 35 L -20 40 L -15 35 L -10 40 L -5 35 L 0 40 L 5 35 L 10 40 L 15 35 L 20 40 L 25 35 Q 30 15, 25 0" fill="#4B0082" stroke="#000000" stroke-width="1" opacity="0.6"/>
    
    <!-- Dark Legs -->
    <ellipse cx="-12" cy="65" rx="12" ry="25" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
    <ellipse cx="12" cy="65" rx="12" ry="25" fill="#2F2F2F" stroke="#000000" stroke-width="2"/>
    
    <!-- Dark Boots -->
    <ellipse cx="-12" cy="85" rx="14" ry="12" fill="#1C1C1C" stroke="#000000" stroke-width="2"/>
    <ellipse cx="12" cy="85" rx="14" ry="12" fill="#1C1C1C" stroke="#000000" stroke-width="2"/>
    
    <!-- Shadow Particles -->
    <circle cx="-40" cy="-20" r="2" fill="#4B0082" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,-12; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="15" r="1.5" fill="#8B0000" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -6,-10; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-35" cy="50" r="1" fill="#2F2F2F" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-8; 0,0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Dark Lord Aura -->
    <circle cx="0" cy="20" r="65" fill="none" stroke="#8B0000" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="65;75;65" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Evil Energy Swirls -->
    <g transform="translate(0, 20)">
      <path d="M -30 -20 Q -20 -30, -10 -20 Q 0 -30, 10 -20 Q 20 -30, 30 -20" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.5">
        <animate attributeName="d" values="M -30 -20 Q -20 -30, -10 -20 Q 0 -30, 10 -20 Q 20 -30, 30 -20;M -30 -15 Q -20 -25, -10 -15 Q 0 -25, 10 -15 Q 20 -25, 30 -15;M -30 -20 Q -20 -30, -10 -20 Q 0 -30, 10 -20 Q 20 -30, 30 -20" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Dark Magic Symbols -->
    <g transform="translate(0, -10)" opacity="0.7">
      <text x="-8" y="3" font-family="Arial" font-size="12" fill="#8B0000">☠</text>
      <text x="2" y="3" font-family="Arial" font-size="12" fill="#4B0082">⚡</text>
    </g>
  </g>
</svg>
