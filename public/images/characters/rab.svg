<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Rab Character -->
  <g id="rab">
    <!-- Body - Scholar's Robe -->
    <ellipse cx="100" cy="250" rx="35" ry="25" fill="#4682b4"/>
    <rect x="75" y="180" width="50" height="70" fill="#5f9ea0"/>
    <path d="M75 180 Q100 175 125 180 L125 215 Q100 220 75 215 Z" fill="#87ceeb"/>
    
    <!-- Robe Details -->
    <line x1="100" y1="180" x2="100" y2="240" stroke="#ffd700" stroke-width="2"/>
    <rect x="95" y="195" width="10" height="15" fill="#4169e1"/>
    <rect x="95" y="215" width="10" height="15" fill="#4169e1"/>
    
    <!-- Arms -->
    <rect x="55" y="190" width="18" height="45" rx="9" fill="#fdbcb4"/>
    <rect x="127" y="190" width="18" height="45" rx="9" fill="#fdbcb4"/>
    
    <!-- Hands -->
    <circle cx="64" cy="240" r="10" fill="#fdbcb4"/>
    <circle cx="136" cy="240" r="10" fill="#fdbcb4"/>
    
    <!-- Head -->
    <circle cx="100" cy="140" r="30" fill="#fdbcb4"/>
    
    <!-- Hair - Elderly -->
    <path d="M70 130 Q100 120 130 130 Q125 115 100 110 Q75 115 70 130" fill="#dcdcdc"/>
    <path d="M70 130 Q60 140 65 150" fill="#dcdcdc"/>
    <path d="M130 130 Q140 140 135 150" fill="#dcdcdc"/>
    
    <!-- Eyes - Kind and Wise -->
    <circle cx="88" cy="138" r="2" fill="#4169e1"/>
    <circle cx="112" cy="138" r="2" fill="#4169e1"/>
    <path d="M85 135 Q88 133 91 135" stroke="#4169e1" stroke-width="1" fill="none"/>
    <path d="M109 135 Q112 133 115 135" stroke="#4169e1" stroke-width="1" fill="none"/>
    
    <!-- Glasses -->
    <circle cx="88" cy="138" r="8" fill="none" stroke="#000000" stroke-width="2"/>
    <circle cx="112" cy="138" r="8" fill="none" stroke="#000000" stroke-width="2"/>
    <line x1="96" y1="138" x2="104" y2="138" stroke="#000000" stroke-width="2"/>
    
    <!-- Mustache and Beard -->
    <path d="M80 148 Q100 155 120 148" stroke="#dcdcdc" stroke-width="3" fill="none"/>
    <path d="M85 155 Q100 160 115 155" stroke="#dcdcdc" stroke-width="2" fill="none"/>
    
    <!-- Hat - Scholar's Cap -->
    <path d="M75 125 Q100 115 125 125 L120 115 Q100 108 80 115 Z" fill="#4682b4"/>
    <rect x="95" y="108" width="10" height="8" fill="#ffd700"/>
    
    <!-- Book of Knowledge -->
    <rect x="140" y="200" width="20" height="25" fill="#8b4513"/>
    <rect x="142" y="202" width="16" height="21" fill="#daa520"/>
    <line x1="150" y1="207" x2="150" y2="218" stroke="#8b4513" stroke-width="1"/>
    <line x1="145" y1="210" x2="155" y2="210" stroke="#8b4513" stroke-width="1"/>
    <line x1="145" y1="215" x2="155" y2="215" stroke="#8b4513" stroke-width="1"/>
    
    <!-- Magical Aura -->
    <circle cx="100" cy="150" r="50" fill="none" stroke="#87ceeb" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="50;60;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Knowledge Symbols -->
    <text x="90" y="205" font-family="serif" font-size="10" fill="#ffd700">α</text>
    <text x="105" y="205" font-family="serif" font-size="10" fill="#ffd700">β</text>
    
    <!-- Floating Scrolls -->
    <g id="scrolls">
      <rect x="35" y="170" width="12" height="18" fill="#f5deb3" transform="rotate(-15 41 179)">
        <animate attributeName="y" values="170;160;170" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="37" y="172" width="8" height="14" fill="#daa520" transform="rotate(-15 41 179)">
        <animate attributeName="y" values="172;162;172" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- Wisdom Sparkles -->
    <g id="wisdom-sparkles">
      <circle cx="115" cy="125" r="1.5" fill="#87ceeb">
        <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="85" cy="120" r="1.5" fill="#87ceeb">
        <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="105" r="1.5" fill="#87ceeb">
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
