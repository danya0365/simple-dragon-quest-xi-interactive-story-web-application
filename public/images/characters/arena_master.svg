<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Arena Master - Gallopolis Arena Overseer -->
  
  <!-- Head -->
  <circle cx="32" cy="20" r="12" fill="#FDBCB4" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Face features (stern) -->
  <circle cx="28" cy="18" r="1" fill="#000000"/>
  <circle cx="36" cy="18" r="1" fill="#000000"/>
  <path d="M 28 24 Q 32 25 36 24" stroke="#8B4513" stroke-width="1" fill="none"/>
  
  <!-- Mustache -->
  <path d="M 26 22 Q 32 24 38 22" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  
  <!-- Short hair -->
  <path d="M 20 15 Q 20 10 25 8 Q 32 7 39 8 Q 44 10 44 15" fill="#696969"/>
  
  <!-- Body (arena master outfit) -->
  <rect x="24" y="32" width="16" height="20" fill="#8B0000" stroke="#4B0000" stroke-width="1"/>
  
  <!-- Arena emblem on chest -->
  <circle cx="32" cy="40" r="4" fill="none" stroke="#FFD700" stroke-width="1"/>
  <polygon points="32,37 34,40 32,43 30,40" fill="#FFD700"/>
  
  <!-- Shoulders (epaulets) -->
  <rect x="22" y="32" width="4" height="3" fill="#FFD700"/>
  <rect x="38" y="32" width="4" height="3" fill="#FFD700"/>
  
  <!-- Arms -->
  <rect x="18" y="34" width="6" height="12" fill="#FDBCB4" stroke="#8B4513" stroke-width="1"/>
  <rect x="40" y="34" width="6" height="12" fill="#FDBCB4" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Hands -->
  <circle cx="18" cy="46" r="2" fill="#FDBCB4"/>
  <circle cx="46" cy="46" r="2" fill="#FDBCB4"/>
  
  <!-- Legs -->
  <rect x="26" y="52" width="5" height="10" fill="#8B0000" stroke="#4B0000" stroke-width="1"/>
  <rect x="33" y="52" width="5" height="10" fill="#8B0000" stroke="#4B0000" stroke-width="1"/>
  
  <!-- Boots -->
  <ellipse cx="28.5" cy="62" rx="3" ry="2" fill="#4B0000"/>
  <ellipse cx="35.5" cy="62" rx="3" ry="2" fill="#4B0000"/>
  
  <!-- Whistle -->
  <rect x="46" y="44" width="3" height="2" fill="#C0C0C0"/>
  <circle cx="49" cy="45" r="1" fill="#C0C0C0"/>
  
  <!-- Authority belt -->
  <rect x="24" y="44" width="16" height="2" fill="#FFD700"/>
</svg>
