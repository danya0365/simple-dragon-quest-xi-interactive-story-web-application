<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Arena Master Character -->
  
  <!-- Body - Strong muscular build -->
  <ellipse cx="100" cy="140" rx="40" ry="50" fill="#8b4513" stroke="#654321" stroke-width="3"/>
  
  <!-- Armor plates -->
  <rect x="70" y="110" width="60" height="40" fill="#cd853f" stroke="#8b4513" stroke-width="2" rx="5"/>
  <rect x="75" y="115" width="50" height="30" fill="#daa520" stroke="#b8860b" stroke-width="1" rx="3"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="28" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Beard - Thick beard -->
  <path d="M75 85 Q100 95 125 85 Q120 90 100 92 Q80 90 75 85" fill="#654321"/>
  <path d="M80 80 Q100 88 120 80" fill="#8b4513"/>
  
  <!-- Hair - Short dark hair -->
  <path d="M72 60 Q100 48 128 60 Q125 55 100 50 Q75 55 72 60" fill="#2c3e50"/>
  
  <!-- Eyes - Sharp eyes -->
  <circle cx="88" cy="70" r="3" fill="#333"/>
  <circle cx="112" cy="70" r="3" fill="#333"/>
  
  <!-- Scar on face -->
  <path d="M95 75 L105 78" stroke="#8b0000" stroke-width="2"/>
  
  <!-- Nose -->
  <path d="M100 78 L98 83 L102 83 Z" fill="#e8a298"/>
  
  <!-- Mouth - Stern expression -->
  <path d="M92 90 Q100 93 108 90" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Helmet/Arena master hat -->
  <ellipse cx="100" cy="50" rx="32" ry="15" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  <rect x="95" y="35" width="10" height="15" fill="#dc143c"/>
  <circle cx="100" cy="42" r="3" fill="#ffd700"/>
  
  <!-- Arms - Muscular arms -->
  <ellipse cx="60" cy="130" rx="15" ry="35" fill="#8b4513" stroke="#654321" stroke-width="2" transform="rotate(-25 60 130)"/>
  <ellipse cx="140" cy="130" rx="15" ry="35" fill="#8b4513" stroke="#654321" stroke-width="2" transform="rotate(25 140 130)"/>
  
  <!-- Arm bands -->
  <rect x="50" y="125" width="20" height="8" fill="#cd853f" stroke="#8b4513" stroke-width="2" transform="rotate(-25 60 129)"/>
  <rect x="130" y="125" width="20" height="8" fill="#cd853f" stroke="#8b4513" stroke-width="2" transform="rotate(25 140 129)"/>
  
  <!-- Hands -->
  <circle cx="45" cy="160" r="10" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  <circle cx="155" cy="160" r="10" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Legs - Strong legs -->
  <ellipse cx="82" cy="185" rx="15" ry="30" fill="#8b4513" stroke="#654321" stroke-width="2"/>
  <ellipse cx="118" cy="185" rx="15" ry="30" fill="#8b4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Boots - Heavy boots -->
  <ellipse cx="82" cy="210" rx="18" ry="10" fill="#2c3e50"/>
  <ellipse cx="118" cy="210" rx="18" ry="10" fill="#2c3e50"/>
  
  <!-- Arena master emblem on chest -->
  <circle cx="100" cy="130" r="15" fill="#dc143c" stroke="#8b0000" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">A</text>
  
  <!-- Belt -->
  <rect x="60" y="160" width="80" height="10" fill="#654321" stroke="#4a3018" stroke-width="2"/>
  
  <!-- Whip at side -->
  <path d="M145 150 Q155 160 160 170 Q165 180 170 190" stroke="#8b4513" stroke-width="3" fill="none"/>
  <circle cx="145" cy="150" r="4" fill="#654321"/>
  
  <!-- Shoulder pads -->
  <ellipse cx="65" cy="115" rx="12" ry="8" fill="#cd853f" stroke="#8b4513" stroke-width="2" transform="rotate(-30 65 115)"/>
  <ellipse cx="135" cy="115" rx="12" ry="8" fill="#cd853f" stroke="#8b4513" stroke-width="2" transform="rotate(30 135 115)"/>
  
  <!-- Animation: Intimidating presence -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="scale"
    values="1;1.03;1"
    dur="4s"
    repeatCount="indefinite"
    additive="sum"/>
</svg>
