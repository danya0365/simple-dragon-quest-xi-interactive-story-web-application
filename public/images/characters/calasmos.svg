<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="darknessCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4B0082;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2F004F;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1A0029;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="voidAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4B0082;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#2F004F;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.4" />
    </linearGradient>
    
    <linearGradient id="robeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0029;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2F004F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B0082;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B0000;stop-opacity:1" />
    </radialGradient>
    
    <filter id="voidGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="darknessShroud">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Void energy aura -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#4B0082" stroke-width="3" opacity="0.4" filter="url(#voidGlow)">
    <animate attributeName="r" values="90;100;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="100" r="70" fill="none" stroke="#2F004F" stroke-width="2" opacity="0.5" filter="url(#voidGlow)">
    <animate attributeName="r" values="70;80;70" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Darkness shroud -->
  <ellipse cx="100" cy="120" rx="60" ry="40" fill="url(#voidAura)" opacity="0.6" filter="url(#darknessShroud)">
    <animate attributeName="rx" values="60;70;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="40;50;40" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Calasmos body (dark humanoid form) -->
  <ellipse cx="100" cy="110" rx="35" ry="50" fill="url(#robeGradient)" stroke="#000000" stroke-width="2"/>
  
  <!-- Robe details -->
  <path d="M 65 110 Q 100 100 135 110 L 135 140 Q 100 150 65 140 Z" 
        fill="#1A0029" 
        opacity="0.8"/>
  
  <path d="M 70 120 Q 100 115 130 120 L 130 135 Q 100 140 70 135 Z" 
        fill="#2F004F" 
        opacity="0.6"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="25" fill="url(#darknessCore)" stroke="#000000" stroke-width="2"/>
  
  <!-- Horns -->
  <path d="M 85 55 Q 80 40 85 35" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M 115 55 Q 120 40 115 35" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Horn tips -->
  <circle cx="85" cy="35" r="4" fill="#4B0082"/>
  <circle cx="115" cy="35" r="4" fill="#4B0082"/>
  
  <!-- Eyes (glowing red) -->
  <circle cx="90" cy="70" r="6" fill="url(#eyeGlow)" filter="url(#voidGlow)">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="110" cy="70" r="6" fill="url(#eyeGlow)" filter="url(#voidGlow)">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Eye pupils -->
  <circle cx="90" cy="70" r="2" fill="#000000"/>
  <circle cx="110" cy="70" r="2" fill="#000000"/>
  
  <!-- Mouth (sinister grin) -->
  <path d="M 85 80 Q 100 85 115 80" fill="none" stroke="#8B0000" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Arms -->
  <ellipse cx="65" cy="100" rx="8" ry="25" fill="url(#robeGradient)" stroke="#000000" stroke-width="1"/>
  <ellipse cx="135" cy="100" rx="8" ry="25" fill="url(#robeGradient)" stroke="#000000" stroke-width="1"/>
  
  <!-- Hands (claw-like) -->
  <path d="M 60 120 L 55 125 M 60 120 L 58 128 M 60 120 L 62 127" 
        stroke="#000000" 
        stroke-width="2" 
        stroke-linecap="round"/>
  
  <path d="M 140 120 L 145 125 M 140 120 L 142 128 M 140 120 L 138 127" 
        stroke="#000000" 
        stroke-width="2" 
        stroke-linecap="round"/>
  
  <!-- Void energy staff -->
  <rect x="95" y="85" width="10" height="40" fill="#1A0029" stroke="#000000" stroke-width="1"/>
  
  <!-- Staff orb -->
  <circle cx="100" cy="85" r="8" fill="url(#darknessCore)" filter="url(#voidGlow)">
    <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Dark energy particles -->
  <circle cx="50" cy="80" r="3" fill="#4B0082" opacity="0.8">
    <animate attributeName="cx" values="50;30;50" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="150" cy="90" r="2" fill="#2F004F" opacity="0.7">
    <animate attributeName="cx" values="150;170;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;70;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="70" cy="140" r="2.5" fill="#1A0029" opacity="0.6">
    <animate attributeName="cx" values="70;50;70" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;160;140" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="130" cy="150" r="2" fill="#4B0082" opacity="0.9">
    <animate attributeName="cx" values="130;150;130" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;170;150" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Void tendrils -->
  <path d="M 65 130 Q 50 140 45 155" fill="none" stroke="#2F004F" stroke-width="2" opacity="0.6">
    <animate attributeName="d" values="M 65 130 Q 50 140 45 155;M 65 130 Q 55 145 50 160;M 65 130 Q 50 140 45 155" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <path d="M 135 130 Q 150 140 155 155" fill="none" stroke="#2F004F" stroke-width="2" opacity="0.6">
    <animate attributeName="d" values="M 135 130 Q 150 140 155 155;M 135 130 Q 145 145 150 160;M 135 130 Q 150 140 155 155" dur="3.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Dark energy waves -->
  <g opacity="0.3">
    <ellipse cx="100" cy="100" rx="50" ry="30" fill="none" stroke="#4B0082" stroke-width="1">
      <animate attributeName="rx" values="50;65;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="30;40;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="100" rx="40" ry="25" fill="none" stroke="#2F004F" stroke-width="1">
      <animate attributeName="rx" values="40;55;40" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="25;35;25" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Crown of darkness -->
  <path d="M 80 50 L 85 45 L 90 50 L 95 43 L 100 50 L 105 43 L 110 50 L 115 45 L 120 50" 
        fill="none" 
        stroke="#000000" 
        stroke-width="2" 
        stroke-linecap="round"/>
  
  <!-- Crown jewels -->
  <circle cx="85" cy="47" r="2" fill="#4B0082"/>
  <circle cx="95" cy="45" r="2" fill="#2F004F"/>
  <circle cx="100" cy="47" r="2" fill="#4B0082"/>
  <circle cx="105" cy="45" r="2" fill="#2F004F"/>
  <circle cx="115" cy="47" r="2" fill="#4B0082"/>
</svg>
