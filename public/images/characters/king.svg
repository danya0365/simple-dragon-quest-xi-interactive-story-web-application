<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- King Carnelian - Royal character -->
  
  <!-- Body - Royal robe -->
  <ellipse cx="100" cy="140" rx="30" ry="40" fill="#8B0000"/>
  <rect x="70" y="120" width="60" height="40" fill="#DC143C" opacity="0.7"/>
  
  <!-- Arms -->
  <ellipse cx="70" cy="130" rx="8" ry="22" fill="#FDBCB4" transform="rotate(-20 70 130)"/>
  <ellipse cx="130" cy="130" rx="8" ry="22" fill="#FDBCB4" transform="rotate(20 130 130)"/>
  
  <!-- Royal sleeves -->
  <ellipse cx="65" cy="125" rx="12" ry="15" fill="#DC143C"/>
  <ellipse cx="135" cy="125" rx="12" ry="15" fill="#DC143C"/>
  
  <!-- Legs -->
  <ellipse cx="90" cy="175" rx="8" ry="25" fill="#4B0082"/>
  <ellipse cx="110" cy="175" rx="8" ry="25" fill="#4B0082"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="28" fill="#FDBCB4"/>
  
  <!-- Crown -->
  <g id="crown">
    <rect x="85" y="45" width="30" height="15" fill="#FFD700"/>
    <polygon points="85,45 92,35 100,45 108,35 115,45" fill="#FFD700"/>
    <circle cx="92" cy="35" r="3" fill="#FF0000"/>
    <circle cx="100" cy="32" r="4" fill="#0000FF"/>
    <circle cx="108" cy="35" r="3" fill="#FF0000"/>
    <rect x="95" y="50" width="10" height="8" fill="#FFD700"/>
  </g>
  
  <!-- Royal beard -->
  <path d="M 85 95 Q 100 108 115 95 Q 112 115 100 120 Q 88 115 85 95" fill="#F5F5F5"/>
  <path d="M 90 100 Q 100 105 110 100" stroke="#D3D3D3" stroke-width="1"/>
  
  <!-- Eyes - Authoritative eyes -->
  <circle cx="88" cy="80" r="3" fill="#000080"/>
  <circle cx="112" cy="80" r="3" fill="#000080"/>
  <circle cx="89" cy="79" r="1" fill="#FFFFFF"/>
  <circle cx="113" cy="79" r="1" fill="#FFFFFF"/>
  
  <!-- Mouth - Serious expression -->
  <path d="M 92 90 Q 100 93 108 90" stroke="#000000" stroke-width="1.5" fill="none"/>
  
  <!-- Royal scepter -->
  <g transform="rotate(15 140 120)">
    <rect x="138" y="100" width="4" height="40" fill="#FFD700"/>
    <circle cx="140" cy="95" r="6" fill="#FF0000"/>
    <polygon points="140,89 143,95 137,95" fill="#FFD700"/>
  </g>
  
  <!-- Royal robe details -->
  <g>
    <circle cx="85" cy="130" r="2" fill="#FFD700"/>
    <circle cx="100" cy="130" r="2" fill="#FFD700"/>
    <circle cx="115" cy="130" r="2" fill="#FFD700"/>
    <circle cx="85" cy="145" r="2" fill="#FFD700"/>
    <circle cx="100" cy="145" r="2" fill="#FFD700"/>
    <circle cx="115" cy="145" r="2" fill="#FFD700"/>
  </g>
  
  <!-- Royal aura -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.4"/>
</svg>
