<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Hero - Dragon Quest protagonist -->
  
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="25" ry="35" fill="#4169E1"/>
  
  <!-- Arms -->
  <ellipse cx="75" cy="130" rx="8" ry="20" fill="#FDBCB4" transform="rotate(-20 75 130)"/>
  <ellipse cx="125" cy="130" rx="8" ry="20" fill="#FDBCB4" transform="rotate(20 125 130)"/>
  
  <!-- Legs -->
  <ellipse cx="90" cy="170" rx="8" ry="25" fill="#000080"/>
  <ellipse cx="110" cy="170" rx="8" ry="25" fill="#000080"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="25" fill="#FDBCB4"/>
  
  <!-- Hair -->
  <path d="M 75 70 Q 100 55 125 70 Q 120 60 100 58 Q 80 60 75 70" fill="#8B4513"/>
  <path d="M 75 75 Q 85 65 100 68 Q 115 65 125 75" fill="#A0522D"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="78" r="3" fill="#000000"/>
  <circle cx="110" cy="78" r="3" fill="#000000"/>
  <circle cx="91" cy="77" r="1" fill="#FFFFFF"/>
  <circle cx="111" cy="77" r="1" fill="#FFFFFF"/>
  
  <!-- Mouth -->
  <path d="M 95 88 Q 100 92 105 88" stroke="#000000" stroke-width="1.5" fill="none"/>
  
  <!-- Sword -->
  <g transform="rotate(-45 140 120)">
    <rect x="135" y="100" width="4" height="40" fill="#C0C0C0"/>
    <rect x="133" y="95" width="8" height="8" fill="#8B4513"/>
    <rect x="134" y="140" width="6" height="10" fill="#8B4513"/>
  </g>
  
  <!-- Shield -->
  <ellipse cx="60" cy="140" rx="15" ry="20" fill="#C0C0C0" transform="rotate(-10 60 140)"/>
  <circle cx="60" cy="140" r="8" fill="#4169E1" transform="rotate(-10 60 140)"/>
  
  <!-- Heroic aura -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3"/>
</svg>
