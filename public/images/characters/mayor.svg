<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mayor - Village Leader -->
  <circle cx="50" cy="30" r="15" fill="#fdbcb4" stroke="#333" stroke-width="2"/>
  <!-- Short hair -->
  <path d="M35 20 Q50 15 65 20 Q65 30 50 32 Q35 30 35 20" fill="#696969" stroke="#333" stroke-width="1.5"/>
  
  <!-- Face with mustache -->
  <circle cx="42" cy="28" r="2" fill="#333"/>
  <circle cx="58" cy="28" r="2" fill="#333"/>
  <path d="M45 35 Q50 38 55 35" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Mustache -->
  <path d="M40 38 Q45 40 50 38 Q55 40 60 38" fill="none" stroke="#333" stroke-width="1.5"/>
  
  <!-- Body - Mayor outfit -->
  <rect x="32" y="45" width="36" height="40" rx="5" fill="#4B0082" stroke="#333" stroke-width="2"/>
  <!-- Mayor badge -->
  <circle cx="50" cy="55" r="5" fill="#FFD700" stroke="#333" stroke-width="1"/>
  <text x="50" y="58" text-anchor="middle" font-size="6" fill="#333">M</text>
  
  <!-- Collar -->
  <path d="M40 45 L45 50 L55 50 L60 45" fill="none" stroke="#333" stroke-width="1.5"/>
  
  <!-- Arms -->
  <rect x="22" y="50" width="15" height="25" rx="7" fill="#fdbcb4" stroke="#333" stroke-width="1.5"/>
  <rect x="63" y="50" width="15" height="25" rx="7" fill="#fdbcb4" stroke="#333" stroke-width="1.5"/>
  
  <!-- Legs -->
  <rect x="35" y="85" width="12" height="12" rx="5" fill="#333" stroke="#333" stroke-width="1.5"/>
  <rect x="53" y="85" width="12" height="12" rx="5" fill="#333" stroke="#333" stroke-width="1.5"/>
  
  <!-- Official document in hand -->
  <rect x="72" y="60" width="12" height="15" rx="1" fill="#FFF" stroke="#333" stroke-width="1"/>
  <line x1="74" y1="63" x2="82" y2="63" stroke="#333" stroke-width="0.5"/>
  <line x1="74" y1="66" x2="82" y2="66" stroke="#333" stroke-width="0.5"/>
  <line x1="74" y1="69" x2="82" y2="69" stroke="#333" stroke-width="0.5"/>
</svg>
