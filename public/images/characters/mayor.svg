<svg width="185" height="245" viewBox="0 0 185 245" xmlns="http://www.w3.org/2000/svg">
  <!-- Mayor - Village authority figure with formal outfit -->
  
  <!-- Body -->
  <ellipse cx="92" cy="175" rx="34" ry="44" fill="#8B4513"/>
  
  <!-- Arms -->
  <ellipse cx="64" cy="157" rx="11" ry="29" fill="#FDBCB4" transform="rotate(-18 64 157)"/>
  <ellipse cx="120" cy="157" rx="11" ry="29" fill="#FDBCB4" transform="rotate(18 120 157)"/>
  
  <!-- Head -->
  <circle cx="92" cy="82" r="29" fill="#FDBCB4"/>
  
  <!-- Hair -->
  <path d="M 63 72 Q 92 52 121 72 Q 116 62 92 57 Q 68 62 63 72" fill="#696969"/>
  <path d="M 63 77 Q 78 67 92 72 Q 106 67 121 77" fill="#696969"/>
  
  <!-- Eyes -->
  <circle cx="84" cy="82" r="3" fill="#000000"/>
  <circle cx="100" cy="82" r="3" fill="#000000"/>
  
  <!-- Mouth -->
  <path d="M 87 92 Q 92 97 97 92" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Mustache -->
  <path d="M 82 87 Q 92 90 102 87" stroke="#696969" stroke-width="3" fill="none"/>
  
  <!-- Mayor's hat -->
  <ellipse cx="92" cy="55" rx="35" ry="8" fill="#000000"/>
  <rect x="82" y="40" width="20" height="20" fill="#000000"/>
  <rect x="80" y="38" width="24" height="4" fill="#FFD700"/>
  
  <!-- Formal coat details -->
  <rect x="58" y="155" width="68" height="8" fill="#654321"/>
  <rect x="90" y="155" width="4" height="40" fill="#FFD700"/>
  
  <!-- Belt -->
  <rect x="60" y="170" width="64" height="7" fill="#654321"/>
  
  <!-- Legs -->
  <rect x="77" y="217" width="15" height="24" fill="#000000"/>
  <rect x="92" cy="217" width="15" height="24" fill="#000000"/>
  
  <!-- Shoes -->
  <ellipse cx="84" cy="244" rx="12" ry="8" fill="#654321"/>
  <ellipse cx="99" cy="244" rx="12" ry="8" fill="#654321"/>
  
  <!-- Official badge -->
  <circle cx="92" cy="165" r="6" fill="#FFD700"/>
  <text x="92" y="168" text-anchor="middle" font-size="8" fill="#000000">M</text>
</svg>
