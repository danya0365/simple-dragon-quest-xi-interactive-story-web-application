<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Robe gradient -->
    <linearGradient id="robeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#CD853F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
    </linearGradient>
    
    <!-- Beard gradient -->
    <linearGradient id="beardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5DC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFAF0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0E68C;stop-opacity:1" />
    </linearGradient>
    
    <!-- Staff gradient -->
    <linearGradient id="staffGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <!-- Wisdom aura gradient -->
    <radialGradient id="wisdomAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.1" />
    </radialGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Wisdom aura background -->
  <circle cx="100" cy="100" r="85" 
          fill="url(#wisdomAura)" 
          filter="url(#glow)">
    <animate attributeName="r" 
             values="85;90;85" 
             dur="5s" 
             repeatCount="indefinite"/>
    <animate attributeName="opacity" 
             values="0.3;0.5;0.3" 
             dur="5s" 
             repeatCount="indefinite"/>
  </circle>
  
  <!-- Main character body -->
  <g transform="translate(100, 100)">
    <!-- Staff -->
    <g transform="translate(-35, -20)">
      <rect x="-2" y="0" width="4" height="80" 
            fill="url(#staffGradient)" 
            stroke="#654321" 
            stroke-width="1"
            filter="url(#shadow)"/>
      
      <!-- Staff top -->
      <circle cx="0" cy="0" r="6" 
              fill="#FFD700" 
              stroke="#FFA500" 
              stroke-width="1"
              filter="url(#glow)">
        <animate attributeName="r" 
                 values="6;8;6" 
                 dur="3s" 
                 repeatCount="indefinite"/>
      </circle>
      
      <!-- Staff runes -->
      <text x="0" y="20" 
            font-family="serif" 
            font-size="8" 
            fill="#FFD700" 
            text-anchor="middle"
            opacity="0.8">✦</text>
      <text x="0" y="35" 
            font-family="serif" 
            font-size="8" 
            fill="#FFD700" 
            text-anchor="middle"
            opacity="0.8">✧</text>
      <text x="0" y="50" 
            font-family="serif" 
            font-size="8" 
            fill="#FFD700" 
            text-anchor="middle"
            opacity="0.8">✦</text>
    </g>
    
    <!-- Robe -->
    <path d="M -25,10 L -30,60 L -25,75 L 25,75 L 30,60 L 25,10 L 15,5 L 0,0 L -15,5 Z" 
          fill="url(#robeGradient)" 
          stroke="#8B4513" 
          stroke-width="1.5"
          filter="url(#shadow)"/>
    
    <!-- Robe details -->
    <path d="M -20,25 L 0,20 L 20,25" 
          fill="none" 
          stroke="#A0522D" 
          stroke-width="1" 
          opacity="0.7"/>
    <path d="M -15,40 L 0,35 L 15,40" 
          fill="none" 
          stroke="#A0522D" 
          stroke-width="1" 
          opacity="0.7"/>
    <path d="M -10,55 L 0,50 L 10,55" 
          fill="none" 
          stroke="#A0522D" 
          stroke-width="1" 
          opacity="0.7"/>
    
    <!-- Torso -->
    <ellipse cx="0" cy="5" rx="20" ry="15" 
             fill="url(#robeGradient)" 
             stroke="#8B4513" 
             stroke-width="1.5"/>
    
    <!-- Head -->
    <circle cx="0" cy="-15" r="16" 
            fill="#FDBCB4" 
            stroke="#F5DEB3" 
            stroke-width="1"/>
    
    <!-- Wrinkles on face -->
    <path d="M -12,-18 Q -10,-16 -8,-18" 
          fill="none" 
          stroke="#D2691E" 
          stroke-width="0.5" 
          opacity="0.6"/>
    <path d="M 8,-18 Q 10,-16 12,-18" 
          fill="none" 
          stroke="#D2691E" 
          stroke-width="0.5" 
          opacity="0.6"/>
    <path d="M -10,-10 Q -5,-8 0,-10" 
          fill="none" 
          stroke="#D2691E" 
          stroke-width="0.5" 
          opacity="0.6"/>
    <path d="M 0,-10 Q 5,-8 10,-10" 
          fill="none" 
          stroke="#D2691E" 
          stroke-width="0.5" 
          opacity="0.6"/>
    
    <!-- White hair -->
    <path d="M -16,-28 Q -18,-35 -15,-38 Q -10,-40 0,-38 Q 10,-40 15,-38 Q 18,-35 16,-28 Q 12,-24 8,-22 L -8,-22 Q -12,-24 -16,-28 Z" 
          fill="#F5F5DC" 
          stroke="#FFFAF0" 
          stroke-width="1"/>
    
    <!-- Hair details -->
    <path d="M -10,-30 Q -5,-32 0,-30" 
          fill="none" 
          stroke="#FFFAF0" 
          stroke-width="0.5" 
          opacity="0.7"/>
    <path d="M 0,-30 Q 5,-32 10,-30" 
          fill="none" 
          stroke="#FFFAF0" 
          stroke-width="0.5" 
          opacity="0.7"/>
    
    <!-- Beard -->
    <path d="M -12,-5 Q -15,0 -12,5 Q -8,8 -4,8 Q 0,8 4,8 Q 8,8 12,5 Q 15,0 12,-5" 
          fill="url(#beardGradient)" 
          stroke="#F0E68C" 
          stroke-width="1"/>
    
    <!-- Beard details -->
    <path d="M -8,0 Q -4,2 0,0" 
          fill="none" 
          stroke="#F5F5DC" 
          stroke-width="0.5" 
          opacity="0.7"/>
    <path d="M 0,0 Q 4,2 8,0" 
          fill="none" 
          stroke="#F5F5DC" 
          stroke-width="0.5" 
          opacity="0.7"/>
    
    <!-- Mustache -->
    <path d="M -8,-8 Q -4,-6 0,-8 Q 4,-6 8,-8" 
          fill="url(#beardGradient)" 
          stroke="#F0E68C" 
          stroke-width="0.5"/>
    
    <!-- Eyes -->
    <g transform="translate(0, -15)">
      <ellipse cx="-5" cy="0" rx="2" ry="3" fill="#4169E1"/>
      <ellipse cx="5" cy="0" rx="2" ry="3" fill="#4169E1"/>
      <circle cx="-4" cy="-1" r="0.5" fill="#FFFFFF"/>
      <circle cx="6" cy="-1" r="0.5" fill="#FFFFFF"/>
    </g>
    
    <!-- Wise smile -->
    <path d="M -6,-2 Q 0,0 6,-2" 
          fill="none" 
          stroke="#D2691E" 
          stroke-width="1" 
          stroke-linecap="round"/>
    
    <!-- Hands -->
    <circle cx="-18" cy="15" r="6" fill="#FDBCB4" stroke="#F5DEB3" stroke-width="1"/>
    <circle cx="18" cy="15" r="6" fill="#FDBCB4" stroke="#F5DEB3" stroke-width="1"/>
    
    <!-- Wisdom symbols floating -->
    <g opacity="0.6">
      <text x="-25" y="-35" 
            font-family="serif" 
            font-size="12" 
            fill="#FFD700" 
            text-anchor="middle"
            filter="url(#glow)">
        ✦
        <animate attributeName="y" 
                 values="-35;-45;-35" 
                 dur="4s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </text>
      <text x="25" y="-30" 
            font-family="serif" 
            font-size="10" 
            fill="#FFA500" 
            text-anchor="middle">
        ✧
        <animate attributeName="y" 
                 values="-30;-40;-30" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
      </text>
    </g>
    
    <!-- Book of wisdom -->
    <g transform="translate(20, 25)">
      <rect x="-8" y="-6" width="16" height="12" 
            fill="#8B4513" 
            stroke="#654321" 
            stroke-width="1"
            filter="url(#shadow)"/>
      <rect x="-6" y="-4" width="12" height="8" 
            fill="#F5F5DC" 
            stroke="#DEB887" 
            stroke-width="0.5"/>
      <!-- Book text -->
      <text x="0" y="-1" 
            font-family="serif" 
            font-size="6" 
            fill="#8B4513" 
            text-anchor="middle">WIS</text>
      <text x="0" y="4" 
            font-family="serif" 
            font-size="6" 
            fill="#8B4513" 
            text-anchor="middle">DOM</text>
    </g>
  </g>
</svg>
