<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Captain Marina Character -->
  
  <!-- Body - Captain's uniform -->
  <ellipse cx="100" cy="140" rx="35" ry="45" fill="#4682b4" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Captain's coat -->
  <path d="M65 120 Q50 140 55 160 L65 155 Q60 140 65 120" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/>
  <path d="M135 120 Q150 140 145 160 L135 155 Q140 140 135 120" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Gold trim on coat -->
  <path d="M65 125 Q55 140 60 155" fill="none" stroke="#ffd700" stroke-width="2"/>
  <path d="M135 125 Q145 140 140 155" fill="none" stroke="#ffd700" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="25" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Hair - Dark hair tied back -->
  <path d="M75 60 Q100 48 125 60 Q120 55 100 52 Q80 55 75 60" fill="#2c3e50"/>
  
  <!-- Ponytail -->
  <ellipse cx="100" cy="45" rx="12" ry="20" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  <ellipse cx="100" cy="40" rx="8" ry="15" fill="#34495e"/>
  
  <!-- Eyes - Sharp sea-blue eyes -->
  <circle cx="90" cy="70" r="3" fill="#4682b4"/>
  <circle cx="110" cy="70" r="3" fill="#4682b4"/>
  
  <!-- Scar on face -->
  <path d="M95 75 L105 77" stroke="#8b0000" stroke-width="1"/>
  
  <!-- Nose -->
  <path d="M100 78 L98 82 L102 82 Z" fill="#e8a298"/>
  
  <!-- Mouth - Determined expression -->
  <path d="M92 88 Q100 91 108 88" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Captain's hat -->
  <ellipse cx="100" cy="50" rx="28" ry="12" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/>
  <rect x="95" y="38" width="10" height="12" fill="#ffd700"/>
  <circle cx="100" cy="44" r="3" fill="#fff"/>
  
  <!-- Anchor emblem on hat -->
  <path d="M100 52 L100 56 M97 54 L103 54 M98 57 Q100 59 102 57" stroke="#ffd700" stroke-width="1"/>
  
  <!-- Arms -->
  <ellipse cx="65" cy="130" rx="12" ry="30" fill="#4682b4" stroke="#1e3a8a" stroke-width="2" transform="rotate(-20 65 130)"/>
  <ellipse cx="135" cy="130" rx="12" ry="30" fill="#4682b4" stroke="#1e3a8a" stroke-width="2" transform="rotate(20 135 130)"/>
  
  <!-- Hands -->
  <circle cx="50" cy="155" r="8" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  <circle cx="150" cy="155" r="8" fill="#fdbcb4" stroke="#e8a298" stroke-width="2"/>
  
  <!-- Legs -->
  <ellipse cx="85" cy="180" rx="12" ry="25" fill="#4682b4" stroke="#1e3a8a" stroke-width="2"/>
  <ellipse cx="115" cy="180" rx="12" ry="25" fill="#4682b4" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Boots -->
  <ellipse cx="85" cy="200" rx="15" ry="8" fill="#1e3a8a"/>
  <ellipse cx="115" cy="200" rx="15" ry="8" fill="#1e3a8a"/>
  
  <!-- Captain's insignia on chest -->
  <circle cx="100" cy="125" r="12" fill="#ffd700" stroke="#daa520" stroke-width="2"/>
  <path d="M100 120 L100 130 M95 125 L105 125 M97 122 Q100 120 103 122 M97 128 Q100 130 103 128" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Belt -->
  <rect x="60" y="155" width="80" height="8" fill="#8b4513" stroke="#654321" stroke-width="2"/>
  <rect x="95" y="153" width="10" height="12" fill="#ffd700" stroke="#daa520" stroke-width="1"/>
  
  <!-- Sword at side -->
  <rect x="155" y="140" width="4" height="40" fill="#c0c0c0" stroke="#808080" stroke-width="1" transform="rotate(10 157 160)"/>
  <ellipse cx="157" cy="180" rx="6" ry="3" fill="#8b4513" transform="rotate(10 157 180)"/>
  
  <!-- Shoulder epaulets -->
  <ellipse cx="65" cy="115" rx="10" ry="6" fill="#ffd700" stroke="#daa520" stroke-width="2"/>
  <ellipse cx="135" cy="115" rx="10" ry="6" fill="#ffd700" stroke="#daa520" stroke-width="2"/>
  
  <!-- Sea shell necklace -->
  <circle cx="100" cy="105" r="3" fill="#87ceeb" stroke="#4682b4" stroke-width="1"/>
  <path d="M97 105 Q100 103 103 105" fill="#add8e6" stroke="#87ceeb" stroke-width="1"/>
  
  <!-- Animation: Commanding presence -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="scale"
    values="1;1.02;1"
    dur="5s"
    repeatCount="indefinite"
    additive="sum"/>
</svg>
