<svg width="200" height="250" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Luminary - Main protagonist with blue outfit and sword -->
  
  <!-- Body -->
  <ellipse cx="100" cy="180" rx="35" ry="45" fill="#4169E1"/>
  
  <!-- Arms -->
  <ellipse cx="70" cy="160" rx="12" ry="30" fill="#FDBCB4" transform="rotate(-20 70 160)"/>
  <ellipse cx="130" cy="160" rx="12" ry="30" fill="#FDBCB4" transform="rotate(20 130 160)"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="30" fill="#FDBCB4"/>
  
  <!-- Hair -->
  <path d="M 70 70 Q 100 50 130 70 Q 125 60 100 55 Q 75 60 70 70" fill="#8B4513"/>
  <path d="M 70 75 Q 85 65 100 70 Q 115 65 130 75" fill="#8B4513"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="80" r="3" fill="#000000"/>
  <circle cx="110" cy="80" r="3" fill="#000000"/>
  
  <!-- Mouth -->
  <path d="M 95 90 Q 100 95 105 90" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Sword -->
  <rect x="125" y="140" width="8" height="60" fill="#C0C0C0"/>
  <rect x="123" y="135" width="12" height="8" fill="#8B4513"/>
  <polygon points="129,125 125,135 133,135" fill="#C0C0C0"/>
  
  <!-- Belt -->
  <rect x="65" y="175" width="70" height="8" fill="#8B4513"/>
  
  <!-- Legs -->
  <rect x="85" y="220" width="15" height="25" fill="#4169E1"/>
  <rect x="100" y="220" width="15" height="25" fill="#4169E1"/>
  
  <!-- Boots -->
  <ellipse cx="92" cy="248" rx="12" ry="8" fill="#8B4513"/>
  <ellipse cx="107" cy="248" rx="12" ry="8" fill="#8B4513"/>
  
  <!-- Heroic glow effect -->
  <circle cx="100" cy="125" r="60" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="60;65;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
