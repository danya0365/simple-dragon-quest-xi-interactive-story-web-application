<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Innocent Aura Effect -->
  <defs>
    <radialGradient id="innocentAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:0.2">
        <animate attributeName="stop-opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#ffc107;stop-opacity:0.1">
        <animate attributeName="stop-opacity" values="0.1;0.2;0.1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:0"/>
    </radialGradient>
    
    <linearGradient id="dressGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="50%" style="stop-color:#ff6f00"/>
      <stop offset="100%" style="stop-color:#e65100"/>
    </linearGradient>
    
    <radialGradient id="hairGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffb74d;stop-opacity:0.6">
        <animate attributeName="stop-opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#ff9800;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:0.1"/>
    </radialGradient>
    
    <filter id="warmGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Innocent Aura Background -->
  <circle cx="100" cy="100" r="85" fill="url(#innocentAura)">
    <animate attributeName="r" values="85;95;85" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Body and Dress -->
  <ellipse cx="100" cy="145" rx="30" ry="35" fill="url(#dressGradient)"/>
  
  <!-- Dress Details -->
  <path d="M 70 130 Q 100 125 130 130 L 130 160 Q 100 165 70 160 Z" fill="url(#dressGradient)" opacity="0.8"/>
  
  <!-- Dress Collar -->
  <path d="M 85 115 Q 100 110 115 115 L 115 125 Q 100 120 85 125 Z" fill="#ff6f00"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="22" fill="#fdbcb4"/>
  
  <!-- Hair (Long and flowing) -->
  <path d="M 78 70 Q 100 60 122 70 Q 125 85 120 95 Q 115 100 110 95 Q 105 98 100 95 Q 95 98 90 95 Q 85 100 80 95 Q 75 85 78 70" fill="#ff6f00" filter="url(#warmGlow)"/>
  
  <!-- Hair Strands -->
  <path d="M 80 95 Q 75 110 70 125" fill="none" stroke="#ff6f00" stroke-width="3" stroke-linecap="round"/>
  <path d="M 120 95 Q 125 110 130 125" fill="none" stroke="#ff6f00" stroke-width="3" stroke-linecap="round"/>
  <path d="M 90 98 Q 88 115 85 130" fill="none" stroke="#ff6f00" stroke-width="2" stroke-linecap="round"/>
  <path d="M 110 98 Q 112 115 115 130" fill="none" stroke="#ff6f00" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Eyes (Innocent and bright) -->
  <ellipse cx="92" cy="78" rx="3" ry="4" fill="#424242"/>
  <ellipse cx="108" cy="78" rx="3" ry="4" fill="#424242"/>
  <ellipse cx="93" cy="77" rx="1" ry="1.5" fill="#ffffff"/>
  <ellipse cx="109" cy="77" rx="1" ry="1.5" fill="#ffffff"/>
  
  <!-- Eyebrows -->
  <path d="M 88 73 Q 92 71 96 73" fill="none" stroke="#6d4c41" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 104 73 Q 108 71 112 73" fill="none" stroke="#6d4c41" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M 100 82 L 98 85 L 100 85" fill="none" stroke="#f4a460" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Mouth (Gentle smile) -->
  <path d="M 95 88 Q 100 91 105 88" fill="none" stroke="#d84315" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Rosy Cheeks -->
  <circle cx="85" cy="85" r="3" fill="#ff8a80" opacity="0.4"/>
  <circle cx="115" cy="85" r="3" fill="#ff8a80" opacity="0.4"/>
  
  <!-- Arms -->
  <ellipse cx="75" cy="125" rx="8" ry="20" fill="#fdbcb4" transform="rotate(-20 75 125)"/>
  <ellipse cx="125" cy="125" rx="8" ry="20" fill="#fdbcb4" transform="rotate(20 125 125)"/>
  
  <!-- Hands -->
  <circle cx="70" cy="140" r="6" fill="#fdbcb4"/>
  <circle cx="130" cy="140" r="6" fill="#fdbcb4"/>
  
  <!-- Floating Innocent Particles -->
  <circle cx="80" cy="50" r="1.5" fill="#ffeb3b" opacity="0.7">
    <animate attributeName="cy" values="50;40;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="120" cy="55" r="1" fill="#ffc107" opacity="0.6">
    <animate attributeName="cy" values="55;45;55" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="90" cy="45" r="1.2" fill="#ff9800" opacity="0.8">
    <animate attributeName="cy" values="45;35;45" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="110" cy="40" r="1" fill="#ffeb3b" opacity="0.5">
    <animate attributeName="cy" values="40;30;40" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Hope Aura Effect -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#ffeb3b" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="35;60;35" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="100" r="40" fill="none" stroke="#ffc107" stroke-width="0.3" opacity="0">
    <animate attributeName="r" values="40;65;40" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Hair Glow Effect -->
  <ellipse cx="100" cy="75" rx="35" ry="25" fill="url(#hairGlow)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
