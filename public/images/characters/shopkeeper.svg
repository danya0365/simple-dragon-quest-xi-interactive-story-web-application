<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shopkeeper Dan -->
  <circle cx="50" cy="30" r="15" fill="#fdbcb4" stroke="#333" stroke-width="2"/>
  <!-- Short hair -->
  <path d="M35 22 Q50 18 65 22 Q65 30 50 32 Q35 30 35 22" fill="#8B4513" stroke="#333" stroke-width="1.5"/>
  
  <!-- Face with friendly expression -->
  <circle cx="42" cy="28" r="2" fill="#333"/>
  <circle cx="58" cy="28" r="2" fill="#333"/>
  <!-- Smile -->
  <path d="M42 35 Q50 39 58 35" fill="none" stroke="#333" stroke-width="1.5"/>
  
  <!-- Body - Shopkeeper apron -->
  <rect x="32" y="45" width="36" height="40" rx="5" fill="#228B22" stroke="#333" stroke-width="2"/>
  <!-- Apron -->
  <path d="M38 50 L38 80 L62 80 L62 50" fill="#FFF" stroke="#333" stroke-width="1.5"/>
  <!-- Apron strings -->
  <line x1="38" y1="55" x2="30" y2="55" stroke="#333" stroke-width="1"/>
  <line x1="62" y1="55" x2="70" y2="55" stroke="#333" stroke-width="1"/>
  
  <!-- Arms -->
  <rect x="22" y="50" width="15" height="25" rx="7" fill="#fdbcb4" stroke="#333" stroke-width="1.5"/>
  <rect x="63" y="50" width="15" height="25" rx="7" fill="#fdbcb4" stroke="#333" stroke-width="1.5"/>
  
  <!-- Legs -->
  <rect x="35" y="85" width="12" height="12" rx="5" fill="#8B4513" stroke="#333" stroke-width="1.5"/>
  <rect x="53" y="85" width="12" height="12" rx="5" fill="#8B4513" stroke="#333" stroke-width="1.5"/>
  
  <!-- Holding item -->
  <rect x="72" y="58" width="8" height="12" rx="2" fill="#8B4513" stroke="#333" stroke-width="1"/>
  <circle cx="76" cy="64" r="2" fill="#FFD700"/>
  
  <!-- Shop sign -->
  <rect x="10" y="10" width="20" height="15" rx="2" fill="#8B4513" stroke="#333" stroke-width="1"/>
  <text x="20" y="20" text-anchor="middle" font-size="8" fill="#FFF">SHOP</text>
</svg>
