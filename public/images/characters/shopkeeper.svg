<svg width="180" height="240" viewBox="0 0 180 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Shopkeeper Dan - Village shopkeeper with merchant outfit -->
  
  <!-- Body -->
  <ellipse cx="90" cy="170" rx="32" ry="42" fill="#228B22"/>
  
  <!-- Arms -->
  <ellipse cx="62" cy="152" rx="11" ry="28" fill="#FDBCB4" transform="rotate(-15 62 152)"/>
  <ellipse cx="118" cy="152" rx="11" ry="28" fill="#FDBCB4" transform="rotate(15 118 152)"/>
  
  <!-- Head -->
  <circle cx="90" cy="75" r="28" fill="#FDBCB4"/>
  
  <!-- Hair -->
  <path d="M 62 65 Q 90 45 118 65 Q 113 55 90 50 Q 67 55 62 65" fill="#8B4513"/>
  <path d="M 62 70 Q 77 60 90 65 Q 103 60 118 70" fill="#8B4513"/>
  
  <!-- Eyes -->
  <circle cx="82" cy="75" r="3" fill="#000000"/>
  <circle cx="98" cy="75" r="3" fill="#000000"/>
  
  <!-- Mouth -->
  <path d="M 85 85 Q 90 90 95 85" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Shopkeeper's apron -->
  <rect x="70" y="160" width="40" height="35" fill="#F5F5F5"/>
  <rect x="85" y="160" width="10" height="35" fill="#D3D3D3"/>
  
  <!-- Money bag -->
  <ellipse cx="125" cy="165" rx="12" ry="15" fill="#FFD700"/>
  <rect x="123" y="150" width="4" height="8" fill="#8B4513"/>
  <text x="125" y="168" text-anchor="middle" font-size="10" fill="#000000">$</text>
  
  <!-- Belt -->
  <rect x="58" y="165" width="64" height="7" fill="#8B4513"/>
  
  <!-- Legs -->
  <rect x="76" y="210" width="14" height="23" fill="#8B4513"/>
  <rect x="90" y="210" width="14" height="23" fill="#8B4513"/>
  
  <!-- Boots -->
  <ellipse cx="83" cy="236" rx="11" ry="7" fill="#654321"/>
  <ellipse cx="97" cy="236" rx="11" ry="7" fill="#654321"/>
  
  <!-- Shop sign floating above -->
  <rect x="60" y="25" width="60" height="20" fill="#8B4513" rx="2"/>
  <text x="90" y="38" text-anchor="middle" font-size="10" fill="#FFD700">SHOP</text>
  
  <!-- Friendly sparkles -->
  <g opacity="0.6">
    <circle cx="45" cy="100" r="1.5" fill="#FFD700">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="135" cy="120" r="1" fill="#FFD700">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
