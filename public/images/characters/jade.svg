<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Jade - Female Fighter with Spear -->
  
  <defs>
    <linearGradient id="jadeHairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2F4F4F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#708090;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="jadeOutfitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4682B4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="spearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="jadeFaceGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE4E1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFA07A;stop-opacity:1"/>
    </radialGradient>
  </defs>
  
  <!-- Spear -->
  <g>
    <!-- Spear Handle -->
    <rect x="95" y="20" width="10" height="120" fill="url(#spearGradient)" stroke="#8B4513" stroke-width="1" rx="2">
      <animateTransform attributeName="transform" type="rotate" values="0 100 80; 5 100 80; 0 100 80; -5 100 80; 0 100 80" dur="6s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Spear Blade -->
    <path d="M 90 15 L 100 5 L 110 15 L 105 25 L 95 25 Z" fill="#C0C0C0" stroke="#808080" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0 100 15; 5 100 15; 0 100 15; -5 100 15; 0 100 15" dur="6s" repeatCount="indefinite"/>
    </path>
    
    <!-- Spear Tip Glow -->
    <circle cx="100" cy="15" r="3" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 100 15; 5 100 15; 0 100 15; -5 100 15; 0 100 15" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Hair -->
  <path d="M 60 50 Q 50 65, 55 85 Q 50 105, 60 125 Q 55 145, 65 165" fill="none" stroke="url(#jadeHairGradient)" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" values="M 60 50 Q 50 65, 55 85 Q 50 105, 60 125 Q 55 145, 65 165; M 60 50 Q 52 63, 57 83 Q 52 103, 62 123 Q 57 143, 67 163; M 60 50 Q 50 65, 55 85 Q 50 105, 60 125 Q 55 145, 65 165" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M 140 50 Q 150 65, 145 85 Q 150 105, 140 125 Q 145 145, 135 165" fill="none" stroke="url(#jadeHairGradient)" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" values="M 140 50 Q 150 65, 145 85 Q 150 105, 140 125 Q 145 145, 135 165; M 140 50 Q 148 63, 143 83 Q 148 103, 138 123 Q 143 143, 133 163; M 140 50 Q 150 65, 145 85 Q 150 105, 140 125 Q 145 145, 135 165" dur="5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Face -->
  <ellipse cx="100" cy="85" rx="30" ry="35" fill="url(#jadeFaceGradient)" stroke="#FFA07A" stroke-width="1"/>
  
  <!-- Eyes - Sharp and focused -->
  <ellipse cx="88" cy="80" rx="6" ry="8" fill="#2F4F4F">
    <animate attributeName="ry" values="8;2;8" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="112" cy="80" rx="6" ry="8" fill="#2F4F4F">
    <animate attributeName="ry" values="8;2;8" dur="5s" begin="0.3s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="90" cy="78" r="1.5" fill="#FFFFFF"/>
  <circle cx="114" cy="78" r="1.5" fill="#FFFFFF"/>
  
  <!-- Eyebrows - Determined -->
  <path d="M 80 70 L 95 68" stroke="#2F4F4F" stroke-width="2" stroke-linecap="round"/>
  <path d="M 120 68 L 105 70" stroke="#2F4F4F" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M 100 88 L 96 93 L 100 91" fill="none" stroke="#FFA07A" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Mouth - Confident smirk -->
  <path d="M 92 98 Q 100 102, 108 98" fill="none" stroke="#DC143C" stroke-width="2" stroke-linecap="round">
    <animate attributeName="d" values="M 92 98 Q 100 102, 108 98; M 92 98 Q 100 100, 108 98; M 92 98 Q 100 102, 108 98" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Body - Fighter outfit -->
  <path d="M 70 115 Q 65 130, 70 145 L 75 160 L 80 175 L 85 185 L 95 188 L 105 188 L 115 185 L 120 175 L 125 160 L 130 145 Q 135 130, 130 115" fill="url(#jadeOutfitGradient)" stroke="#1E90FF" stroke-width="2"/>
  
  <!-- Shoulder Armor -->
  <ellipse cx="70" cy="120" rx="15" ry="8" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  <ellipse cx="130" cy="120" rx="15" ry="8" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  
  <!-- Belt -->
  <rect x="65" y="145" width="70" height="8" fill="#8B4513" stroke="#654321" stroke-width="1" rx="2"/>
  <circle cx="100" cy="149" r="3" fill="#FFD700"/>
  
  <!-- Arms - Fighting stance -->
  <ellipse cx="55" cy="130" rx="8" ry="25" fill="url(#jadeFaceGradient)" stroke="#FFA07A" stroke-width="1" transform="rotate(-20 55 130)">
    <animateTransform attributeName="transform" type="rotate" values="-20 55 130; -15 55 130; -20 55 130" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="145" cy="130" rx="8" ry="25" fill="url(#jadeFaceGradient)" stroke="#FFA07A" stroke-width="1" transform="rotate(20 145 130)">
    <animateTransform attributeName="transform" type="rotate" values="20 145 130; 25 145 130; 20 145 130" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Gloves -->
  <ellipse cx="50" cy="150" rx="6" ry="10" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  <ellipse cx="150" cy="150" rx="6" ry="10" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  
  <!-- Legs - Battle ready stance -->
  <ellipse cx="85" cy="190" rx="10" ry="15" fill="#2F4F4F" stroke="#1C1C1C" stroke-width="1"/>
  <ellipse cx="115" cy="190" rx="10" ry="15" fill="#2F4F4F" stroke="#1C1C1C" stroke-width="1"/>
  
  <!-- Boots -->
  <ellipse cx="85" cy="200" rx="12" ry="8" fill="#654321" stroke="#4B2F20" stroke-width="1"/>
  <ellipse cx="115" cy="200" rx="12" ry="8" fill="#654321" stroke="#4B2F20" stroke-width="1"/>
  
  <!-- Battle Aura -->
  <circle cx="100" cy="120" r="60" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="60;70;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Lightning Effects -->
  <path d="M 120 40 L 125 50 L 120 45 L 130 60" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 75 45 L 80 55 L 75 50 L 85 65" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Combat Sparkles -->
  <circle cx="110" cy="35" r="1" fill="#FFD700">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="40" r="1" fill="#FFD700">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="105" cy="45" r="1" fill="#FFD700">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
