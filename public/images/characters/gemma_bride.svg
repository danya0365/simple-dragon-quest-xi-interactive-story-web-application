<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Wedding dress gradient -->
    <linearGradient id="dressGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#F8F8FF;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#E6E6FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DDA0DD;stop-opacity:1" />
    </linearGradient>
    
    <!-- Hair gradient -->
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <!-- Veil gradient -->
    <linearGradient id="veilGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#F0F8FF;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:0.2" />
    </linearGradient>
    
    <!-- Love aura gradient -->
    <radialGradient id="loveAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FF69B4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:0.1" />
    </radialGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Love aura background -->
  <circle cx="100" cy="100" r="90" 
          fill="url(#loveAura)" 
          filter="url(#glow)">
    <animate attributeName="r" 
             values="90;95;90" 
             dur="4s" 
             repeatCount="indefinite"/>
    <animate attributeName="opacity" 
             values="0.3;0.5;0.3" 
             dur="4s" 
             repeatCount="indefinite"/>
  </circle>
  
  <!-- Main character body -->
  <g transform="translate(100, 100)">
    <!-- Wedding dress -->
    <path d="M -30,20 L -25,60 L -20,80 L 20,80 L 25,60 L 30,20 L 15,15 L 0,10 L -15,15 Z" 
          fill="url(#dressGradient)" 
          stroke="#FFFFFF" 
          stroke-width="1.5"
          filter="url(#shadow)"/>
    
    <!-- Dress details -->
    <path d="M -20,40 L 0,35 L 20,40" 
          fill="none" 
          stroke="#E6E6FA" 
          stroke-width="1" 
          opacity="0.7"/>
    <path d="M -15,55 L 0,50 L 15,55" 
          fill="none" 
          stroke="#E6E6FA" 
          stroke-width="1" 
          opacity="0.7"/>
    
    <!-- Bodice -->
    <ellipse cx="0" cy="15" rx="25" ry="20" 
             fill="url(#dressGradient)" 
             stroke="#FFFFFF" 
             stroke-width="1.5"/>
    
    <!-- Head -->
    <circle cx="0" cy="-10" r="18" 
            fill="#FDBCB4" 
            stroke="#F5DEB3" 
            stroke-width="1"/>
    
    <!-- Hair -->
    <path d="M -18,-25 Q -20,-35 -15,-40 Q -10,-42 0,-40 Q 10,-42 15,-40 Q 20,-35 18,-25 Q 15,-20 10,-18 L -10,-18 Q -15,-20 -18,-25 Z" 
          fill="url(#hairGradient)" 
          stroke="#FFA500" 
          stroke-width="1"/>
    
    <!-- Hair details -->
    <path d="M -12,-30 Q -8,-32 -4,-30" 
          fill="none" 
          stroke="#FFD700" 
          stroke-width="1" 
          opacity="0.7"/>
    <path d="M 4,-30 Q 8,-32 12,-30" 
          fill="none" 
          stroke="#FFD700" 
          stroke-width="1" 
          opacity="0.7"/>
    
    <!-- Eyes -->
    <g transform="translate(0, -10)">
      <ellipse cx="-6" cy="0" rx="3" ry="4" fill="#4169E1"/>
      <ellipse cx="6" cy="0" rx="3" ry="4" fill="#4169E1"/>
      <circle cx="-5" cy="-1" r="1" fill="#FFFFFF"/>
      <circle cx="7" cy="-1" r="1" fill="#FFFFFF"/>
    </g>
    
    <!-- Smile -->
    <path d="M -8,-2 Q 0,2 8,-2" 
          fill="none" 
          stroke="#FF69B4" 
          stroke-width="1.5" 
          stroke-linecap="round"/>
    
    <!-- Blush -->
    <circle cx="-12" cy="-5" r="3" fill="#FFB6C1" opacity="0.5"/>
    <circle cx="12" cy="-5" r="3" fill="#FFB6C1" opacity="0.5"/>
    
    <!-- Wedding veil -->
    <path d="M -20,-40 Q 0,-45 20,-40 Q 25,-20 20,0 Q 10,10 0,12 Q -10,10 -20,0 Q -25,-20 -20,-40 Z" 
          fill="url(#veilGradient)" 
          stroke="#FFFFFF" 
          stroke-width="0.5"
          opacity="0.8"/>
    
    <!-- Veil details -->
    <path d="M -15,-35 Q 0,-38 15,-35" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="0.5" 
          opacity="0.6"/>
    <path d="M -10,-25 Q 0,-27 10,-25" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="0.5" 
          opacity="0.6"/>
    
    <!-- Bouquet -->
    <g transform="translate(35, 40)">
      <!-- Flower stems -->
      <path d="M 0,0 L -2,15 L -1,20" 
            fill="none" 
            stroke="#228B22" 
            stroke-width="1"/>
      <path d="M 0,0 L 0,15 L 1,20" 
            fill="none" 
            stroke="#228B22" 
            stroke-width="1"/>
      <path d="M 0,0 L 2,15 L 3,20" 
            fill="none" 
            stroke="#228B22" 
            stroke-width="1"/>
      
      <!-- Flowers -->
      <circle cx="-2" cy="0" r="4" fill="#FF69B4"/>
      <circle cx="0" cy="-2" r="4" fill="#FFFFFF"/>
      <circle cx="2" cy="0" r="4" fill="#FFB6C1"/>
      <circle cx="0" cy="2" r="3" fill="#FFD700"/>
      
      <!-- Flower centers -->
      <circle cx="-2" cy="0" r="1.5" fill="#FFD700"/>
      <circle cx="0" cy="-2" r="1.5" fill="#FFD700"/>
      <circle cx="2" cy="0" r="1.5" fill="#FFD700"/>
      <circle cx="0" cy="2" r="1" fill="#FFA500"/>
    </g>
    
    <!-- Love hearts floating -->
    <g opacity="0.7">
      <path d="M -25,-30 C -27,-32 -30,-32 -30,-29 C -30,-26 -25,-20 -25,-20 C -25,-20 -20,-26 -20,-29 C -20,-32 -23,-32 -25,-30 Z" 
            fill="#FF69B4">
        <animate attributeName="cy" 
                 values="-30;-40;-30" 
                 dur="3s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.7;0.3;0.7" 
                 dur="3s" 
                 repeatCount="indefinite"/>
      </path>
      <path d="M 25,-25 C 23,-27 20,-27 20,-24 C 20,-21 25,-15 25,-15 C 25,-15 30,-21 30,-24 C 30,-27 27,-27 25,-25 Z" 
            fill="#FFB6C1">
        <animate attributeName="cy" 
                 values="-25;-35;-25" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.7;0.3;0.7" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Wedding ring on hand -->
    <g transform="translate(-20, 35)">
      <ellipse cx="0" cy="0" rx="8" ry="3" 
               fill="none" 
               stroke="#FFD700" 
               stroke-width="2"
               filter="url(#glow)"/>
      <circle cx="0" cy="0" r="2" 
              fill="#FFFFFF" 
              opacity="0.8"/>
    </g>
  </g>
</svg>
