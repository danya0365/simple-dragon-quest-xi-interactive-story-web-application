<svg width="175" height="235" viewBox="0 0 175 235" xmlns="http://www.w3.org/2000/svg">
  <!-- Gemma - Companion character with pink/red outfit -->
  
  <!-- Body -->
  <ellipse cx="87" cy="165" rx="30" ry="40" fill="#FF69B4"/>
  
  <!-- Arms -->
  <ellipse cx="60" cy="148" rx="10" ry="26" fill="#FDBCB4" transform="rotate(-12 60 148)"/>
  <ellipse cx="114" cy="148" rx="10" ry="26" fill="#FDBCB4" transform="rotate(12 114 148)"/>
  
  <!-- Head -->
  <circle cx="87" cy="72" r="26" fill="#FDBCB4"/>
  
  <!-- Hair -->
  <path d="M 61 62 Q 87 42 113 62 Q 108 52 87 47 Q 66 52 61 62" fill="#FF1493"/>
  <path d="M 61 67 Q 75 57 87 62 Q 99 57 113 67" fill="#FF1493"/>
  
  <!-- Eyes -->
  <circle cx="79" cy="72" r="3" fill="#000000"/>
  <circle cx="95" cy="72" r="3" fill="#000000"/>
  
  <!-- Mouth -->
  <path d="M 82 82 Q 87 87 92 82" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Bow in hair -->
  <polygon points="87,50 95,45 103,50 95,55" fill="#FFB6C1"/>
  
  <!-- Dagger -->
  <rect x="105" y="125" width="5" height="40" fill="#C0C0C0"/>
  <rect x="103" y="120" width="9" height="6" fill="#8B4513"/>
  <polygon points="107.5,115 104,120 111,120" fill="#C0C0C0"/>
  
  <!-- Belt -->
  <rect x="57" y="160" width="60" height="6" fill="#DC143C"/>
  
  <!-- Legs -->
  <rect x="72" y="203" width="13" height="22" fill="#FF69B4"/>
  <rect x="87" y="203" width="13" height="22" fill="#FF69B4"/>
  
  <!-- Boots -->
  <ellipse cx="78" cy="228" rx="10" ry="6" fill="#DC143C"/>
  <ellipse cx="93" cy="228" rx="10" ry="6" fill="#DC143C"/>
  
  <!-- Cheerful sparkles -->
  <g opacity="0.7">
    <circle cx="50" cy="60" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="125" cy="80" r="1.5" fill="#FFD700">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="120" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
