<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Frost Giant Character -->
  <g transform="translate(100, 100)">
    <!-- Giant Body -->
    <ellipse cx="0" cy="15" rx="45" ry="55" fill="#B0C4DE" stroke="#4682B4" stroke-width="3"/>
    
    <!-- Ice Armor Plates -->
    <rect x="-35" y="-20" width="70" height="25" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <rect x="-30" y="10" width="60" height="20" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <rect x="-25" y="35" width="50" height="15" rx="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Head -->
    <circle cx="0" cy="-35" r="25" fill="#FDBCB4" stroke="#87CEEB" stroke-width="2"/>
    
    <!-- Frost Beard -->
    <path d="M -20 -25 Q -25 -15, -20 -5 Q -15 0, -10 5 Q -5 8, 0 10 Q 5 8, 10 5 Q 15 0, 20 -5 Q 25 -15, 20 -25" fill="#F0F8FF" stroke="#B0E0E6" stroke-width="1"/>
    
    <!-- Ice Hair -->
    <path d="M -25 -50 Q -30 -60, -20 -62 Q -10 -65, 0 -63 Q 10 -65, 20 -62 Q 30 -60, 25 -50" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Eyes (Glowing Blue) -->
    <circle cx="-8" cy="-35" r="3" fill="#0066CC"/>
    <circle cx="8" cy="-35" r="3" fill="#0066CC"/>
    <circle cx="-8" cy="-36" r="1" fill="#87CEEB"/>
    <circle cx="8" cy="-36" r="1" fill="#87CEEB"/>
    
    <!-- Angry Eyebrows -->
    <path d="M -15 -45 L -5 -42" stroke="#4682B4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15 -45 L 5 -42" stroke="#4682B4" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Massive Arms -->
    <ellipse cx="-40" cy="10" rx="15" ry="35" fill="#B0C4DE" stroke="#4682B4" stroke-width="2"/>
    <ellipse cx="40" cy="10" rx="15" ry="35" fill="#B0C4DE" stroke="#4682B4" stroke-width="2"/>
    
    <!-- Ice Fists -->
    <circle cx="-40" cy="40" r="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <circle cx="40" cy="40" r="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Ice Knuckles -->
    <circle cx="-45" cy="35" r="3" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    <circle cx="-40" cy="32" r="3" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    <circle cx="-35" cy="35" r="3" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    <circle cx="35" cy="35" r="3" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    <circle cx="40" cy="32" r="3" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    <circle cx="45" cy="35" r="3" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    
    <!-- Legs -->
    <ellipse cx="-15" cy="65" rx="18" ry="30" fill="#B0C4DE" stroke="#4682B4" stroke-width="2"/>
    <ellipse cx="15" cy="65" rx="18" ry="30" fill="#B0C4DE" stroke="#4682B4" stroke-width="2"/>
    
    <!-- Ice Boots -->
    <ellipse cx="-15" cy="90" rx="20" ry="15" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <ellipse cx="15" cy="90" rx="20" ry="15" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Ice Spikes on Shoulders -->
    <g transform="translate(-35, -15)">
      <path d="M 0 0 L -3 -8 L 0 -10 L 3 -8 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
      <path d="M 8 0 L 5 -8 L 8 -10 L 11 -8 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    </g>
    <g transform="translate(35, -15)">
      <path d="M 0 0 L -3 -8 L 0 -10 L 3 -8 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
      <path d="M -8 0 L -5 -8 L -8 -10 L -11 -8 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    </g>
    
    <!-- Frost Breath Effect -->
    <g transform="translate(0, -35)">
      <ellipse cx="0" cy="5" rx="15" ry="8" fill="#E0F2FE" opacity="0.6">
        <animate attributeName="rx" values="15;25;15" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="8" rx="20" ry="6" fill="#BAE6FD" opacity="0.4">
        <animate attributeName="rx" values="20;30;20" dur="3s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Giant's Cold Aura -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#4682B4" stroke-width="3" opacity="0.3">
      <animate attributeName="r" values="70;80;70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Floating Ice Crystals -->
    <g transform="translate(-50, -30)">
      <path d="M 0 0 L 2 -4 L 4 0 L 2 1 Z" fill="#F0F9FF" stroke="#0284C7" stroke-width="0.5" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,0; 3,-8; 0,0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(50, 20)">
      <path d="M 0 0 L 1.5 -3 L 3 0 L 1.5 1 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.5" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0; -4,-10; 0,0" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(-30, 50)">
      <path d="M 0 0 L 1 -2 L 2 0 L 1 0.5 Z" fill="#BAE6FD" stroke="#0284C7" stroke-width="0.5" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0,0; 5,-6; 0,0" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Power Glow on Fists -->
    <circle cx="-40" cy="40" r="22" fill="none" stroke="#0066CC" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="22;26;22" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="40" r="22" fill="none" stroke="#0066CC" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="22;26;22" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
