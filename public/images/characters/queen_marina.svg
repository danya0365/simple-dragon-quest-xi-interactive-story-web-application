<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Queen Marina - Mermaid Queen -->
  
  <!-- Crown and Hair -->
  <defs>
    <linearGradient id="crownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1">
        <animate attributeName="stop-color" values="#FFD700;#FFA500;#FFD700" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="faceGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE4B5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F0E68C;stop-opacity:1"/>
    </radialGradient>
  </defs>
  
  <!-- Crown -->
  <path d="M 60 40 L 65 25 L 75 35 L 85 20 L 95 35 L 105 25 L 110 40 Z" fill="url(#crownGradient)" stroke="#B8860B" stroke-width="1">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Crown Jewels -->
  <circle cx="75" cy="30" r="3" fill="#00CED1">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="25" r="3" fill="#FF69B4">
    <animate attributeName="r" values="3;4;3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="30" r="3" fill="#00CED1">
    <animate attributeName="r" values="3;4;3" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Hair -->
  <path d="M 50 45 Q 40 60, 45 80 Q 40 100, 50 120 Q 45 140, 55 160" fill="none" stroke="url(#hairGradient)" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" values="M 50 45 Q 40 60, 45 80 Q 40 100, 50 120 Q 45 140, 55 160; M 50 45 Q 42 58, 47 78 Q 42 98, 52 118 Q 47 138, 57 158; M 50 45 Q 40 60, 45 80 Q 40 100, 50 120 Q 45 140, 55 160" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M 150 45 Q 160 60, 155 80 Q 160 100, 150 120 Q 155 140, 145 160" fill="none" stroke="url(#hairGradient)" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" values="M 150 45 Q 160 60, 155 80 Q 160 100, 150 120 Q 155 140, 145 160; M 150 45 Q 158 58, 153 78 Q 158 98, 148 118 Q 153 138, 143 158; M 150 45 Q 160 60, 155 80 Q 160 100, 150 120 Q 155 140, 145 160" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Face -->
  <ellipse cx="100" cy="80" rx="35" ry="40" fill="url(#faceGradient)" stroke="#DEB887" stroke-width="1"/>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="75" rx="8" ry="10" fill="#4169E1">
    <animate attributeName="ry" values="10;2;10" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="115" cy="75" rx="8" ry="10" fill="#4169E1">
    <animate attributeName="ry" values="10;2;10" dur="4s" begin="0.2s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="87" cy="73" r="2" fill="#FFFFFF"/>
  <circle cx="117" cy="73" r="2" fill="#FFFFFF"/>
  
  <!-- Nose -->
  <path d="M 100 85 L 95 90 L 100 88" fill="none" stroke="#DEB887" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Mouth -->
  <path d="M 90 95 Q 100 100, 110 95" fill="none" stroke="#FF69B4" stroke-width="2" stroke-linecap="round">
    <animate attributeName="d" values="M 90 95 Q 100 100, 110 95; M 90 95 Q 100 98, 110 95; M 90 95 Q 100 100, 110 95" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Royal Necklace -->
  <ellipse cx="100" cy="115" rx="25" ry="8" fill="none" stroke="url(#crownGradient)" stroke-width="3"/>
  <circle cx="85" cy="115" r="4" fill="#00CED1">
    <animate attributeName="fill" values="#00CED1;#FF69B4;#00CED1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="115" r="5" fill="#FFD700">
    <animate attributeName="r" values="5;6;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="115" r="4" fill="#00CED1">
    <animate attributeName="fill" values="#00CED1;#FF69B4;#00CED1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Mermaid Tail -->
  <path d="M 70 120 Q 60 140, 65 160 Q 70 180, 85 185 Q 100 188, 115 185 Q 130 180, 135 160 Q 140 140, 130 120" fill="#4169E1" stroke="#1E90FF" stroke-width="2">
    <animate attributeName="d" values="M 70 120 Q 60 140, 65 160 Q 70 180, 85 185 Q 100 188, 115 185 Q 130 180, 135 160 Q 140 140, 130 120; M 70 120 Q 58 138, 63 158 Q 68 178, 83 183 Q 100 186, 117 183 Q 132 178, 137 158 Q 142 138, 130 120; M 70 120 Q 60 140, 65 160 Q 70 180, 85 185 Q 100 188, 115 185 Q 130 180, 135 160 Q 140 140, 130 120" dur="5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Tail Fins -->
  <path d="M 85 185 L 75 195 L 85 190 Z" fill="#00CED1" stroke="#1E90FF" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 85 190; 10 85 190; 0 85 190" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 115 185 L 125 195 L 115 190 Z" fill="#00CED1" stroke="#1E90FF" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 115 190; -10 115 190; 0 115 190" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Tail Scales Pattern -->
  <g opacity="0.6">
    <circle cx="80" cy="140" r="3" fill="#87CEEB">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="145" r="3" fill="#87CEEB">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="140" r="3" fill="#87CEEB">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="155" r="3" fill="#87CEEB">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="160" r="3" fill="#87CEEB">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="155" r="3" fill="#87CEEB">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Magical Aura -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#00CED1" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="90;100;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Water Bubbles -->
  <circle cx="60" cy="60" r="2" fill="#87CEEB" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; -5,-10; 0,0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="80" r="1.5" fill="#87CEEB" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 5,-15; 0,0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="150" r="1" fill="#87CEEB" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0; -3,-8; 0,0" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
