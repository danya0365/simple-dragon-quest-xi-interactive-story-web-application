<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Forest Guardian Character -->
  <g id="forest-guardian">
    <!-- Body - Living Tree Form -->
    <ellipse cx="100" cy="250" rx="45" ry="35" fill="#654321"/>
    <rect x="70" y="170" width="60" height="90" fill="#8b4513"/>
    <path d="M70 170 Q100 160 130 170 L130 220 Q100 230 70 220 Z" fill="#a0522d"/>
    
    <!-- Tree Bark Texture -->
    <line x1="80" y1="180" x2="80" y2="220" stroke="#654321" stroke-width="2"/>
    <line x1="90" y1="175" x2="90" y2="225" stroke="#654321" stroke-width="2"/>
    <line x1="110" y1="175" x2="110" y2="225" stroke="#654321" stroke-width="2"/>
    <line x1="120" y1="180" x2="120" y2="220" stroke="#654321" stroke-width="2"/>
    
    <!-- Arms - Branches -->
    <path d="M70 190 Q40 200 35 220 Q30 240 40 250" stroke="#8b4513" stroke-width="15" fill="none"/>
    <path d="M130 190 Q160 200 165 220 Q170 240 160 250" stroke="#8b4513" stroke-width="15" fill="none"/>
    
    <!-- Hands - Leaf Clusters -->
    <circle cx="40" cy="250" r="15" fill="#228b22"/>
    <circle cx="35" cy="245" r="12" fill="#32cd32"/>
    <circle cx="45" cy="245" r="12" fill="#32cd32"/>
    <circle cx="40" cy="240" r="10" fill="#90ee90"/>
    
    <circle cx="160" cy="250" r="15" fill="#228b22"/>
    <circle cx="155" cy="245" r="12" fill="#32cd32"/>
    <circle cx="165" cy="245" r="12" fill="#32cd32"/>
    <circle cx="160" cy="240" r="10" fill="#90ee90"/>
    
    <!-- Head - Ancient Tree Face -->
    <circle cx="100" cy="140" r="40" fill="#8b4513"/>
    
    <!-- Face Features -->
    <!-- Eyes - Ancient and Wise -->
    <ellipse cx="85" cy="135" rx="8" ry="12" fill="#4b0082"/>
    <ellipse cx="115" cy="135" rx="8" ry="12" fill="#4b0082"/>
    <circle cx="85" cy="133" r="3" fill="#90ee90"/>
    <circle cx="115" cy="133" r="3" fill="#90ee90"/>
    
    <!-- Nose - Wood Knot -->
    <ellipse cx="100" cy="145" rx="6" ry="8" fill="#654321"/>
    
    <!-- Mouth - Gentle Smile -->
    <path d="M85 155 Q100 165 115 155" stroke="#654321" stroke-width="3" fill="none"/>
    
    <!-- Hair/Leaves -->
    <circle cx="80" cy="110" r="8" fill="#228b22"/>
    <circle cx="90" cy="105" r="10" fill="#32cd32"/>
    <circle cx="100" cy="100" r="12" fill="#228b22"/>
    <circle cx="110" cy="105" r="10" fill="#32cd32"/>
    <circle cx="120" cy="110" r="8" fill="#228b22"/>
    <circle cx="85" cy="115" r="6" fill="#90ee90"/>
    <circle cx="115" cy="115" r="6" fill="#90ee90"/>
    
    <!-- Crown of Leaves -->
    <path d="M70 120 Q100 90 130 120" stroke="#228b22" stroke-width="3" fill="none"/>
    <circle cx="75" cy="115" r="5" fill="#ffd700"/>
    <circle cx="100" cy="105" r="6" fill="#ffd700"/>
    <circle cx="125" cy="115" r="5" fill="#ffd700"/>
    
    <!-- Nature's Shield -->
    <circle cx="100" cy="150" r="55" fill="none" stroke="#32cd32" stroke-width="3" opacity="0.6">
      <animate attributeName="r" values="55;65;55" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Floating Leaves -->
    <g id="floating-leaves">
      <ellipse cx="50" cy="80" rx="8" ry="4" fill="#228b22" transform="rotate(25 50 80)">
        <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" values="25 50 80;35 50 60;25 50 80" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      
      <ellipse cx="150" cy="90" rx="8" ry="4" fill="#32cd32" transform="rotate(-20 150 90)">
        <animate attributeName="cy" values="90;70;90" dur="3.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" values="-20 150 90;-30 150 70;-20 150 90" dur="3.5s" repeatCount="indefinite"/>
      </ellipse>
      
      <ellipse cx="100" cy="70" rx="10" ry="5" fill="#90ee90" transform="rotate(0 100 70)">
        <animate attributeName="cy" values="70;50;70" dur="3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" values="0 100 70;10 100 50;0 100 70" dur="3s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Nature Symbols -->
    <text x="85" y="200" font-family="serif" font-size="12" fill="#90ee90">🌿</text>
    <text x="105" y="200" font-family="serif" font-size="12" fill="#90ee90">🍃</text>
    
    <!-- Magic Sparkles -->
    <g id="nature-sparkles">
      <circle cx="60" cy="130" r="2" fill="#90ee90">
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="140" r="2" fill="#90ee90">
        <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="120" r="2" fill="#90ee90">
        <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
