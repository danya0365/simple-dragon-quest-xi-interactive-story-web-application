<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Mordegon Final Form Character -->
  <g transform="translate(100, 100)">
    <!-- Ultimate Darkness Aura -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#4B0082" stroke-width="4" opacity="0.7">
      <animate attributeName="r" values="70;85;70" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Dark Energy Field -->
    <ellipse cx="0" cy="0" rx="55" ry="65" fill="none" stroke="#8B008B" stroke-width="3" opacity="0.5">
      <animate attributeName="rx" values="55;65;55" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Main Body - Dark Lord Form -->
    <ellipse cx="0" cy="20" rx="35" ry="45" fill="#2F2F4F" stroke="#000000" stroke-width="3"/>
    
    <!-- Dark Armor Plates -->
    <path d="M -25 -15 Q -20 -10, -15 -15" fill="none" stroke="#8B008B" stroke-width="2"/>
    <path d="M 15 -15 Q 20 -10, 25 -15" fill="none" stroke="#8B008B" stroke-width="2"/>
    <path d="M -20 10 Q -15 15, -10 10" fill="none" stroke="#8B008B" stroke-width="2"/>
    <path d="M 10 10 Q 15 15, 20 10" fill="none" stroke="#8B008B" stroke-width="2"/>
    
    <!-- Head - Dark Lord -->
    <circle cx="0" cy="-30" r="20" fill="#1C1C3E" stroke="#000000" stroke-width="2"/>
    
    <!-- Horns of Darkness -->
    <g transform="translate(0, -45)">
      <!-- Left Horn -->
      <path d="M -12 -5 L -18 -20 L -15 -30 L -18 -35" fill="none" stroke="#4B0082" stroke-width="4" stroke-linecap="round"/>
      <path d="M -15 -30 L -12 -33" fill="none" stroke="#8B008B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-18" cy="-35" r="4" fill="#8B008B"/>
      
      <!-- Right Horn -->
      <path d="M 12 -5 L 18 -20 L 15 -30 L 18 -35" fill="none" stroke="#4B0082" stroke-width="4" stroke-linecap="round"/>
      <path d="M 15 -30 L 12 -33" fill="none" stroke="#8B008B" stroke-width="3" stroke-linecap="round"/>
      <circle cx="18" cy="-35" r="4" fill="#8B008B"/>
    </g>
    
    <!-- Evil Eyes - Glowing Red -->
    <circle cx="-8" cy="-30" r="4" fill="#FF0000"/>
    <circle cx="8" cy="-30" r="4" fill="#FF0000"/>
    <circle cx="-8" cy="-31" r="2" fill="#FF6347"/>
    <circle cx="8" cy="-31" r="2" fill="#FF6347"/>
    
    <!-- Dark Mouth -->
    <path d="M -10 -22 Q 0 -18, 10 -22" fill="none" stroke="#8B0000" stroke-width="2"/>
    
    <!-- Dark Wings -->
    <g transform="translate(0, 10)">
      <!-- Left Wing -->
      <path d="M -35 -20 Q -50 -10, -55 10 Q -50 20, -35 15 Q -40 5, -35 -20" fill="#2F2F4F" stroke="#000000" stroke-width="2"/>
      <path d="M -40 -15 Q -48 -8, -52 5 Q -48 12, -40 10" fill="#1C1C3E" stroke="#8B008B" stroke-width="1"/>
      
      <!-- Right Wing -->
      <path d="M 35 -20 Q 50 -10, 55 10 Q 50 20, 35 15 Q 40 5, 35 -20" fill="#2F2F4F" stroke="#000000" stroke-width="2"/>
      <path d="M 40 -15 Q 48 -8, 52 5 Q 48 12, 40 10" fill="#1C1C3E" stroke="#8B008B" stroke-width="1"/>
    </g>
    
    <!-- Dark Arms -->
    <ellipse cx="-30" cy="15" rx="12" ry="25" fill="#2F2F4F" stroke="#000000" stroke-width="2"/>
    <ellipse cx="30" cy="15" rx="12" ry="25" fill="#2F2F4F" stroke="#000000" stroke-width="2"/>
    
    <!-- Dark Hands -->
    <g transform="translate(-30, 35)">
      <circle cx="0" cy="0" r="10" fill="#1C1C3E" stroke="#000000" stroke-width="2"/>
      <!-- Claw Fingers -->
      <path d="M -5 -5 L -8 -10" stroke="#8B008B" stroke-width="2" stroke-linecap="round"/>
      <path d="M 0 -7 L 0 -12" stroke="#8B008B" stroke-width="2" stroke-linecap="round"/>
      <path d="M 5 -5 L 8 -10" stroke="#8B008B" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(30, 35)">
      <circle cx="0" cy="0" r="10" fill="#1C1C3E" stroke="#000000" stroke-width="2"/>
      <!-- Claw Fingers -->
      <path d="M -5 -5 L -8 -10" stroke="#8B008B" stroke-width="2" stroke-linecap="round"/>
      <path d="M 0 -7 L 0 -12" stroke="#8B008B" stroke-width="2" stroke-linecap="round"/>
      <path d="M 5 -5 L 8 -10" stroke="#8B008B" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Dark Legs -->
    <ellipse cx="-12" cy="65" rx="10" ry="20" fill="#2F2F4F" stroke="#000000" stroke-width="2"/>
    <ellipse cx="12" cy="65" rx="10" ry="20" fill="#2F2F4F" stroke="#000000" stroke-width="2"/>
    
    <!-- Dark Feet -->
    <g transform="translate(-12, 80)">
      <ellipse cx="0" cy="0" rx="12" ry="8" fill="#1C1C3E" stroke="#000000" stroke-width="2"/>
      <!-- Claw Toes -->
      <path d="M -6 -3 L -8 -6" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 0 -4 L 0 -7" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 6 -3 L 8 -6" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(12, 80)">
      <ellipse cx="0" cy="0" rx="12" ry="8" fill="#1C1C3E" stroke="#000000" stroke-width="2"/>
      <!-- Claw Toes -->
      <path d="M -6 -3 L -8 -6" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 0 -4 L 0 -7" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 6 -3 L 8 -6" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Dark Energy Core -->
    <circle cx="0" cy="20" r="15" fill="#4B0082" opacity="0.6" stroke="#8B008B" stroke-width="2">
      <animate attributeName="r" values="15;20;15" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Floating Dark Particles -->
    <circle cx="-40" cy="-30" r="3" fill="#8B008B" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 12,-18; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="-20" r="2.5" fill="#4B0082" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,-15; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-30" cy="40" r="2" fill="#8B0000" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,-10; 0,0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="35" r="2.8" fill="#8B008B" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; -12,-12; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- World Destroyer Energy -->
    <g transform="translate(0, 20)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#8B008B" stroke-width="2" opacity="0.5">
        <animate attributeName="r" values="25;30;25" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#4B0082" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Dark Lord Symbol -->
    <g transform="translate(0, 20)" opacity="0.9">
      <text x="-8" y="3" font-family="Arial" font-size="16" fill="#8B008B">☠</text>
    </g>
    
    <!-- Ultimate Darkness Power -->
    <circle cx="0" cy="20" r="45" fill="none" stroke="#4B0082" stroke-width="3" opacity="0.4">
      <animate attributeName="r" values="45;55;45" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Despair Incarnate Aura -->
    <g transform="translate(0, 20)">
      <path d="M -20 -20 L 20 20 M 20 -20 L -20 20" stroke="#8B0000" stroke-width="1" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M -15 -15 L 15 15 M 15 -15 L -15 15" stroke="#4B0082" stroke-width="1" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
