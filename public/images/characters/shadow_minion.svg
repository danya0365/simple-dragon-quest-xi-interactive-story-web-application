<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Shadow Minion Character -->
  <g transform="translate(100, 100)">
    <!-- Shadow Aura -->
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="none" stroke="#4B0082" stroke-width="2" opacity="0.6">
      <animate attributeName="rx" values="40;48;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Main Body - Shadow Form -->
    <ellipse cx="0" cy="15" rx="25" ry="35" fill="#1C1C3E" stroke="#000000" stroke-width="2"/>
    
    <!-- Shadow Texture -->
    <path d="M -15 -10 Q -13 -5, -10 -10" fill="none" stroke="#4B0082" stroke-width="1"/>
    <path d="M 10 -10 Q 13 -5, 15 -10" fill="none" stroke="#4B0082" stroke-width="1"/>
    <path d="M -12 5 Q -10 10, -8 5" fill="none" stroke="#4B0082" stroke-width="1"/>
    <path d="M 8 5 Q 10 10, 12 5" fill="none" stroke="#4B0082" stroke-width="1"/>
    
    <!-- Head - Shadow -->
    <circle cx="0" cy="-20" r="15" fill="#0F0F2E" stroke="#000000" stroke-width="2"/>
    
    <!-- Evil Eyes - Glowing Purple -->
    <circle cx="-5" cy="-20" r="3" fill="#8B008B"/>
    <circle cx="5" cy="-20" r="3" fill="#8B008B"/>
    <circle cx="-5" cy="-21" r="1" fill="#DA70D6"/>
    <circle cx="5" cy="-21" r="1" fill="#DA70D6"/>
    
    <!-- Shadow Mouth -->
    <path d="M -6 -15 Q 0 -12, 6 -15" fill="none" stroke="#8B008B" stroke-width="1"/>
    
    <!-- Shadow Arms -->
    <ellipse cx="-22" cy="10" rx="8" ry="20" fill="#1C1C3E" stroke="#000000" stroke-width="2"/>
    <ellipse cx="22" cy="10" rx="8" ry="20" fill="#1C1C3E" stroke="#000000" stroke-width="2"/>
    
    <!-- Shadow Hands -->
    <g transform="translate(-22, 25)">
      <circle cx="0" cy="0" r="7" fill="#0F0F2E" stroke="#000000" stroke-width="1"/>
      <!-- Shadow Claws -->
      <path d="M -3 -3 L -5 -6" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 0 -4 L 0 -7" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 3 -3 L 5 -6" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(22, 25)">
      <circle cx="0" cy="0" r="7" fill="#0F0F2E" stroke="#000000" stroke-width="1"/>
      <!-- Shadow Claws -->
      <path d="M -3 -3 L -5 -6" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 0 -4 L 0 -7" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 3 -3 L 5 -6" stroke="#8B008B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Shadow Legs -->
    <ellipse cx="-8" cy="45" rx="7" ry="15" fill="#1C1C3E" stroke="#000000" stroke-width="2"/>
    <ellipse cx="8" cy="45" rx="7" ry="15" fill="#1C1C3E" stroke="#000000" stroke-width="2"/>
    
    <!-- Shadow Feet -->
    <g transform="translate(-8, 55)">
      <ellipse cx="0" cy="0" rx="8" ry="5" fill="#0F0F2E" stroke="#000000" stroke-width="1"/>
      <!-- Shadow Claws -->
      <path d="M -4 -2 L -5 -4" stroke="#8B008B" stroke-width="1" stroke-linecap="round"/>
      <path d="M 0 -3 L 0 -5" stroke="#8B008B" stroke-width="1" stroke-linecap="round"/>
      <path d="M 4 -2 L 5 -4" stroke="#8B008B" stroke-width="1" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(8, 55)">
      <ellipse cx="0" cy="0" rx="8" ry="5" fill="#0F0F2E" stroke="#000000" stroke-width="1"/>
      <!-- Shadow Claws -->
      <path d="M -4 -2 L -5 -4" stroke="#8B008B" stroke-width="1" stroke-linecap="round"/>
      <path d="M 0 -3 L 0 -5" stroke="#8B008B" stroke-width="1" stroke-linecap="round"/>
      <path d="M 4 -2 L 5 -4" stroke="#8B008B" stroke-width="1" stroke-linecap="round"/>
    </g>
    
    <!-- Dark Energy Core -->
    <circle cx="0" cy="15" r="10" fill="#4B0082" opacity="0.5" stroke="#8B008B" stroke-width="1">
      <animate attributeName="r" values="10;13;10" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Floating Shadow Particles -->
    <circle cx="-25" cy="-15" r="2" fill="#8B008B" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,-12; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="-10" r="1.5" fill="#4B0082" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; -6,-10; 0,0" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-20" cy="25" r="1" fill="#8B0000" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-8; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="20" r="1.8" fill="#8B008B" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-10; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Shadow Strike Energy -->
    <g transform="translate(0, 15)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#8B008B" stroke-width="1" opacity="0.4">
        <animate attributeName="r" values="15;18;15" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.5">
        <animate attributeName="r" values="12;15;12" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Dark Bind Power -->
    <g transform="translate(0, 15)">
      <path d="M -10 -10 L 10 10 M 10 -10 L -10 10" stroke="#8B008B" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Shadow Minion Symbol -->
    <g transform="translate(0, 15)" opacity="0.8">
      <text x="-6" y="3" font-family="Arial" font-size="12" fill="#8B008B">👤</text>
    </g>
    
    <!-- Shadow Movement Effect -->
    <ellipse cx="0" cy="15" rx="30" ry="40" fill="none" stroke="#4B0082" stroke-width="1" opacity="0.3">
      <animate attributeName="rx" values="30;35;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Dark Servant Aura -->
    <circle cx="0" cy="15" r="25" fill="none" stroke="#8B008B" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="25;30;25" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
