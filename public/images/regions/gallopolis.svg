<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Gallopolis - Desert Kingdom Region -->
  
  <!-- Desert background -->
  <rect width="128" height="128" fill="#F4A460"/>
  
  <!-- Sand dunes -->
  <ellipse cx="32" cy="100" rx="40" ry="25" fill="#DEB887" opacity="0.8"/>
  <ellipse cx="96" cy="110" rx="35" ry="20" fill="#D2691E" opacity="0.7"/>
  
  <!-- City walls -->
  <rect x="20" y="40" width="88" height="50" fill="#CD853F" stroke="#8B4513" stroke-width="2"/>
  <rect x="25" y="45" width="78" height="40" fill="#DEB887"/>
  
  <!-- Palace/tower -->
  <rect x="50" y="20" width="28" height="40" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
  <polygon points="50,20 64,8 78,20" fill="#8B4513"/>
  
  <!-- Arena (circular) -->
  <circle cx="90" cy="65" r="15" fill="#CD853F" stroke="#8B4513" stroke-width="2"/>
  <circle cx="90" cy="65" r="10" fill="#F4A460"/>
  
  <!-- Horse racing track -->
  <ellipse cx="64" cy="95" rx="50" ry="8" fill="none" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Palm trees -->
  <line x1="15" y1="60" x2="15" y2="40" stroke="#8B4513" stroke-width="3"/>
  <circle cx="15" cy="35" r="8" fill="#228B22"/>
  
  <line x1="113" y1="70" x2="113" y2="50" stroke="#8B4513" stroke-width="3"/>
  <circle cx="113" cy="45" r="8" fill="#228B22"/>
  
  <!-- Sun -->
  <circle cx="110" cy="20" r="12" fill="#FFD700"/>
  
  <!-- Desert wind effect -->
  <path d="M 10 80 Q 30 75 50 80 T 90 80 T 120 80" stroke="#FFF8DC" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
