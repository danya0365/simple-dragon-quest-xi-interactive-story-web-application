<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Desert Sky -->
  <defs>
    <linearGradient id="desertSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#F4A460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="desertSand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="buildingColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CD853F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky Background -->
  <rect width="400" height="200" fill="url(#desertSky)"/>
  
  <!-- Sun -->
  <circle cx="320" cy="60" r="25" fill="#FFD700" opacity="0.9"/>
  
  <!-- Desert Ground -->
  <rect y="200" width="400" height="100" fill="url(#desertSand)"/>
  
  <!-- Sand Dunes -->
  <ellipse cx="50" cy="210" rx="40" ry="15" fill="#D2691E" opacity="0.7"/>
  <ellipse cx="150" cy="215" rx="35" ry="12" fill="#DEB887" opacity="0.6"/>
  <ellipse cx="350" cy="208" rx="45" ry="18" fill="#D2691E" opacity="0.7"/>
  
  <!-- City Walls -->
  <rect x="80" y="120" width="240" height="80" fill="url(#buildingColor)" stroke="#8B4513" stroke-width="2"/>
  
  <!-- City Gate -->
  <rect x="180" y="160" width="40" height="40" fill="#654321"/>
  <path d="M 180 160 Q 200 140 220 160" fill="#8B4513"/>
  
  <!-- Towers -->
  <rect x="70" y="100" width="20" height="100" fill="url(#buildingColor)" stroke="#8B4513" stroke-width="2"/>
  <rect x="310" y="100" width="20" height="100" fill="url(#buildingColor)" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Tower Tops -->
  <polygon points="70,100 80,85 90,100" fill="#8B4513"/>
  <polygon points="310,100 320,85 330,100" fill="#8B4513"/>
  
  <!-- Arena (Horse Racing Track) -->
  <ellipse cx="200" cy="150" rx="60" ry="30" fill="#CD853F" stroke="#8B4513" stroke-width="2"/>
  <ellipse cx="200" cy="150" rx="40" ry="20" fill="#DEB887"/>
  
  <!-- Palace Building -->
  <rect x="140" y="110" width="120" height="40" fill="#F4A460" stroke="#8B4513" stroke-width="2"/>
  <polygon points="140,110 200,90 260,110" fill="#D2691E"/>
  
  <!-- Palace Windows -->
  <rect x="155" y="120" width="10" height="15" fill="#654321"/>
  <rect x="175" y="120" width="10" height="15" fill="#654321"/>
  <rect x="195" y="120" width="10" height="15" fill="#654321"/>
  <rect x="215" y="120" width="10" height="15" fill="#654321"/>
  <rect x="235" y="120" width="10" height="15" fill="#654321"/>
  
  <!-- Horse Silhouettes -->
  <g transform="translate(120, 140) scale(0.8)">
    <path d="M 0,0 Q 5,-5 10,-3 Q 15,-5 20,-2 Q 25,-4 30,0 Q 28,5 25,8 Q 20,10 15,8 Q 10,10 5,8 Q 2,5 0,0" fill="#8B4513"/>
    <rect x="8" y="8" width="2" height="8" fill="#8B4513"/>
    <rect x="18" y="8" width="2" height="8" fill="#8B4513"/>
  </g>
  
  <g transform="translate(250, 145) scale(0.7)">
    <path d="M 0,0 Q 5,-5 10,-3 Q 15,-5 20,-2 Q 25,-4 30,0 Q 28,5 25,8 Q 20,10 15,8 Q 10,10 5,8 Q 2,5 0,0" fill="#A0522D"/>
    <rect x="8" y="8" width="2" height="8" fill="#A0522D"/>
    <rect x="18" y="8" width="2" height="8" fill="#A0522D"/>
  </g>
  
  <!-- Flags -->
  <rect x="85" y="85" width="2" height="20" fill="#8B4513"/>
  <polygon points="87,85 95,80 87,75" fill="#FF6347"/>
  
  <rect x="315" y="85" width="2" height="20" fill="#8B4513"/>
  <polygon points="317,85 325,80 317,75" fill="#FF6347"/>
  
  <!-- Combat Arena Symbol -->
  <circle cx="200" cy="150" r="8" fill="none" stroke="#8B4513" stroke-width="2"/>
  <path d="M 195,150 L 205,150 M 200,145 L 200,155" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Title -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B4513">Gallopolis</text>
</svg>
