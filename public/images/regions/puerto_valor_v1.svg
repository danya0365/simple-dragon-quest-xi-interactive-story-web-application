<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Mediterranean coastal city scene -->
  <rect width="400" height="300" fill="#87CEEB"/>
  
  <!-- Ocean waves -->
  <path d="M0 200 Q50 190 100 200 T200 200 T300 200 T400 200 L400 300 L0 300 Z" fill="#4682B4" opacity="0.8"/>
  <path d="M0 220 Q50 210 100 220 T200 220 T300 220 T400 220 L400 300 L0 300 Z" fill="#1E90FF" opacity="0.6"/>
  
  <!-- Beach sand -->
  <path d="M0 180 Q100 170 200 180 T400 180 L400 300 L0 300 Z" fill="#F4A460"/>
  
  <!-- City buildings -->
  <!-- Main harbor building -->
  <rect x="50" y="120" width="80" height="60" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
  <rect x="60" y="130" width="15" height="20" fill="#87CEEB" opacity="0.7"/>
  <rect x="85" y="130" width="15" height="20" fill="#87CEEB" opacity="0.7"/>
  <rect x="110" y="130" width="15" height="20" fill="#87CEEB" opacity="0.7"/>
  <polygon points="50,120 90,90 130,120" fill="#8B4513"/>
  
  <!-- Casino building -->
  <rect x="150" y="100" width="100" height="80" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
  <rect x="160" y="110" width="20" height="25" fill="#87CEEB" opacity="0.7"/>
  <rect x="190" y="110" width="20" height="25" fill="#87CEEB" opacity="0.7"/>
  <rect x="220" y="110" width="20" height="25" fill="#87CEEB" opacity="0.7"/>
  <polygon points="150,100 200,70 250,100" fill="#B8860B"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial" font-size="12" fill="#8B0000">CASINO</text>
  
  <!-- Lighthouse -->
  <rect x="280" y="80" width="30" height="100" fill="#F5F5DC" stroke="#D3D3D3" stroke-width="2"/>
  <polygon points="280,80 295,60 310,80" fill="#DC143C"/>
  <circle cx="295" cy="70" r="8" fill="#FFFF00" opacity="0.9"/>
  
  <!-- Ships in harbor -->
  <!-- Ship 1 -->
  <path d="M20 160 L60 160 L55 180 L25 180 Z" fill="#8B4513"/>
  <rect x="35" y="140" width="10" height="20" fill="#FFFFFF"/>
  <polygon points="35,140 40,130 45,140" fill="#FF0000"/>
  
  <!-- Ship 2 -->
  <path d="M320 170 L360 170 L355 190 L325 190 Z" fill="#654321"/>
  <rect x="335" y="150" width="10" height="20" fill="#FFFFFF"/>
  <polygon points="335,150 340,140 345,150" fill="#0000FF"/>
  
  <!-- Palm trees -->
  <!-- Palm tree 1 -->
  <rect x="120" y="140" width="8" height="40" fill="#8B4513"/>
  <circle cx="124" cy="135" r="15" fill="#228B22" opacity="0.8"/>
  <circle cx="115" cy="130" r="12" fill="#32CD32" opacity="0.8"/>
  <circle cx="133" cy="130" r="12" fill="#32CD32" opacity="0.8"/>
  
  <!-- Palm tree 2 -->
  <rect x="270" y="150" width="8" height="30" fill="#8B4513"/>
  <circle cx="274" cy="145" r="15" fill="#228B22" opacity="0.8"/>
  <circle cx="265" cy="140" r="12" fill="#32CD32" opacity="0.8"/>
  <circle cx="283" cy="140" r="12" fill="#32CD32" opacity="0.8"/>
  
  <!-- Seagulls -->
  <path d="M80 50 Q85 45 90 50" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M150 40 Q155 35 160 40" fill="none" stroke="#000000" stroke-width="2"/>
  <path d="M250 60 Q255 55 260 60" fill="none" stroke="#000000" stroke-width="2"/>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="25" fill="#FFD700" opacity="0.8"/>
  <path d="M350 20 L350 30 M350 70 L350 80 M320 50 L330 50 M370 50 L380 50 M325 25 L332 32 M368 32 L375 25 M325 75 L332 68 M368 68 L375 75" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#000080">Puerto Valor</text>
</svg>
