<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Nautica - The Mermaid's Kingdom (with background) -->
  
  <defs>
    <!-- Ocean Background Gradient -->
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#001f3f;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#003366;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#004080;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Coral Reef Gradient -->
    <radialGradient id="coralGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#feca57;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ff9ff3;stop-opacity:0.4"/>
    </radialGradient>
    
    <!-- Palace Light Gradient -->
    <radialGradient id="palaceLightGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="30%" style="stop-color:#87ceeb;stop-opacity:0.7"/>
      <stop offset="70%" style="stop-color:#4682b4;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#1e90ff;stop-opacity:0.3"/>
    </radialGradient>
    
    <!-- Water Ripple Effect -->
    <filter id="waterRipple">
      <feTurbulence baseFrequency="0.02" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- Ocean Background -->
  <rect width="400" height="300" fill="url(#oceanGradient)"/>
  
  <!-- Deep Ocean Layers -->
  <rect x="0" y="200" width="400" height="100" fill="#001a33" opacity="0.8"/>
  <rect x="0" y="250" width="400" height="50" fill="#000d1a" opacity="0.9"/>
  
  <!-- Sunlight Rays from Surface -->
  <g opacity="0.3">
    <path d="M 50 0 L 80 300 L 120 300 L 90 0 Z" fill="#87ceeb">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 0 L 180 300 L 220 300 L 190 0 Z" fill="#87ceeb">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 250 0 L 280 300 L 320 300 L 290 0 Z" fill="#87ceeb">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" begin="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Coral Reef on Ocean Floor -->
  <ellipse cx="100" cy="280" rx="40" ry="15" fill="url(#coralGradient)"/>
  <ellipse cx="300" cy="275" rx="35" ry="12" fill="url(#coralGradient)"/>
  <ellipse cx="200" cy="285" rx="30" ry="10" fill="url(#coralGradient)"/>
  
  <!-- Seaweed -->
  <g opacity="0.7">
    <path d="M 80 300 Q 75 280, 85 260 Q 80 240, 90 220" fill="none" stroke="#228b22" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="M 80 300 Q 75 280, 85 260 Q 80 240, 90 220; M 80 300 Q 85 280, 75 260 Q 80 240, 70 220; M 80 300 Q 75 280, 85 260 Q 80 240, 90 220" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 320 300 Q 315 285, 325 270 Q 320 255, 330 240" fill="none" stroke="#32cd32" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="M 320 300 Q 315 285, 325 270 Q 320 255, 330 240; M 320 300 Q 325 285, 315 270 Q 320 255, 310 240; M 320 300 Q 315 285, 325 270 Q 320 255, 330 240" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Mermaid Palace -->
  <g transform="translate(200, 150)">
    <!-- Palace Base -->
    <ellipse cx="0" cy="50" rx="80" ry="30" fill="#4682b4" stroke="#1e90ff" stroke-width="2"/>
    
    <!-- Palace Towers -->
    <rect x="-60" y="20" width="20" height="40" fill="#5f9ea0" stroke="#4682b4" stroke-width="1"/>
    <rect x="-20" y="10" width="20" height="50" fill="#5f9ea0" stroke="#4682b4" stroke-width="1"/>
    <rect x="20" y="10" width="20" height="50" fill="#5f9ea0" stroke="#4682b4" stroke-width="1"/>
    <rect x="60" y="20" width="20" height="40" fill="#5f9ea0" stroke="#4682b4" stroke-width="1"/>
    
    <!-- Tower Spires -->
    <path d="M -60 20 L -50 0 L -40 20" fill="#ffd700" stroke="#ffb347" stroke-width="1"/>
    <path d="M -20 10 L -10 -10 L 0 10" fill="#ffd700" stroke="#ffb347" stroke-width="1"/>
    <path d="M 20 10 L 30 -10 L 40 10" fill="#ffd700" stroke="#ffb347" stroke-width="1"/>
    <path d="M 60 20 L 70 0 L 80 20" fill="#ffd700" stroke="#ffb347" stroke-width="1"/>
    
    <!-- Palace Windows -->
    <circle cx="-50" cy="35" r="3" fill="#ffff00">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-10" cy="30" r="3" fill="#ffff00">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="30" r="3" fill="#ffff00">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="35" r="3" fill="#ffff00">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Palace Gate -->
    <rect x="-15" y="40" width="30" height="20" fill="#8b4513" stroke="#654321" stroke-width="1"/>
    <circle cx="0" cy="50" r="2" fill="#ffd700"/>
    
    <!-- Magical Palace Aura -->
    <circle cx="0" cy="30" r="60" fill="url(#palaceLightGradient)" filter="url(#waterRipple)">
      <animate attributeName="r" values="60;70;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Swimming Fish -->
  <g opacity="0.8">
    <ellipse cx="50" cy="100" rx="15" ry="8" fill="#ff6347" stroke="#dc143c" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,5; 0,0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="350" cy="120" rx="12" ry="6" fill="#ffa500" stroke="#ff8c00" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0; -25,8; 0,0" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="150" cy="180" rx="10" ry="5" fill="#ffff00" stroke="#ffd700" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,-5; 0,0" dur="7s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Water Bubbles -->
  <g opacity="0.6">
    <circle cx="80" cy="250" r="2" fill="#87ceeb">
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,-30; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="260" r="1.5" fill="#87ceeb">
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,-35; 0,0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="270" r="1" fill="#87ceeb">
      <animateTransform attributeName="transform" type="translate" values="0,0; -3,-25; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="240" r="1.8" fill="#87ceeb">
      <animateTransform attributeName="transform" type="translate" values="0,0; 6,-28; 0,0" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Pearl Gardens -->
  <g transform="translate(100, 220)">
    <circle cx="0" cy="0" r="4" fill="#f8f8ff" stroke="#e6e6fa" stroke-width="0.5">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="5" r="3" fill="#fffaf0" stroke="#f0f8ff" stroke-width="0.5">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-10" cy="8" r="3.5" fill="#ffefd5" stroke="#fff0f5" stroke-width="0.5">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="-5" r="2.5" fill="#faf0e6" stroke="#fff5ee" stroke-width="0.5">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g transform="translate(300, 210)">
    <circle cx="0" cy="0" r="3.5" fill="#f8f8ff" stroke="#e6e6fa" stroke-width="0.5">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="4" r="2.8" fill="#fffaf0" stroke="#f0f8ff" stroke-width="0.5">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-8" cy="6" r="3" fill="#ffefd5" stroke="#fff0f5" stroke-width="0.5">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">Nautica</text>
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="14" fill="#87ceeb" text-anchor="middle" opacity="0.8">The Mermaid's Kingdom</text>
</svg>
