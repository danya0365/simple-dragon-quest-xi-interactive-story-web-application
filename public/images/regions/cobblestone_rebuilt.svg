<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#98D8E8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#B0E0E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ground gradient -->
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#7CFC00;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    
    <!-- House gradient -->
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F4A460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Roof gradient -->
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    
    <!-- Chapel gradient -->
    <linearGradient id="chapelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5DC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFAF0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0E68C;stop-opacity:1" />
    </linearGradient>
    
    <!-- Happiness aura gradient -->
    <radialGradient id="happinessAura" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.4" />
      <stop offset="30%" style="stop-color:#FFA500;stop-opacity:0.3" />
      <stop offset="60%" style="stop-color:#FF69B4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FFB6C1;stop-opacity:0.1" />
    </radialGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#skyGradient)"/>
  
  <!-- Happiness aura overlay -->
  <rect width="800" height="600" fill="url(#happinessAura)" opacity="0.6"/>
  
  <!-- Sun -->
  <circle cx="700" cy="100" r="50" fill="#FFD700" filter="url(#glow)">
    <animate attributeName="r" 
             values="50;55;50" 
             dur="4s" 
             repeatCount="indefinite"/>
  </circle>
  
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="2" opacity="0.6">
    <line x1="700" y1="30" x2="700" y2="10">
      <animate attributeName="opacity" 
               values="0.6;0.9;0.6" 
               dur="2s" 
               repeatCount="indefinite"/>
    </line>
    <line x1="750" y1="50" x2="765" y2="35">
      <animate attributeName="opacity" 
               values="0.6;0.9;0.6" 
               dur="2s" 
               begin="0.25s"
               repeatCount="indefinite"/>
    </line>
    <line x1="770" y1="100" x2="790" y2="100">
      <animate attributeName="opacity" 
               values="0.6;0.9;0.6" 
               dur="2s" 
               begin="0.5s"
               repeatCount="indefinite"/>
    </line>
    <line x1="750" y1="150" x2="765" y2="165">
      <animate attributeName="opacity" 
               values="0.6;0.9;0.6" 
               dur="2s" 
               begin="0.75s"
               repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="170" x2="700" y2="190">
      <animate attributeName="opacity" 
               values="0.6;0.9;0.6" 
               dur="2s" 
               begin="1s"
               repeatCount="indefinite"/>
    </line>
    <line x1="650" y1="150" x2="635" y2="165">
      <animate attributeName="opacity" 
               values="0.6;0.9;0.6" 
               dur="2s" 
               begin="1.25s"
               repeatCount="indefinite"/>
    </line>
    <line x1="630" y1="100" x2="610" y2="100">
      <animate attributeName="opacity" 
               values="0.6;0.9;0.6" 
               dur="2s" 
               begin="1.5s"
               repeatCount="indefinite"/>
    </line>
    <line x1="650" y1="50" x2="635" y2="35">
      <animate attributeName="opacity" 
               values="0.6;0.9;0.6" 
               dur="2s" 
               begin="1.75s"
               repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Clouds -->
  <g opacity="0.8">
    <ellipse cx="150" cy="80" rx="40" ry="20" fill="#FFFFFF"/>
    <ellipse cx="180" cy="75" rx="50" ry="25" fill="#FFFFFF"/>
    <ellipse cx="210" cy="80" rx="35" ry="18" fill="#FFFFFF"/>
    
    <ellipse cx="550" cy="120" rx="45" ry="22" fill="#FFFFFF"/>
    <ellipse cx="580" cy="115" rx="40" ry="20" fill="#FFFFFF"/>
    <ellipse cx="610" cy="120" rx="30" ry="15" fill="#FFFFFF"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="400" width="800" height="200" fill="url(#groundGradient)"/>
  
  <!-- Village path -->
  <path d="M 0,500 Q 200,480 400,500 T 800,500" 
        fill="none" 
        stroke="#D2691E" 
        stroke-width="40" 
        opacity="0.8"/>
  <path d="M 0,500 Q 200,480 400,500 T 800,500" 
        fill="none" 
        stroke="#DEB887" 
        stroke-width="35" 
        opacity="0.6"/>
  
  <!-- Main houses -->
  <g>
    <!-- House 1 -->
    <g transform="translate(150, 320)">
      <rect x="-40" y="0" width="80" height="80" fill="url(#houseGradient)" stroke="#8B4513" stroke-width="2" filter="url(#shadow)"/>
      <polygon points="-50,0 0,-40 50,0" fill="url(#roofGradient)" stroke="#654321" stroke-width="2"/>
      <rect x="-15" y="20" width="30" height="40" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
      <rect x="-30" y="50" width="15" height="30" fill="#8B4513" stroke="#654321" stroke-width="1"/>
      <rect x="15" y="50" width="15" height="30" fill="#8B4513" stroke="#654321" stroke-width="1"/>
      <!-- Window glow -->
      <rect x="-15" y="20" width="30" height="40" fill="#FFD700" opacity="0.3"/>
    </g>
    
    <!-- House 2 -->
    <g transform="translate(300, 340)">
      <rect x="-35" y="0" width="70" height="60" fill="url(#houseGradient)" stroke="#8B4513" stroke-width="2" filter="url(#shadow)"/>
      <polygon points="-40,0 0,-30 40,0" fill="url(#roofGradient)" stroke="#654321" stroke-width="2"/>
      <rect x="-12" y="15" width="24" height="30" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
      <rect x="-25" y="35" width="12" height="25" fill="#8B4513" stroke="#654321" stroke-width="1"/>
      <rect x="13" y="35" width="12" height="25" fill="#8B4513" stroke="#654321" stroke-width="1"/>
      <!-- Window glow -->
      <rect x="-12" y="15" width="24" height="30" fill="#FFD700" opacity="0.3"/>
    </g>
    
    <!-- House 3 -->
    <g transform="translate(500, 330)">
      <rect x="-45" y="0" width="90" height="70" fill="url(#houseGradient)" stroke="#8B4513" stroke-width="2" filter="url(#shadow)"/>
      <polygon points="-55,0 0,-35 55,0" fill="url(#roofGradient)" stroke="#654321" stroke-width="2"/>
      <rect x="-17" y="18" width="34" height="35" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
      <rect x="-35" y="40" width="15" height="30" fill="#8B4513" stroke="#654321" stroke-width="1"/>
      <rect x="20" y="40" width="15" height="30" fill="#8B4513" stroke="#654321" stroke-width="1"/>
      <!-- Window glow -->
      <rect x="-17" y="18" width="34" height="35" fill="#FFD700" opacity="0.3"/>
    </g>
    
    <!-- House 4 -->
    <g transform="translate(650, 350)">
      <rect x="-30" y="0" width="60" height="50" fill="url(#houseGradient)" stroke="#8B4513" stroke-width="2" filter="url(#shadow)"/>
      <polygon points="-35,0 0,-25 35,0" fill="url(#roofGradient)" stroke="#654321" stroke-width="2"/>
      <rect x="-10" y="12" width="20" height="25" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
      <rect x="-22" y="28" width="10" height="22" fill="#8B4513" stroke="#654321" stroke-width="1"/>
      <rect x="12" y="28" width="10" height="22" fill="#8B4513" stroke="#654321" stroke-width="1"/>
      <!-- Window glow -->
      <rect x="-10" y="12" width="20" height="25" fill="#FFD700" opacity="0.3"/>
    </g>
  </g>
  
  <!-- Village square -->
  <g transform="translate(400, 450)">
    <rect x="-80" y="-40" width="160" height="80" fill="#90EE90" stroke="#228B22" stroke-width="2" opacity="0.7"/>
    <!-- Fountain -->
    <circle cx="0" cy="0" r="25" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="#B0E0E6" stroke="#87CEEB" stroke-width="1"/>
    <circle cx="0" cy="0" r="8" fill="#E0F6FF" stroke="#B0E0E6" stroke-width="1"/>
    <!-- Water sparkles -->
    <circle cx="-5" cy="-5" r="1" fill="#FFFFFF">
      <animate attributeName="opacity" 
               values="0.8;0.2;0.8" 
               dur="2s" 
               repeatCount="indefinite"/>
    </circle>
    <circle cx="5" cy="3" r="1" fill="#FFFFFF">
      <animate attributeName="opacity" 
               values="0.8;0.2;0.8" 
               dur="2s" 
               begin="1s"
               repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Chapel -->
  <g transform="translate(400, 280)">
    <rect x="-40" y="0" width="80" height="100" fill="url(#chapelGradient)" stroke="#DAA520" stroke-width="2" filter="url(#shadow)"/>
    <polygon points="-50,0 0,-50 50,0" fill="url(#roofGradient)" stroke="#654321" stroke-width="2"/>
    <!-- Cross -->
    <rect x="-2" y="-70" width="4" height="30" fill="#8B4513"/>
    <rect x="-8" y="-60" width="16" height="4" fill="#8B4513"/>
    <!-- Chapel door -->
    <rect x="-12" y="60" width="24" height="40" fill="#8B4513" stroke="#654321" stroke-width="1"/>
    <circle cx="8" cy="80" r="2" fill="#FFD700"/>
    <!-- Chapel windows -->
    <rect x="-30" y="20" width="15" height="20" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
    <rect x="15" y="20" width="15" height="20" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
    <!-- Window glow -->
    <rect x="-30" y="20" width="15" height="20" fill="#FFD700" opacity="0.3"/>
    <rect x="15" y="20" width="15" height="20" fill="#FFD700" opacity="0.3"/>
  </g>
  
  <!-- Trees -->
  <g>
    <!-- Tree 1 -->
    <g transform="translate(80, 380)">
      <rect x="-5" y="0" width="10" height="40" fill="#8B4513"/>
      <circle cx="0" cy="-10" r="25" fill="#228B22"/>
      <circle cx="-10" cy="-5" r="20" fill="#32CD32"/>
      <circle cx="10" cy="-5" r="20" fill="#32CD32"/>
    </g>
    
    <!-- Tree 2 -->
    <g transform="translate(720, 390)">
      <rect x="-5" y="0" width="10" height="30" fill="#8B4513"/>
      <circle cx="0" cy="-8" r="20" fill="#228B22"/>
      <circle cx="-8" cy="-3" r="15" fill="#32CD32"/>
      <circle cx="8" cy="-3" r="15" fill="#32CD32"/>
    </g>
    
    <!-- Tree 3 -->
    <g transform="translate(50, 450)">
      <rect x="-4" y="0" width="8" height="35" fill="#8B4513"/>
      <circle cx="0" cy="-8" r="18" fill="#228B22"/>
      <circle cx="-6" cy="-3" r="14" fill="#32CD32"/>
      <circle cx="6" cy="-3" r="14" fill="#32CD32"/>
    </g>
    
    <!-- Tree 4 -->
    <g transform="translate(750, 460)">
      <rect x="-4" y="0" width="8" height="25" fill="#8B4513"/>
      <circle cx="0" cy="-6" r="15" fill="#228B22"/>
      <circle cx="-5" cy="-2" r="12" fill="#32CD32"/>
      <circle cx="5" cy="-2" r="12" fill="#32CD32"/>
    </g>
  </g>
  
  <!-- Flowers -->
  <g opacity="0.8">
    <circle cx="120" cy="480" r="3" fill="#FF69B4"/>
    <circle cx="125" cy="485" r="2" fill="#FFB6C1"/>
    <circle cx="115" cy="485" r="2" fill="#FFB6C1"/>
    
    <circle cx="680" cy="470" r="3" fill="#FFD700"/>
    <circle cx="685" cy="475" r="2" fill="#FFA500"/>
    <circle cx="675" cy="475" r="2" fill="#FFA500"/>
    
    <circle cx="250" cy="490" r="3" fill="#FF69B4"/>
    <circle cx="255" cy="495" r="2" fill="#FFB6C1"/>
    <circle cx="245" cy="495" r="2" fill="#FFB6C1"/>
    
    <circle cx="550" cy="485" r="3" fill="#FFD700"/>
    <circle cx="555" cy="490" r="2" fill="#FFA500"/>
    <circle cx="545" cy="490" r="2" fill="#FFA500"/>
  </g>
  
  <!-- Floating happiness hearts -->
  <g opacity="0.7">
    <path d="M 200,200 C 198,198 195,198 195,201 C 195,204 200,210 200,210 C 200,210 205,204 205,201 C 205,198 202,198 200,200 Z" 
          fill="#FF69B4">
      <animate attributeName="cy" 
               values="200;180;200" 
               dur="4s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.7;0.3;0.7" 
               dur="4s" 
               repeatCount="indefinite"/>
    </path>
    <path d="M 600,150 C 598,148 595,148 595,151 C 595,154 600,160 600,160 C 600,160 605,154 605,151 C 605,148 602,148 600,150 Z" 
          fill="#FFB6C1">
      <animate attributeName="cy" 
               values="150;130;150" 
               dur="3.5s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.7;0.3;0.7" 
               dur="3.5s" 
               repeatCount="indefinite"/>
    </path>
    <path d="M 400,100 C 398,98 395,98 395,101 C 395,104 400,110 400,110 C 400,110 405,104 405,101 C 405,98 402,98 400,100 Z" 
          fill="#FF69B4">
      <animate attributeName="cy" 
               values="100;80;100" 
               dur="4.5s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.7;0.3;0.7" 
               dur="4.5s" 
               repeatCount="indefinite"/>
    </path>
  </g>
  
  -- Birds -->
  <g stroke="#000000" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 100,50 Q 105,45 110,50">
      <animate attributeName="d" 
               values="M 100,50 Q 105,45 110,50;
                       M 110,50 Q 115,45 120,50;
                       M 100,50 Q 105,45 110,50" 
               dur="8s" 
               repeatCount="indefinite"/>
    </path>
    <path d="M 300,80 Q 305,75 310,80">
      <animate attributeName="d" 
               values="M 300,80 Q 305,75 310,80;
                       M 310,80 Q 315,75 320,80;
                       M 300,80 Q 305,75 310,80" 
               dur="10s" 
               repeatCount="indefinite"/>
    </path>
  </g>
</svg>
