<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Dark dungeon walls -->
  <rect width="400" height="300" fill="#2F2F2F"/>
  
  <!-- Dungeon floor -->
  <rect y="200" width="400" height="100" fill="#1C1C1C"/>
  
  <!-- Dungeon walls with brick pattern -->
  <g id="left-wall">
    <rect x="0" y="50" width="200" height="150" fill="#4A4A4A"/>
    <!-- Brick pattern -->
    <g stroke="#3A3A3A" stroke-width="1" fill="none">
      <line x1="0" y1="70" x2="200" y2="70"/>
      <line x1="0" y1="90" x2="200" y2="90"/>
      <line x1="0" y1="110" x2="200" y2="110"/>
      <line x1="0" y1="130" x2="200" y2="130"/>
      <line x1="0" y1="150" x2="200" y2="150"/>
      <line x1="0" y1="170" x2="200" y2="170"/>
      <line x1="0" y1="190" x2="200" y2="190"/>
      
      <line x1="40" y1="50" x2="40" y2="200"/>
      <line x1="80" y1="50" x2="80" y2="200"/>
      <line x1="120" y1="50" x2="120" y2="200"/>
      <line x1="160" y1="50" x2="160" y2="200"/>
    </g>
  </g>
  
  <g id="right-wall">
    <rect x="200" y="50" width="200" height="150" fill="#3A3A3A"/>
    <!-- Brick pattern -->
    <g stroke="#2A2A2A" stroke-width="1" fill="none">
      <line x1="200" y1="70" x2="400" y2="70"/>
      <line x1="200" y1="90" x2="400" y2="90"/>
      <line x1="200" y1="110" x2="400" y2="110"/>
      <line x1="200" y1="130" x2="400" y2="130"/>
      <line x1="200" y1="150" x2="400" y2="150"/>
      <line x1="200" y1="170" x2="400" y2="170"/>
      <line x1="200" y1="190" x2="400" y2="190"/>
      
      <line x1="240" y1="50" x2="240" y2="200"/>
      <line x1="280" y1="50" x2="280" y2="200"/>
      <line x1="320" y1="50" x2="320" y2="200"/>
      <line x1="360" y1="50" x2="360" y2="200"/>
    </g>
  </g>
  
  <!-- Prison cells -->
  <g id="cell-a">
    <rect x="20" y="100" width="80" height="80" fill="none" stroke="#8B4513" stroke-width="4"/>
    <line x1="60" y1="100" x2="60" y2="180" stroke="#8B4513" stroke-width="2"/>
    <line x1="20" y1="140" x2="100" y2="140" stroke="#8B4513" stroke-width="2"/>
    <!-- Cell door -->
    <rect x="45" y="160" width="30" height="20" fill="#654321"/>
    <circle cx="70" cy="170" r="2" fill="#FFD700"/>
  </g>
  
  <g id="cell-b">
    <rect x="300" y="100" width="80" height="80" fill="none" stroke="#8B4513" stroke-width="4"/>
    <line x1="340" y1="100" x2="340" y2="180" stroke="#8B4513" stroke-width="2"/>
    <line x1="300" y1="140" x2="380" y2="140" stroke="#8B4513" stroke-width="2"/>
    <!-- Cell door -->
    <rect x="325" y="160" width="30" height="20" fill="#654321"/>
    <circle cx="350" cy="170" r="2" fill="#FFD700"/>
  </g>
  
  <!-- Torches for lighting -->
  <g id="torch1">
    <rect x="150" y="80" width="4" height="20" fill="#8B4513"/>
    <ellipse cx="152" cy="75" rx="8" ry="12" fill="#FF4500" opacity="0.8"/>
    <ellipse cx="152" cy="73" rx="5" ry="8" fill="#FFD700"/>
    <!-- Light effect -->
    <circle cx="152" cy="80" r="30" fill="#FF4500" opacity="0.2"/>
  </g>
  
  <g id="torch2">
    <rect x="250" y="80" width="4" height="20" fill="#8B4513"/>
    <ellipse cx="252" cy="75" rx="8" ry="12" fill="#FF4500" opacity="0.8"/>
    <ellipse cx="252" cy="73" rx="5" ry="8" fill="#FFD700"/>
    <!-- Light effect -->
    <circle cx="252" cy="80" r="30" fill="#FF4500" opacity="0.2"/>
  </g>
  
  <!-- Chains on wall -->
  <g id="chains">
    <circle cx="30" cy="120" r="3" fill="#696969"/>
    <line x1="30" y1="123" x2="30" y2="160" stroke="#696969" stroke-width="2"/>
    <circle cx="30" cy="163" r="3" fill="#696969"/>
    
    <circle cx="370" cy="120" r="3" fill="#696969"/>
    <line x1="370" y1="123" x2="370" y2="160" stroke="#696969" stroke-width="2"/>
    <circle cx="370" cy="163" r="3" fill="#696969"/>
  </g>
  
  <!-- Dungeon floor cracks -->
  <g stroke="#0A0A0A" stroke-width="1" fill="none">
    <path d="M 50 220 Q 70 225 90 220"/>
    <path d="M 150 230 Q 170 235 190 230"/>
    <path d="M 250 225 Q 270 230 290 225"/>
    <path d="M 320 235 Q 340 240 360 235"/>
  </g>
  
  <!-- Dark atmosphere overlay -->
  <rect width="400" height="300" fill="black" opacity="0.3"/>
</svg>
