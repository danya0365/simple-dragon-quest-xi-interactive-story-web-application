<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Sky -->
  <rect width="400" height="180" fill="#4682B4"/>
  
  <!-- Background - Ground -->
  <rect y="180" width="400" height="120" fill="#696969"/>
  
  <!-- Heliodor Castle -->
  <g id="castle">
    <!-- Main castle structure -->
    <rect x="120" y="80" width="160" height="120" fill="#708090"/>
    <rect x="110" y="70" width="180" height="15" fill="#2F4F4F"/>
    
    <!-- Left tower -->
    <rect x="90" y="50" width="40" height="100" fill="#708090"/>
    <polygon points="90,50 110,30 130,50" fill="#2F4F4F"/>
    <rect x="100" y="70" width="8" height="15" fill="#87CEEB"/>
    <rect x="112" y="70" width="8" height="15" fill="#87CEEB"/>
    
    <!-- Right tower -->
    <rect x="270" y="50" width="40" height="100" fill="#708090"/>
    <polygon points="270,50 290,30 310,50" fill="#2F4F4F"/>
    <rect x="280" y="70" width="8" height="15" fill="#87CEEB"/>
    <rect x="292" y="70" width="8" height="15" fill="#87CEEB"/>
    
    <!-- Central tower -->
    <rect x="175" y="40" width="50" height="110" fill="#708090"/>
    <polygon points="175,40 200,15 225,40" fill="#2F4F4F"/>
    <rect x="190" y="60" width="10" height="20" fill="#87CEEB"/>
    
    <!-- Castle gate -->
    <rect x="180" y="140" width="40" height="60" fill="#2F4F4F"/>
    <rect x="190" y="150" width="8" height="15" fill="#8B4513"/>
    <rect x="202" y="150" width="8" height="15" fill="#8B4513"/>
    
    <!-- Castle windows -->
    <rect x="140" y="100" width="12" height="12" fill="#87CEEB"/>
    <rect x="160" y="100" width="12" height="12" fill="#87CEEB"/>
    <rect x="228" y="100" width="12" height="12" fill="#87CEEB"/>
    <rect x="248" y="100" width="12" height="12" fill="#87CEEB"/>
  </g>
  
  <!-- City buildings -->
  <g id="buildings">
    <rect x="20" y="160" width="30" height="40" fill="#A9A9A9"/>
    <rect x="25" y="170" width="6" height="10" fill="#87CEEB"/>
    <rect x="39" y="170" width="6" height="8" fill="#87CEEB"/>
    
    <rect x="60" y="150" width="35" height="50" fill="#808080"/>
    <rect x="67" y="165" width="8" height="12" fill="#87CEEB"/>
    <rect x="80" y="165" width="8" height="10" fill="#87CEEB"/>
    
    <rect x="320" y="155" width="32" height="45" fill="#A9A9A9"/>
    <rect x="327" y="168" width="7" height="11" fill="#87CEEB"/>
    <rect x="338" y="168" width="7" height="9" fill="#87CEEB"/>
    
    <rect x="360" y="165" width="28" height="35" fill="#808080"/>
    <rect x="366" y="175" width="6" height="10" fill="#87CEEB"/>
    <rect x="376" y="175" width="6" height="8" fill="#87CEEB"/>
  </g>
  
  <!-- Castle flags -->
  <g id="flags">
    <rect x="109" y="25" width="2" height="15" fill="#8B4513"/>
    <polygon points="111,25 125,30 111,35" fill="#FF0000"/>
    
    <rect x="199" y="10" width="2" height="15" fill="#8B4513"/>
    <polygon points="201,10 215,15 201,20" fill="#FF0000"/>
    
    <rect x="289" y="25" width="2" height="15" fill="#8B4513"/>
    <polygon points="291,25 305,30 291,35" fill="#FF0000"/>
  </g>
  
  <!-- Road -->
  <rect x="0" y="220" width="400" height="80" fill="#696969"/>
  <rect x="0" y="240" width="400" height="8" fill="#A9A9A9"/>
  <rect x="0" y="260" width="400" height="8" fill="#A9A9A9"/>
  
  <!-- Clouds -->
  <g opacity="0.6">
    <ellipse cx="50" cy="30" rx="20" ry="12" fill="white"/>
    <ellipse cx="65" cy="25" rx="25" ry="15" fill="white"/>
    <ellipse cx="80" cy="30" rx="15" ry="10" fill="white"/>
  </g>
  
  <g opacity="0.6">
    <ellipse cx="320" cy="40" rx="18" ry="11" fill="white"/>
    <ellipse cx="335" cy="35" rx="22" ry="13" fill="white"/>
    <ellipse cx="350" cy="40" rx="15" ry="9" fill="white"/>
  </g>
</svg>
