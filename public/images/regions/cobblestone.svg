<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Sky -->
  <rect width="400" height="150" fill="#87CEEB"/>
  
  <!-- Background - Ground -->
  <rect y="150" width="400" height="150" fill="#8B7355"/>
  
  <!-- Village houses -->
  <g id="house1">
    <rect x="50" y="120" width="60" height="50" fill="#D2691E"/>
    <polygon points="50,120 80,90 110,120" fill="#8B4513"/>
    <rect x="65" y="140" width="15" height="20" fill="#654321"/>
    <rect x="85" y="140" width="15" height="15" fill="#87CEEB"/>
  </g>
  
  <g id="house2">
    <rect x="150" y="130" width="50" height="40" fill="#CD853F"/>
    <polygon points="150,130 175,105 200,130" fill="#A0522D"/>
    <rect x="160" y="145" width="12" height="18" fill="#654321"/>
    <rect x="175" y="145" width="12" height="12" fill="#87CEEB"/>
  </g>
  
  <g id="house3">
    <rect x="250" y="125" width="55" height="45" fill="#DEB887"/>
    <polygon points="250,125 277.5,100 305,125" fill="#8B4513"/>
    <rect x="262" y="140" width="13" height="20" fill="#654321"/>
    <rect x="277" y="140" width="13" height="13" fill="#87CEEB"/>
  </g>
  
  <!-- Sacred Tree -->
  <g id="sacred-tree">
    <rect x="340" y="140" width="20" height="60" fill="#8B4513"/>
    <circle cx="350" cy="120" r="35" fill="#228B22"/>
    <circle cx="340" cy="110" r="25" fill="#32CD32"/>
    <circle cx="360" cy="115" r="20" fill="#00FF00"/>
    <!-- Magical glow -->
    <circle cx="350" cy="120" r="40" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Path -->
  <path d="M 0 200 Q 100 190 200 195 T 400 200" stroke="#A0522D" stroke-width="15" fill="none"/>
  
  <!-- Clouds -->
  <g opacity="0.7">
    <ellipse cx="80" cy="40" rx="25" ry="15" fill="white"/>
    <ellipse cx="100" cy="35" rx="30" ry="18" fill="white"/>
    <ellipse cx="120" cy="40" rx="20" ry="12" fill="white"/>
  </g>
  
  <g opacity="0.7">
    <ellipse cx="280" cy="60" rx="20" ry="12" fill="white"/>
    <ellipse cx="300" cy="55" rx="25" ry="15" fill="white"/>
    <ellipse cx="320" cy="60" rx="18" ry="10" fill="white"/>
  </g>
</svg>
