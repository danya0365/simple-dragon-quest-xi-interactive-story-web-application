<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#98D8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0E0E6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0826D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BC9A6A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bambooGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90EE90;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D2691E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="180" fill="url(#skyGradient)"/>
  
  <!-- Sun -->
  <circle cx="320" cy="60" r="25" fill="#FFD700" filter="url(#glow)">
    <animate attributeName="r" values="25;27;25" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Mountains -->
  <polygon points="0,180 80,100 160,140 240,80 320,120 400,90 400,180" fill="url(#mountainGradient)" opacity="0.8"/>
  <polygon points="0,180 60,130 120,150 180,110 260,140 340,100 400,130 400,180" fill="url(#mountainGradient)" opacity="0.6"/>
  
  <!-- Bamboo forest background -->
  <g id="bambooBg">
    <rect x="20" y="140" width="8" height="80" fill="url(#bambooGradient)" opacity="0.4"/>
    <rect x="35" y="130" width="6" height="90" fill="url(#bambooGradient)" opacity="0.4"/>
    <rect x="45" y="135" width="7" height="85" fill="url(#bambooGradient)" opacity="0.4"/>
    <rect x="340" y="125" width="8" height="95" fill="url(#bambooGradient)" opacity="0.4"/>
    <rect x="355" y="130" width="6" height="90" fill="url(#bambooGradient)" opacity="0.4"/>
    <rect x="365" y="140" width="7" height="80" fill="url(#bambooGradient)" opacity="0.4"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="180" width="400" height="120" fill="#8FBC8F"/>
  
  <!-- Village houses -->
  <!-- House 1 - Luminary's house -->
  <g id="house1">
    <rect x="150" y="160" width="60" height="40" fill="url(#houseGradient)"/>
    <polygon points="140,160 180,130 220,160" fill="#8B4513"/>
    <rect x="165" y="175" width="15" height="25" fill="#654321"/>
    <rect x="185" y="170" width="12" height="12" fill="#87CEEB"/>
    <rect x="200" y="170" width="12" height="12" fill="#87CEEB"/>
  </g>
  
  <!-- House 2 -->
  <g id="house2">
    <rect x="80" y="170" width="50" height="35" fill="url(#houseGradient)"/>
    <polygon points="70,170 105,145 140,170" fill="#8B4513"/>
    <rect x="95" y="180" width="12" height="25" fill="#654321"/>
    <rect x="110" y="175" width="10" height="10" fill="#87CEEB"/>
  </g>
  
  <!-- House 3 -->
  <g id="house3">
    <rect x="250" y="165" width="55" height="38" fill="url(#houseGradient)"/>
    <polygon points="240,165 277.5,140 315,165" fill="#8B4513"/>
    <rect x="265" y="175" width="13" height="28" fill="#654321"/>
    <rect x="280" y="170" width="11" height="11" fill="#87CEEB"/>
    <rect x="293" y="170" width="11" height="11" fill="#87CEEB"/>
  </g>
  
  <!-- Bamboo forest foreground -->
  <g id="bambooFg">
    <rect x="10" y="150" width="10" height="70" fill="url(#bambooGradient)"/>
    <rect x="25" y="145" width="8" height="75" fill="url(#bambooGradient)"/>
    <rect x="38" y="155" width="9" height="65" fill="url(#bambooGradient)"/>
    <rect x="350" y="140" width="10" height="80" fill="url(#bambooGradient)"/>
    <rect x="365" y="145" width="8" height="75" fill="url(#bambooGradient)"/>
    <rect x="378" y="150" width="9" height="70" fill="url(#bambooGradient)"/>
  </g>
  
  <!-- Path -->
  <path d="M 180 205 Q 200 195 220 205 T 260 205" stroke="#D2691E" stroke-width="8" fill="none"/>
  
  <!-- Flowers -->
  <g id="flowers">
    <circle cx="120" cy="210" r="3" fill="#FF69B4"/>
    <circle cx="125" cy="208" r="3" fill="#FFB6C1"/>
    <circle cx="123" cy="213" r="3" fill="#FF1493"/>
    
    <circle cx="300" cy="215" r="3" fill="#FF69B4"/>
    <circle cx="305" cy="213" r="3" fill="#FFB6C1"/>
    <circle cx="303" cy="218" r="3" fill="#FF1493"/>
    
    <circle cx="200" cy="220" r="3" fill="#FFD700"/>
    <circle cx="205" cy="218" r="3" fill="#FFA500"/>
    <circle cx="203" cy="223" r="3" fill="#FF8C00"/>
  </g>
  
  <!-- Peaceful atmosphere particles -->
  <g id="particles" opacity="0.6">
    <circle cx="50" cy="50" r="1" fill="#FFFFFF">
      <animate attributeName="cy" values="50;40;50" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="30" r="1.5" fill="#FFFFFF">
      <animate attributeName="cy" values="30;20;30" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="45" r="1" fill="#FFFFFF">
      <animate attributeName="cy" values="45;35;45" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="35" r="1.2" fill="#FFFFFF">
      <animate attributeName="cy" values="35;25;35" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
