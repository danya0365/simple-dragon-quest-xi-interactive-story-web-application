<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient for past world -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#98D8E8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#B0E0E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ground gradient -->
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7CFC00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32CD32;stop-opacity:1" />
    </linearGradient>
    
    <!-- Mountain gradient -->
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8FBC8F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6B8E23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#556B2F;stop-opacity:1" />
    </linearGradient>
    
    <!-- Water gradient -->
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4682B4;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#5F9EA0;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#20B2AA;stop-opacity:1" />
    </linearGradient>
    
    <!-- Tree gradient -->
    <radialGradient id="treeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#006400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#013220;stop-opacity:1" />
    </radialGradient>
    
    <!-- Time distortion effect -->
    <radialGradient id="timeDistortion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E6F3FF;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#B3D9FF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#66B2FF;stop-opacity:0.3" />
    </radialGradient>
    
    <filter id="timeGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="waterShimmer">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sky background -->
  <rect width="400" height="300" fill="url(#skyGradient)"/>
  
  <!-- Time distortion overlay -->
  <ellipse cx="200" cy="150" rx="180" ry="140" fill="url(#timeDistortion)" opacity="0.5">
    <animate attributeName="rx" values="180;190;180" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="140;150;140" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.7;0.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Distant mountains -->
  <polygon points="0,180 80,120 160,140 240,100 320,130 400,110 400,300 0,300" 
           fill="url(#mountainGradient)" 
           opacity="0.7"/>
  
  <!-- Mountain peaks -->
  <polygon points="80,120 90,140 70,140" fill="#6B8E23"/>
  <polygon points="240,100 250,120 230,120" fill="#556B2F"/>
  <polygon points="320,130 330,150 310,150" fill="#6B8E23"/>
  
  <!-- Ground -->
  <ellipse cx="200" cy="280" rx="200" ry="60" fill="url(#groundGradient)"/>
  
  <!-- River -->
  <path d="M 50 250 Q 100 240 150 245 T 250 240 Q 300 235 350 245" 
        fill="none" 
        stroke="url(#waterGradient)" 
        stroke-width="15" 
        stroke-linecap="round"
        filter="url(#waterShimmer)">
    <animate attributeName="stroke-width" values="15;18;15" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- River sparkles -->
  <circle cx="100" cy="242" r="2" fill="#FFFFFF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="238" r="1.5" fill="#FFFFFF" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="243" r="2.5" fill="#FFFFFF" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Trees -->
  <g id="tree">
    <rect x="-3" y="0" width="6" height="20" fill="#8B4513"/>
    <circle cx="0" cy="-5" r="12" fill="url(#treeGradient)"/>
    <circle cx="-8" cy="0" r="10" fill="url(#treeGradient)"/>
    <circle cx="8" cy="0" r="10" fill="url(#treeGradient)"/>
  </g>
  
  <!-- Place trees -->
  <use href="#tree" transform="translate(60, 260) scale(0.8)"/>
  <use href="#tree" transform="translate(120, 255) scale(1.0)"/>
  <use href="#tree" transform="translate(180, 265) scale(0.9)"/>
  <use href="#tree" transform="translate(280, 258) scale(1.1)"/>
  <use href="#tree" transform="translate(340, 262) scale(0.7)"/>
  
  <!-- Ancient ruins -->
  <g opacity="0.8">
    <!-- Ruined pillar 1 -->
    <rect x="150" y="220" width="15" height="40" fill="#D3D3D3" stroke="#A9A9A9" stroke-width="1"/>
    <rect x="148" y="218" width="19" height="8" fill="#C0C0C0"/>
    
    <!-- Ruined pillar 2 -->
    <rect x="220" y="230" width="12" height="30" fill="#D3D3D3" stroke="#A9A9A9" stroke-width="1"/>
    <rect x="218" y="228" width="16" height="6" fill="#C0C0C0"/>
    
    <!-- Ruined arch -->
    <path d="M 250 240 Q 260 220 270 240" fill="none" stroke="#D3D3D3" stroke-width="8"/>
    <rect x="248" y="240" width="6" height="20" fill="#D3D3D3"/>
    <rect x="266" y="240" width="6" height="20" fill="#D3D3D3"/>
  </g>
  
  <!-- Time energy particles floating in the air -->
  <circle cx="80" cy="80" r="3" fill="#E6F3FF" opacity="0.6" filter="url(#timeGlow)">
    <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="150" cy="100" r="2" fill="#B3D9FF" opacity="0.5" filter="url(#timeGlow)">
    <animate attributeName="cy" values="100;80;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="250" cy="90" r="2.5" fill="#99CCFF" opacity="0.7" filter="url(#timeGlow)">
    <animate attributeName="cy" values="90;70;90" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="320" cy="110" r="2" fill="#E6F3FF" opacity="0.4" filter="url(#timeGlow)">
    <animate attributeName="cy" values="110;90;110" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Time ripples in the air -->
  <g opacity="0.3">
    <ellipse cx="200" cy="150" rx="50" ry="30" fill="none" stroke="#66B2FF" stroke-width="1">
      <animate attributeName="rx" values="50;70;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="30;40;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="150" rx="40" ry="25" fill="none" stroke="#99CCFF" stroke-width="1">
      <animate attributeName="rx" values="40;60;40" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="25;35;25" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Sun with time distortion effect -->
  <circle cx="320" cy="60" r="25" fill="#FFD700" opacity="0.9" filter="url(#timeGlow)">
    <animate attributeName="r" values="25;28;25" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Sun rays with time effect -->
  <g opacity="0.4">
    <line x1="320" y1="60" x2="320" y2="30" stroke="#FFD700" stroke-width="2">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="60" x2="345" y2="60" stroke="#FFD700" stroke-width="2">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="60" x2="320" y2="90" stroke="#FFD700" stroke-width="2">
      <animate attributeName="opacity" values="0.4;0.6;0.4" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="60" x2="295" y2="60" stroke="#FFD700" stroke-width="2">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.2s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Clouds with time distortion -->
  <g opacity="0.7">
    <ellipse cx="100" cy="50" rx="30" ry="15" fill="#FFFFFF">
      <animate attributeName="cx" values="100;120;100" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="45" rx="25" ry="12" fill="#FFFFFF">
      <animate attributeName="cx" values="120;140;120" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="80" cy="48" rx="20" ry="10" fill="#FFFFFF">
      <animate attributeName="cx" values="80;100;80" dur="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <g opacity="0.6">
    <ellipse cx="250" cy="70" rx="35" ry="18" fill="#FFFFFF">
      <animate attributeName="cx" values="250;270;250" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="270" cy="65" rx="28" ry="14" fill="#FFFFFF">
      <animate attributeName="cx" values="270;290;270" dur="10s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
