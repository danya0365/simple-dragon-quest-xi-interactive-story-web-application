<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0033"/>
      <stop offset="50%" style="stop-color:#2d1b69"/>
      <stop offset="100%" style="stop-color:#0f0f23"/>
    </linearGradient>
    
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1e"/>
    </linearGradient>
    
    <linearGradient id="fortressGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d44"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1e"/>
    </linearGradient>
    
    <radialGradient id="darkAura" cx="50%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#4a0080;stop-opacity:0.3">
        <animate attributeName="stop-opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" style="stop-color:#1a0033;stop-opacity:0.2">
        <animate attributeName="stop-opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    
    <filter id="darkGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sky Background -->
  <rect width="400" height="200" fill="url(#skyGradient)"/>
  
  <!-- Dark Aura Effect -->
  <ellipse cx="200" cy="90" rx="150" ry="80" fill="url(#darkAura)">
    <animate attributeName="rx" values="150;170;150" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="80;100;80" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Ground -->
  <rect y="200" width="400" height="100" fill="url(#groundGradient)"/>
  
  <!-- Fortress Main Structure -->
  <!-- Left Tower -->
  <rect x="50" y="120" width="60" height="80" fill="url(#fortressGradient)" stroke="#0f0f1e" stroke-width="2"/>
  <polygon points="50,120 80,90 110,120" fill="url(#fortressGradient)" stroke="#0f0f1e" stroke-width="2"/>
  
  <!-- Center Tower (Tallest) -->
  <rect x="170" y="80" width="60" height="120" fill="url(#fortressGradient)" stroke="#0f0f1e" stroke-width="2"/>
  <polygon points="170,80 200,40 230,80" fill="url(#fortressGradient)" stroke="#0f0f1e" stroke-width="2"/>
  
  <!-- Right Tower -->
  <rect x="290" y="120" width="60" height="80" fill="url(#fortressGradient)" stroke="#0f0f1e" stroke-width="2"/>
  <polygon points="290,120 320,90 350,120" fill="url(#fortressGradient)" stroke="#0f0f1e" stroke-width="2"/>
  
  <!-- Connecting Walls -->
  <rect x="110" y="140" width="60" height="60" fill="url(#fortressGradient)" stroke="#0f0f1e" stroke-width="2"/>
  <rect x="230" y="140" width="60" height="60" fill="url(#fortressGradient)" stroke="#0f0f1e" stroke-width="2"/>
  
  <!-- Fortress Gate -->
  <rect x="180" y="160" width="40" height="40" fill="#0f0f1e" stroke="#2d2d44" stroke-width="2"/>
  <ellipse cx="200" cy="180" rx="15" ry="20" fill="#1a1a2e"/>
  
  <!-- Windows -->
  <!-- Left Tower Windows -->
  <rect x="65" y="140" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="85" y="140" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="65" y="160" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="85" y="160" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Center Tower Windows -->
  <rect x="185" y="100" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="205" y="100" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="185" y="120" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="205" y="120" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="185" y="140" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="205" y="140" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Right Tower Windows -->
  <rect x="305" y="140" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="325" y="140" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="305" y="160" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="325" y="160" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Wall Windows -->
  <rect x="130" y="160" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="150" y="160" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="250" y="160" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="270" y="160" width="10" height="10" fill="#4a0080" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Dark Banners -->
  <rect x="75" y="100" width="10" height="30" fill="#4a0080" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="195" y="60" width="10" height="30" fill="#4a0080" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="315" y="100" width="10" height="30" fill="#4a0080" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Floating Dark Particles -->
  <circle cx="100" cy="50" r="2" fill="#4a0080" opacity="0.6">
    <animate attributeName="cy" values="50;40;50" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="300" cy="60" r="1.5" fill="#8b00ff" opacity="0.5">
    <animate attributeName="cy" values="60;50;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="150" cy="70" r="1" fill="#4a0080" opacity="0.7">
    <animate attributeName="cy" values="70;60;70" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="250" cy="80" r="1.5" fill="#8b00ff" opacity="0.4">
    <animate attributeName="cy" values="80;70;80" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="200" cy="30" r="1" fill="#ff00ff" opacity="0.8">
    <animate attributeName="cy" values="30;20;30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Lightning Effects -->
  <path d="M 120 20 L 125 40 L 120 35 L 130 60 L 125 55 L 135 80" 
        fill="none" stroke="#ff00ff" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <path d="M 280 30 L 275 50 L 280 45 L 270 70 L 275 65 L 265 90" 
        fill="none" stroke="#8b00ff" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="7s" repeatCount="indefinite"/>
  </path>
  
  <!-- Dark Energy Pulsing from Central Tower -->
  <circle cx="200" cy="60" r="20" fill="none" stroke="#ff00ff" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="20;40;20" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="200" cy="60" r="25" fill="none" stroke="#8b00ff" stroke-width="0.3" opacity="0">
    <animate attributeName="r" values="25;45;25" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
