<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#87CEEB"/>
  
  <!-- Sky Gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#98FB98;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="treeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#32CD32;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:0.2" />
    </radialGradient>
    
    <radialGradient id="leafGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#skyGradient)"/>
  
  <!-- Floating Islands -->
  <g transform="translate(100, 100)">
    <ellipse cx="0" cy="0" rx="80" ry="40" fill="#8B7355" stroke="#654321" stroke-width="2"/>
    <rect x="-80" y="-5" width="160" height="20" fill="#228B22" opacity="0.8"/>
    <circle cx="0" cy="-10" r="15" fill="#90EE90" opacity="0.9"/>
  </g>
  
  <g transform="translate(650, 150)">
    <ellipse cx="0" cy="0" rx="60" ry="30" fill="#8B7355" stroke="#654321" stroke-width="2"/>
    <rect x="-60" y="-5" width="120" height="15" fill="#32CD32" opacity="0.8"/>
    <circle cx="0" cy="-8" r="12" fill="#90EE90" opacity="0.9"/>
  </g>
  
  <g transform="translate(200, 80)">
    <ellipse cx="0" cy="0" rx="50" ry="25" fill="#8B7355" stroke="#654321" stroke-width="2"/>
    <rect x="-50" y="-3" width="100" height="10" fill="#228B22" opacity="0.8"/>
    <circle cx="0" cy="-6" r="10" fill="#90EE90" opacity="0.9"/>
  </g>
  
  <!-- Main Yggdrasil Tree -->
  <g transform="translate(400, 500)">
    <!-- Tree Trunk -->
    <path d="M -50 0 L -40 -200 L -30 -350 L -20 -450 L -10 -520 L 0 -550 L 10 -520 L 20 -450 L 30 -350 L 40 -200 L 50 0 Z" fill="#8B4513" stroke="#654321" stroke-width="3"/>
    
    <!-- Bark Texture -->
    <path d="M -35 -100 Q -33 -95, -30 -100" fill="none" stroke="#654321" stroke-width="2"/>
    <path d="M -25 -200 Q -23 -195, -20 -200" fill="none" stroke="#654321" stroke-width="2"/>
    <path d="M -15 -300 Q -13 -295, -10 -300" fill="none" stroke="#654321" stroke-width="2"/>
    <path d="M 5 -150 Q 7 -145, 10 -150" fill="none" stroke="#654321" stroke-width="2"/>
    <path d="M 15 -250 Q 17 -245, 20 -250" fill="none" stroke="#654321" stroke-width="2"/>
    <path d="M 25 -350 Q 27 -345, 30 -350" fill="none" stroke="#654321" stroke-width="2"/>
    
    <!-- Root System -->
    <path d="M -50 0 L -80 30 L -100 50" fill="none" stroke="#654321" stroke-width="4" stroke-linecap="round"/>
    <path d="M -40 0 L -60 40 L -80 70" fill="none" stroke="#654321" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 0 L 0 50 L 0 80" fill="none" stroke="#654321" stroke-width="4" stroke-linecap="round"/>
    <path d="M 40 0 L 60 40 L 80 70" fill="none" stroke="#654321" stroke-width="3" stroke-linecap="round"/>
    <path d="M 50 0 L 80 30 L 100 50" fill="none" stroke="#654321" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Root Tips -->
    <circle cx="-100" cy="50" r="8" fill="#8B4513"/>
    <circle cx="-80" cy="70" r="6" fill="#8B4513"/>
    <circle cx="0" cy="80" r="8" fill="#8B4513"/>
    <circle cx="80" cy="70" r="6" fill="#8B4513"/>
    <circle cx="100" cy="50" r="8" fill="#8B4513"/>
    
    <!-- Main Canopy -->
    <ellipse cx="0" cy="-550" rx="120" ry="100" fill="url(#leafGradient)" stroke="#228B22" stroke-width="2"/>
    
    <!-- Secondary Canopies -->
    <ellipse cx="-80" cy="-480" rx="80" ry="70" fill="url(#leafGradient)" stroke="#228B22" stroke-width="2"/>
    <ellipse cx="80" cy="-480" rx="80" ry="70" fill="url(#leafGradient)" stroke="#228B22" stroke-width="2"/>
    <ellipse cx="-60" cy="-380" rx="60" ry="50" fill="url(#leafGradient)" stroke="#228B22" stroke-width="2"/>
    <ellipse cx="60" cy="-380" rx="60" ry="50" fill="url(#leafGradient)" stroke="#228B22" stroke-width="2"/>
    
    <!-- Tree Branches -->
    <path d="M -30 -350 L -80 -420 L -100 -450" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
    <path d="M 30 -350 L 80 -420 L 100 -450" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
    <path d="M -20 -250 L -60 -300 L -80 -320" fill="none" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
    <path d="M 20 -250 L 60 -300 L 80 -320" fill="none" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Branch Leaves -->
    <ellipse cx="-100" cy="-450" rx="25" ry="20" fill="url(#leafGradient)"/>
    <ellipse cx="100" cy="-450" rx="25" ry="20" fill="url(#leafGradient)"/>
    <ellipse cx="-80" cy="-320" rx="20" ry="15" fill="url(#leafGradient)"/>
    <ellipse cx="80" cy="-320" rx="20" ry="15" fill="url(#leafGradient)"/>
    
    <!-- Divine Light Aura -->
    <circle cx="0" cy="-550" r="150" fill="url(#treeGlow)">
      <animate attributeName="r" values="150;170;150" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Floating Leaves -->
    <g transform="translate(-150, -400)">
      <ellipse cx="0" cy="0" rx="8" ry="12" fill="#228B22" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 20,-30; 0,0" dur="6s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g transform="translate(150, -350)">
      <ellipse cx="0" cy="0" rx="6" ry="10" fill="#32CD32" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; -18,-25; 0,0" dur="5s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g transform="translate(-100, -200)">
      <ellipse cx="0" cy="0" rx="5" ry="8" fill="#90EE90" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 25,-20; 0,0" dur="7s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="7s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g transform="translate(120, -250)">
      <ellipse cx="0" cy="0" rx="7" ry="11" fill="#228B22" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="9s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; -22,-28; 0,0" dur="8s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="8s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Life Energy Particles -->
    <circle cx="-200" cy="-300" r="3" fill="#90EE90" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 15,-25; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="-400" r="2.5" fill="#32CD32" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -12,-20; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-150" cy="-500" r="2" fill="#228B22" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 18,-15; 0,0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="-350" r="2.8" fill="#90EE90" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; -16,-22; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Sacred Symbols -->
    <g transform="translate(0, -550)" opacity="0.8">
      <text x="-15" y="5" font-family="Arial" font-size="20" fill="#FFD700">🌳</text>
      <text x="5" y="5" font-family="Arial" font-size="20" fill="#32CD32">🍃</text>
    </g>
    
    <!-- World Tree Energy -->
    <g transform="translate(0, -550)">
      <circle cx="0" cy="0" r="80" fill="none" stroke="#90EE90" stroke-width="2" opacity="0.5">
        <animate attributeName="r" values="80;90;80" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="60" fill="none" stroke="#32CD32" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="60;70;60" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Divine Connection Lines -->
    <g transform="translate(0, -550)" opacity="0.4">
      <path d="M -100 0 L 100 0" stroke="#FFD700" stroke-width="1">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 -100 L 0 100" stroke="#FFD700" stroke-width="1">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" begin="1s" repeatCount="indefinite"/>
      </path>
      <path d="M -70 -70 L 70 70" stroke="#FFD700" stroke-width="1">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" begin="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 70 -70 L -70 70" stroke="#FFD700" stroke-width="1">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" begin="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="500" width="800" height="100" fill="#228B22" opacity="0.8"/>
  
  <!-- Ground Details -->
  <g transform="translate(0, 520)">
    <circle cx="100" cy="20" r="8" fill="#32CD32" opacity="0.8"/>
    <circle cx="200" cy="15" r="6" fill="#90EE90" opacity="0.7"/>
    <circle cx="300" cy="25" r="7" fill="#228B22" opacity="0.8"/>
    <circle cx="500" cy="18" r="5" fill="#32CD32" opacity="0.6"/>
    <circle cx="600" cy="22" r="9" fill="#90EE90" opacity="0.8"/>
    <circle cx="700" cy="16" r="6" fill="#228B22" opacity="0.7"/>
  </g>
  
  <!-- Clouds -->
  <g transform="translate(150, 50)">
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="20" cy="0" rx="35" ry="18" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="-20" cy="0" rx="35" ry="18" fill="#FFFFFF" opacity="0.8"/>
  </g>
  
  <g transform="translate(550, 80)">
    <ellipse cx="0" cy="0" rx="35" ry="18" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="18" cy="0" rx="30" ry="15" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="-18" cy="0" rx="30" ry="15" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- Divine Light Beams -->
  <g transform="translate(400, 50)" opacity="0.3">
    <path d="M 0 0 L -50 400" stroke="#FFD700" stroke-width="3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 0 L 50 400" stroke="#FFD700" stroke-width="3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="6s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 0 L 0 400" stroke="#FFD700" stroke-width="3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="6s" begin="4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- World Tree Title -->
  <g transform="translate(400, 30)">
    <text x="0" y="0" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFD700" opacity="0.9">YGGDRASIL</text>
    <text x="0" y="20" font-family="Arial" font-size="14" text-anchor="middle" fill="#32CD32" opacity="0.8">World Tree of Life</text>
  </g>
</svg>
