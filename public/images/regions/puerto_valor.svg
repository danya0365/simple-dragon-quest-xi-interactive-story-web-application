<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Beautiful gradient sky background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#98D8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0E0E6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4682B4;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#1E90FF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#000080;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sky background -->
  <rect width="400" height="300" fill="url(#skyGradient)"/>
  
  <!-- Beautiful sun with glow effect -->
  <circle cx="350" cy="60" r="30" fill="#FFD700" filter="url(#glow)" opacity="0.9"/>
  <circle cx="350" cy="60" r="25" fill="#FFA500" opacity="0.8"/>
  
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="2" opacity="0.6">
    <line x1="350" y1="25" x2="350" y2="35"/>
    <line x1="350" y1="85" x2="350" y2="95"/>
    <line x1="315" y1="60" x2="325" y2="60"/>
    <line x1="375" y1="60" x2="385" y2="60"/>
    <line x1="322" y1="32" x2="329" y2="39"/>
    <line x1="371" y1="39" x2="378" y2="32"/>
    <line x1="322" y1="88" x2="329" y2="81"/>
    <line x1="371" y1="81" x2="378" y2="88"/>
  </g>
  
  <!-- Ocean waves with gradient -->
  <path d="M0 180 Q50 170 100 180 T200 180 T300 180 T400 180 L400 300 L0 300 Z" fill="url(#oceanGradient)"/>
  
  <!-- Wave details -->
  <path d="M0 190 Q25 185 50 190 T100 190 T150 190 T200 190 T250 190 T300 190 T350 190 T400 190" 
        fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <path d="M0 210 Q25 205 50 210 T100 210 T150 210 T200 210 T250 210 T300 210 T350 210 T400 210" 
        fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  
  <!-- Beautiful beach with gradient -->
  <path d="M0 160 Q100 150 200 160 T400 160 L400 300 L0 300 Z" fill="url(#sandGradient)"/>
  
  <!-- Beautiful harbor buildings -->
  <!-- Main harbor building with details -->
  <g>
    <rect x="40" y="100" width="90" height="60" fill="url(#buildingGradient)" stroke="#8B4513" stroke-width="2" rx="3"/>
    <!-- Windows with reflection -->
    <rect x="50" y="110" width="18" height="22" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="2"/>
    <rect x="78" y="110" width="18" height="22" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="2"/>
    <rect x="106" y="110" width="18" height="22" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="2"/>
    <!-- Window reflections -->
    <rect x="52" y="112" width="6" height="8" fill="#FFFFFF" opacity="0.6"/>
    <rect x="80" y="112" width="6" height="8" fill="#FFFFFF" opacity="0.6"/>
    <rect x="108" y="112" width="6" height="8" fill="#FFFFFF" opacity="0.6"/>
    <!-- Roof -->
    <polygon points="35,100 85,75 135,100" fill="#8B4513" stroke="#654321" stroke-width="2"/>
    <!-- Chimney -->
    <rect x="95" y="85" width="12" height="15" fill="#A0522D" stroke="#8B4513" stroke-width="1"/>
  </g>
  
  <!-- Beautiful casino with golden glow -->
  <g>
    <rect x="150" y="80" width="110" height="90" fill="#FFD700" stroke="#B8860B" stroke-width="3" rx="5"/>
    <rect x="160" y="90" width="90" height="70" fill="#FFA500" stroke="#FF8C00" stroke-width="1" rx="3"/>
    <!-- Casino windows -->
    <rect x="165" y="95" width="25" height="30" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="2"/>
    <rect x="200" y="95" width="25" height="30" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="2"/>
    <rect x="235" y="95" width="25" height="30" fill="#87CEEB" stroke="#4682B4" stroke-width="1" rx="2"/>
    <!-- Casino door -->
    <rect x="190" y="130" width="30" height="40" fill="#8B4513" stroke="#654321" stroke-width="2" rx="15"/>
    <circle cx="212" cy="150" r="2" fill="#FFD700"/>
    <!-- Casino sign -->
    <rect x="170" y="105" width="70" height="15" fill="#FFFFFF" stroke="#000000" stroke-width="1" rx="2"/>
    <text x="205" y="116" text-anchor="middle" font-family="Arial Black" font-size="10" font-weight="bold" fill="#DC143C">CASINO</text>
    <!-- Roof -->
    <polygon points="145,80 205,50 265,80" fill="#B8860B" stroke="#8B4513" stroke-width="2"/>
  </g>
  
  <!-- Beautiful lighthouse -->
  <g>
    <!-- Lighthouse base -->
    <rect x="275" y="120" width="40" height="80" fill="#F5F5DC" stroke="#D3D3D3" stroke-width="2" rx="5"/>
    <!-- Lighthouse stripes -->
    <rect x="275" y="120" width="40" height="15" fill="#DC143C"/>
    <rect x="275" y="150" width="40" height="15" fill="#FFFFFF"/>
    <rect x="275" y="180" width="40" height="20" fill="#DC143C"/>
    <!-- Lighthouse top -->
    <polygon points="270,120 295,95 320,120" fill="#000000"/>
    <!-- Light with glow -->
    <circle cx="295" cy="105" r="12" fill="#FFFF00" filter="url(#glow)" opacity="0.9"/>
    <circle cx="295" cy="105" r="8" fill="#FFFFFF"/>
    <!-- Light beams -->
    <path d="M295 105 L320 85" stroke="#FFFF00" stroke-width="3" opacity="0.7"/>
    <path d="M295 105 L270 85" stroke="#FFFF00" stroke-width="3" opacity="0.7"/>
  </g>
  
  <!-- Beautiful ships -->
  <!-- Ship 1 with details -->
  <g>
    <path d="M15 165 L65 165 L60 185 L20 185 Z" fill="#8B4513" stroke="#654321" stroke-width="2"/>
    <rect x="35" y="145" width="12" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <polygon points="35,145 41,135 47,145" fill="#DC143C" stroke="#8B0000" stroke-width="1"/>
    <!-- Mast -->
    <rect x="39" y="125" width="4" height="20" fill="#654321"/>
    <!-- Flag -->
    <rect x="43" y="125" width="15" height="8" fill="#DC143C"/>
  </g>
  
  <!-- Ship 2 with details -->
  <g>
    <path d="M315 175 L365 175 L360 195 L320 195 Z" fill="#654321" stroke="#4B3621" stroke-width="2"/>
    <rect x="335" y="155" width="12" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <polygon points="335,155 341,145 347,155" fill="#0000FF" stroke="#000080" stroke-width="1"/>
    <!-- Mast -->
    <rect x="339" y="135" width="4" height="20" fill="#4B3621"/>
    <!-- Flag -->
    <rect x="343" y="135" width="15" height="8" fill="#0000FF"/>
  </g>
  
  <!-- Beautiful palm trees -->
  <!-- Palm tree 1 -->
  <g>
    <rect x="118" y="135" width="12" height="45" fill="#8B4513" stroke="#654321" stroke-width="1" rx="2"/>
    <!-- Palm fronds -->
    <ellipse cx="124" cy="130" rx="20" ry="8" fill="#228B22" transform="rotate(-20 124 130)"/>
    <ellipse cx="124" cy="125" rx="18" ry="6" fill="#32CD32" transform="rotate(10 124 125)"/>
    <ellipse cx="124" cy="128" rx="16" ry="5" fill="#228B22" transform="rotate(-45 124 128)"/>
    <ellipse cx="124" cy="122" rx="15" ry="5" fill="#32CD32" transform="rotate(45 124 122)"/>
    <ellipse cx="124" cy="135" rx="14" ry="4" fill="#228B22" transform="rotate(-70 124 135)"/>
    <ellipse cx="124" cy="120" rx="13" ry="4" fill="#32CD32" transform="rotate(70 124 120)"/>
    <!-- Coconuts -->
    <circle cx="120" cy="140" r="3" fill="#8B4513"/>
    <circle cx="128" cy="142" r="3" fill="#8B4513"/>
  </g>
  
  <!-- Palm tree 2 -->
  <g>
    <rect x="268" y="145" width="12" height="35" fill="#8B4513" stroke="#654321" stroke-width="1" rx="2"/>
    <!-- Palm fronds -->
    <ellipse cx="274" cy="140" rx="18" ry="7" fill="#228B22" transform="rotate(-15 274 140)"/>
    <ellipse cx="274" cy="135" rx="16" ry="5" fill="#32CD32" transform="rotate(15 274 135)"/>
    <ellipse cx="274" cy="138" rx="14" ry="4" fill="#228B22" transform="rotate(-40 274 138)"/>
    <ellipse cx="274" cy="132" rx="13" ry="4" fill="#32CD32" transform="rotate(40 274 132)"/>
    <ellipse cx="274" cy="143" rx="12" ry="3" fill="#228B22" transform="rotate(-65 274 143)"/>
    <ellipse cx="274" cy="130" rx="11" ry="3" fill="#32CD32" transform="rotate(65 274 130)"/>
    <!-- Coconuts -->
    <circle cx="270" cy="148" r="2.5" fill="#8B4513"/>
    <circle cx="278" cy="150" r="2.5" fill="#8B4513"/>
  </g>
  
  <!-- Beautiful seagulls -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <path d="M70 40 Q75 35 80 40 Q75 37 70 40" opacity="0.8"/>
    <path d="M140 30 Q145 25 150 30 Q145 27 140 30" opacity="0.8"/>
    <path d="M240 45 Q245 40 250 45 Q245 42 240 45" opacity="0.8"/>
    <path d="M310 35 Q315 30 320 35 Q315 32 310 35" opacity="0.8"/>
  </g>
  
  <!-- Beautiful title with shadow -->
  <text x="200" y="30" text-anchor="middle" font-family="Georgia" font-size="20" font-weight="bold" fill="#000080" filter="url(#glow)">Puerto Valor</text>
  <text x="202" y="32" text-anchor="middle" font-family="Georgia" font-size="20" font-weight="bold" fill="#4169E1" opacity="0.5">Puerto Valor</text>
  
  <!-- Decorative clouds -->
  <g fill="#FFFFFF" opacity="0.7">
    <ellipse cx="80" cy="50" rx="15" ry="8"/>
    <ellipse cx="95" cy="48" rx="12" ry="6"/>
    <ellipse cx="65" cy="48" rx="10" ry="5"/>
    
    <ellipse cx="250" cy="40" rx="18" ry="10"/>
    <ellipse cx="268" cy="38" rx="15" ry="8"/>
    <ellipse cx="232" cy="38" rx="12" ry="6"/>
  </g>
</svg>
