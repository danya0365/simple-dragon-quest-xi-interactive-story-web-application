<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Puerto Valor - Mediterranean Coastal Port City -->
  
  <!-- Sea background -->
  <rect width="128" height="80" fill="#4682B4"/>
  
  <!-- Sky -->
  <rect y="80" width="128" height="48" fill="#87CEEB"/>
  
  <!-- Waves -->
  <path d="M 0 75 Q 32 70 64 75 T 128 75 L 128 80 L 0 80 Z" fill="#1E90FF" opacity="0.7"/>
  <path d="M 0 78 Q 32 73 64 78 T 128 78 L 128 80 L 0 80 Z" fill="#00BFFF" opacity="0.5"/>
  
  <!-- Harbor buildings -->
  <rect x="10" y="50" width="25" height="30" fill="#F4A460" stroke="#8B4513" stroke-width="1"/>
  <rect x="40" y="45" width="20" height="35" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  <rect x="65" y="40" width="30" height="40" fill="#F4A460" stroke="#8B4513" stroke-width="1"/>
  <rect x="100" y="55" width="20" height="25" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Windows -->
  <rect x="15" y="55" width="4" height="4" fill="#FFD700"/>
  <rect x="25" y="55" width="4" height="4" fill="#FFD700"/>
  <rect x="15" y="65" width="4" height="4" fill="#FFD700"/>
  <rect x="25" y="65" width="4" height="4" fill="#FFD700"/>
  
  <rect x="45" y="50" width="3" height="3" fill="#FFD700"/>
  <rect x="52" y="50" width="3" height="3" fill="#FFD700"/>
  <rect x="45" y="60" width="3" height="3" fill="#FFD700"/>
  <rect x="52" y="60" width="3" height="3" fill="#FFD700"/>
  
  <!-- Casino building (taller) -->
  <rect x="70" y="25" width="20" height="55" fill="#FF6347" stroke="#8B0000" stroke-width="2"/>
  <text x="80" y="50" text-anchor="middle" font-family="Arial" font-size="8" fill="#FFD700">CASINO</text>
  
  <!-- Ships in harbor -->
  <ellipse cx="30" cy="75" rx="15" ry="5" fill="#8B4513"/>
  <rect x="25" y="65" width="10" height="10" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <polygon points="30,65 25,60 35,60" fill="#FF0000"/>
  
  <ellipse cx="90" cy="77" rx="12" ry="4" fill="#8B4513"/>
  <rect x="86" y="69" width="8" height="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <polygon points="90,69 86,65 94,65" fill="#0000FF"/>
  
  <!-- Lighthouse -->
  <rect x="115" y="30" width="8" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <polygon points="115,30 119,20 123,30" fill="#FF0000"/>
  <circle cx="119" cy="25" r="2" fill="#FFFF00"/>
  
  <!-- Seagulls -->
  <path d="M 20 20 Q 25 18 30 20" stroke="#000000" stroke-width="1" fill="none"/>
  <path d="M 50 15 Q 55 13 60 15" stroke="#000000" stroke-width="1" fill="none"/>
  <path d="M 80 25 Q 85 23 90 25" stroke="#000000" stroke-width="1" fill="none"/>
  
  <!-- Sun -->
  <circle cx="110" cy="100" r="15" fill="#FFD700"/>
  
  <!-- Palm trees on beach -->
  <line x1="5" y1="85" x2="5" y2="70" stroke="#8B4513" stroke-width="2"/>
  <circle cx="5" cy="68" r="6" fill="#228B22"/>
  
  <line x1="120" y1="90" x2="120" y2="75" stroke="#8B4513" stroke-width="2"/>
  <circle cx="120" cy="73" r="6" fill="#228B22"/>
</svg>
