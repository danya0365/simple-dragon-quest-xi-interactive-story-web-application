<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert Sword - Strong and sharp desert blade -->
  
  <!-- Sword blade -->
  <rect x="28" y="8" width="8" height="35" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  
  <!-- Blade tip -->
  <polygon points="32,8 28,12 36,12" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  
  <!-- Blade edge (sharpened) -->
  <line x1="28" y1="10" x2="28" y2="40" stroke="#E5E5E5" stroke-width="1"/>
  <line x1="36" y1="10" x2="36" y2="40" stroke="#E5E5E5" stroke-width="1"/>
  
  <!-- Cross guard -->
  <rect x="20" y="40" width="24" height="6" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Handle -->
  <rect x="29" y="46" width="6" height="12" fill="#D2691E" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Handle wrapping -->
  <line x1="29" y1="48" x2="35" y2="48" stroke="#8B4513" stroke-width="0.5"/>
  <line x1="29" y1="50" x2="35" y2="50" stroke="#8B4513" stroke-width="0.5"/>
  <line x1="29" y1="52" x2="35" y2="52" stroke="#8B4513" stroke-width="0.5"/>
  <line x1="29" y1="54" x2="35" y2="54" stroke="#8B4513" stroke-width="0.5"/>
  
  <!-- Pommel -->
  <circle cx="32" cy="60" r="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Desert runes on blade -->
  <text x="32" y="25" text-anchor="middle" font-family="serif" font-size="6" fill="#8B4513">☀</text>
  <text x="32" y="32" text-anchor="middle" font-family="serif" font-size="6" fill="#8B4513">⚔</text>
  
  <!-- Sand/dust particles on blade -->
  <circle cx="30" cy="20" r="0.5" fill="#F4A460" opacity="0.7"/>
  <circle cx="34" cy="28" r="0.5" fill="#F4A460" opacity="0.7"/>
  <circle cx="31" cy="35" r="0.5" fill="#F4A460" opacity="0.7"/>
  
  <!-- Heat shimmer effect -->
  <path d="M 25 15 Q 27 13 29 15 T 33 15 T 37 15 T 41 15" stroke="#FFD700" stroke-width="0.5" fill="none" opacity="0.4"/>
  
  <!-- Blade reflection -->
  <rect x="30" y="12" width="2" height="25" fill="#FFFFFF" opacity="0.3"/>
</svg>
