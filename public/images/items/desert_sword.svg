<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert Sword Item -->
  
  <!-- Blade - Curved scimitar style -->
  <path d="M100 30 Q85 80 90 120 L95 125 L105 125 L110 120 Q115 80 100 30" fill="#f4a460" stroke="#cd853f" stroke-width="2"/>
  
  <!-- Blade edge highlight -->
  <path d="M100 30 Q88 75 92 115 L100 120" fill="none" stroke="#ffd700" stroke-width="1"/>
  
  <!-- Cross guard - Ornate desert style -->
  <path d="M75 115 Q100 110 125 115 L120 125 L80 125 Z" fill="#cd853f" stroke="#8b4513" stroke-width="2"/>
  
  <!-- Handle -->
  <rect x="95" y="125" width="10" height="45" fill="#8b4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Handle wrap - Desert style -->
  <rect x="95" y="127" width="10" height="6" fill="#daa520"/>
  <rect x="95" y="138" width="10" height="6" fill="#daa520"/>
  <rect x="95" y="149" width="10" height="6" fill="#daa520"/>
  <rect x="95" y="160" width="10" height="6" fill="#daa520"/>
  
  <!-- Pommel - Ornate desert jewel -->
  <circle cx="100" cy="175" r="10" fill="#cd853f" stroke="#8b4513" stroke-width="2"/>
  <circle cx="100" cy="175" r="7" fill="#ffd700"/>
  <circle cx="100" cy="175" r="4" fill="#ff6347"/>
  
  <!-- Blood groove -->
  <path d="M100 40 Q95 80 98 115" stroke="#cd853f" stroke-width="2" fill="none"/>
  
  <!-- Sharp point -->
  <path d="M100 30 L97 33 L100 36 L103 33 Z" fill="#ffd700"/>
  
  <!-- Desert runes on blade -->
  <text x="100" y="70" text-anchor="middle" font-family="Arial" font-size="8" fill="#8b4513" transform="rotate(-10 100 70)">☀</text>
  <text x="100" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#8b4513" transform="rotate(-10 100 90)">☀</text>
  
  <!-- Gems on cross guard -->
  <circle cx="85" cy="120" r="3" fill="#ff6347" stroke="#8b0000" stroke-width="1"/>
  <circle cx="100" cy="118" r="3" fill="#ffd700" stroke="#daa520" stroke-width="1"/>
  <circle cx="115" cy="120" r="3" fill="#ff6347" stroke="#8b0000" stroke-width="1"/>
  
  <!-- Sand particles around sword -->
  <circle cx="80" cy="140" r="2" fill="#f4a460" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="150" r="2" fill="#f4a460" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="160" r="2" fill="#f4a460" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Animation: Desert wind effect -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="rotate"
    values="0 100 100; 2 100 100; 0 100 100; -2 100 100; 0 100 100"
    dur="4s"
    repeatCount="indefinite"
    additive="sum"/>
</svg>
