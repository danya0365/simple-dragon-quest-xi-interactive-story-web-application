<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Mermaid Tear Item -->
  
  <!-- Tear shape - Main gem -->
  <path d="M100 40 Q80 80 85 120 Q90 140 100 150 Q110 140 115 120 Q120 80 100 40" fill="#00bfff" stroke="#0080ff" stroke-width="2"/>
  
  <!-- Inner tear glow -->
  <path d="M100 50 Q85 85 90 115 Q95 130 100 135 Q105 130 110 115 Q115 85 100 50" fill="#87ceeb" stroke="#4682b4" stroke-width="1"/>
  
  <!-- Core brilliance -->
  <ellipse cx="100" cy="90" rx="15" ry="25" fill="#add8e6" stroke="#87ceeb" stroke-width="1"/>
  <ellipse cx="100" cy="90" rx="8" ry="15" fill="#e0f6ff" stroke="#add8e6" stroke-width="1"/>
  
  <!-- Light reflection -->
  <ellipse cx="90" cy="70" rx="8" ry="12" fill="#fff" opacity="0.7"/>
  <ellipse cx="85" cy="65" rx="4" ry="6" fill="#fff" opacity="0.9"/>
  
  <!-- Magical sparkles -->
  <g id="sparkle">
    <path d="M0 0 L2 6 L0 2 L-2 6 Z" fill="#ffd700"/>
    <circle cx="0" cy="0" r="1" fill="#fff"/>
  </g>
  
  <!-- Place sparkles around tear -->
  <use href="#sparkle" x="70" y="60" transform="rotate(15 70 60)"/>
  <use href="#sparkle" x="130" y="60" transform="rotate(-15 130 60)"/>
  <use href="#sparkle" x="75" y="100" transform="rotate(30 75 100)"/>
  <use href="#sparkle" x="125" y="100" transform="rotate(-30 125 100)"/>
  <use href="#sparkle" x="80" y="130" transform="rotate(45 80 130)"/>
  <use href="#sparkle" x="120" y="130" transform="rotate(-45 120 130)"/>
  
  <!-- Healing aura -->
  <circle cx="100" cy="95" r="40" fill="none" stroke="#00bfff" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="95" r="50" fill="none" stroke="#87ceeb" stroke-width="1" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Water droplets falling -->
  <circle cx="85" cy="160" r="2" fill="#87ceeb" opacity="0.6">
    <animate attributeName="cy" values="160;170;160" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="165" r="2" fill="#00bfff" opacity="0.5">
    <animate attributeName="cy" values="165;175;165" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="160" r="2" fill="#87ceeb" opacity="0.4">
    <animate attributeName="cy" values="160;170;160" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Mermaid scale patterns -->
  <path d="M90 80 Q95 75 100 80 Q105 75 110 80" fill="none" stroke="#4682b4" stroke-width="1" opacity="0.5"/>
  <path d="M90 95 Q95 90 100 95 Q105 90 110 95" fill="none" stroke="#4682b4" stroke-width="1" opacity="0.5"/>
  <path d="M90 110 Q95 105 100 110 Q105 105 110 110" fill="none" stroke="#4682b4" stroke-width="1" opacity="0.5"/>
  
  <!-- Ocean wave energy -->
  <path d="M70 95 Q85 90 100 95 Q115 90 130 95" fill="none" stroke="#00bfff" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M70 105 Q85 100 100 105 Q115 100 130 105" fill="none" stroke="#87ceeb" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Shadow beneath -->
  <ellipse cx="100" cy="155" rx="25" ry="8" fill="#000" opacity="0.2"/>
  
  <!-- Animation: Gentle floating and pulsing -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="translate"
    values="0,0; 0,-5; 0,0"
    dur="4s"
    repeatCount="indefinite"/>
  
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="scale"
    values="1;1.1;1"
    dur="3s"
    repeatCount="indefinite"
    additive="sum"/>
</svg>
