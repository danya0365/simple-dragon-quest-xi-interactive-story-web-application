<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="memoryCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE6F3;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFB3D9;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FF66B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1A75;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="pendantChain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="memoryAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE6F3;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFB3D9;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FF66B2;stop-opacity:0.4" />
    </linearGradient>
    
    <filter id="memoryGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="pendantShine">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Memory energy aura -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#FF66B2" stroke-width="2" opacity="0.3" filter="url(#memoryGlow)">
    <animate attributeName="r" values="75;85;75" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="100" r="55" fill="none" stroke="#FF99CC" stroke-width="1.5" opacity="0.4" filter="url(#memoryGlow)">
    <animate attributeName="r" values="55;65;55" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Pendant chain -->
  <path d="M 100 20 Q 95 30 100 40 Q 105 50 100 60" 
        fill="none" 
        stroke="url(#pendantChain)" 
        stroke-width="3" 
        stroke-linecap="round"/>
  
  <!-- Chain links -->
  <circle cx="100" cy="25" r="3" fill="#FFD700"/>
  <circle cx="100" cy="35" r="3" fill="#FFA500"/>
  <circle cx="100" cy="45" r="3" fill="#FFD700"/>
  <circle cx="100" cy="55" r="3" fill="#FFA500"/>
  
  <!-- Pendant main body (teardrop shape) -->
  <path d="M 100 60 Q 120 80 120 110 Q 120 140 100 150 Q 80 140 80 110 Q 80 80 100 60 Z" 
        fill="url(#memoryCore)" 
        stroke="#FF1A75" 
        stroke-width="2" 
        filter="url(#pendantShine)"/>
  
  <!-- Pendant facets for 3D effect -->
  <path d="M 100 60 Q 110 70 115 90 L 100 80 Z" 
        fill="url(#memoryAura)" 
        opacity="0.8"/>
  
  <path d="M 100 60 Q 90 70 85 90 L 100 80 Z" 
        fill="url(#memoryAura)" 
        opacity="0.7"/>
  
  <path d="M 115 90 Q 120 100 120 110 L 105 100 Z" 
        fill="url(#memoryAura)" 
        opacity="0.6"/>
  
  <path d="M 85 90 Q 80 100 80 110 L 95 100 Z" 
        fill="url(#memoryAura)" 
        opacity="0.5"/>
  
  <!-- Memory core -->
  <ellipse cx="100" cy="100" rx="20" ry="25" fill="#FFE6F3" opacity="0.9" filter="url(#pendantShine)">
    <animate attributeName="rx" values="20;23;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="25;28;25" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <ellipse cx="100" cy="100" rx="12" ry="18" fill="#FFFFFF" opacity="0.8">
    <animate attributeName="rx" values="12;15;12" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="18;21;18" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Memory fragments inside pendant -->
  <g opacity="0.6">
    <!-- Fragment 1 -->
    <polygon points="95,95 100,90 105,95 100,100" fill="#FFB3D9">
      <animateTransform attributeName="transform" type="rotate" values="0 100 95;360 100 95" dur="8s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Fragment 2 -->
    <polygon points="90,105 95,100 100,105 95,110" fill="#FF99CC">
      <animateTransform attributeName="transform" type="rotate" values="360 95 105;0 95 105" dur="6s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Fragment 3 -->
    <polygon points="105,100 110,95 115,100 110,105" fill="#FFCCDD">
      <animateTransform attributeName="transform" type="rotate" values="0 110 100;360 110 100" dur="7s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Memory particles floating around pendant -->
  <circle cx="70" cy="80" r="2" fill="#FFE6F3" opacity="0.8">
    <animate attributeName="cx" values="70;50;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="130" cy="90" r="1.5" fill="#FFB3D9" opacity="0.7">
    <animate attributeName="cx" values="130;150;130" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;70;90" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="80" cy="120" r="2.5" fill="#FF99CC" opacity="0.6">
    <animate attributeName="cx" values="80;60;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;140;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="120" cy="130" r="1.8" fill="#FFE6F3" opacity="0.9">
    <animate attributeName="cx" values="120;140;120" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;150;130" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Pendant highlights -->
  <ellipse cx="95" cy="75" rx="8" ry="12" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="105" cy="85" rx="5" ry="8" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Memory energy waves -->
  <g opacity="0.3">
    <ellipse cx="100" cy="100" rx="30" ry="40" fill="none" stroke="#FF66B2" stroke-width="1">
      <animate attributeName="rx" values="30;40;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="40;50;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="100" rx="25" ry="35" fill="none" stroke="#FF99CC" stroke-width="1">
      <animate attributeName="rx" values="25;35;25" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="35;45;35" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Heart symbol in center (representing memories) -->
  <g opacity="0.7" transform="translate(100, 100)">
    <path d="M 0,-5 C -3,-8 -8,-8 -8,-4 C -8,0 -3,5 0,8 C 3,5 8,0 8,-4 C 8,-8 3,-8 0,-5 Z" 
          fill="#FF1A75" 
          stroke="#FF66B2" 
          stroke-width="0.5">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
