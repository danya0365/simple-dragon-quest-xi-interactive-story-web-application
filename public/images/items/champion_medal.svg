<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Champion's Medal - Legendary medal from Gallopolis Arena -->
  
  <!-- Medal ribbon -->
  <rect x="28" y="8" width="8" height="20" fill="#FF0000"/>
  <polygon points="24,8 32,4 40,8" fill="#FFD700"/>
  
  <!-- Medal body (circular) -->
  <circle cx="32" cy="40" r="18" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
  
  <!-- Inner circle -->
  <circle cx="32" cy="40" r="15" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
  
  <!-- Champion star -->
  <polygon points="32,28 34,34 40,34 35,38 37,44 32,40 27,44 29,38 24,34 30,34" fill="#FFD700"/>
  
  <!-- Arena emblem -->
  <circle cx="32" cy="40" r="8" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  
  <!-- Text "CHAMPION" -->
  <text x="32" y="52" text-anchor="middle" font-family="Arial" font-size="4" fill="#FFFFFF" font-weight="bold">CHAMPION</text>
  
  <!-- Medal shine effect -->
  <ellipse cx="28" cy="35" rx="4" ry="3" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- Decorative border -->
  <circle cx="32" cy="40" r="16" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="2,1"/>
  
  <!-- Legendary glow -->
  <circle cx="32" cy="40" r="20" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
  
  <!-- Year/era mark -->
  <text x="32" y="25" text-anchor="middle" font-family="serif" font-size="3" fill="#FFFFFF">XI</text>
</svg>
