<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Champion Medal Item -->
  
  <!-- Medal ribbon -->
  <rect x="85" y="40" width="30" height="60" fill="#dc143c" stroke="#8b0000" stroke-width="2"/>
  <rect x="80" y="45" width="40" height="50" fill="#ff6347" stroke="#dc143c" stroke-width="1"/>
  
  <!-- Ribbon stripes -->
  <rect x="85" y="50" width="30" height="3" fill="#ffd700"/>
  <rect x="85" y="60" width="30" height="3" fill="#ffd700"/>
  <rect x="85" y="70" width="30" height="3" fill="#ffd700"/>
  <rect x="85" y="80" width="30" height="3" fill="#ffd700"/>
  
  <!-- Medal body -->
  <circle cx="100" cy="120" r="35" fill="#ffd700" stroke="#daa520" stroke-width="3"/>
  <circle cx="100" cy="120" r="30" fill="#ffed4e" stroke="#ffd700" stroke-width="2"/>
  
  <!-- Medal inner circle -->
  <circle cx="100" cy="120" r="25" fill="#ffd700" stroke="#daa520" stroke-width="1"/>
  
  <!-- Champion star -->
  <path d="M100 105 L105 115 L115 115 L107 122 L110 132 L100 125 L90 132 L93 122 L85 115 L95 115 Z" fill="#dc143c" stroke="#8b0000" stroke-width="1"/>
  
  <!-- Champion text -->
  <text x="100" y="145" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#8b0000">CHAMPION</text>
  
  <!-- Medal ring -->
  <circle cx="100" cy="85" r="8" fill="none" stroke="#daa520" stroke-width="3"/>
  <circle cx="100" cy="85" r="5" fill="#ffd700"/>
  
  <!-- Medal details - Engraved patterns -->
  <circle cx="100" cy="120" r="20" fill="none" stroke="#daa520" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="120" r="15" fill="none" stroke="#daa520" stroke-width="1" opacity="0.3"/>
  
  <!-- Shine effect -->
  <ellipse cx="90" cy="110" rx="8" ry="12" fill="#fff" opacity="0.3"/>
  <ellipse cx="85" cy="105" rx="4" ry="6" fill="#fff" opacity="0.5"/>
  
  <!-- Medal back shadow -->
  <ellipse cx="105" cy="125" rx="30" ry="8" fill="#000" opacity="0.2"/>
  
  <!-- Animation: Glowing effect -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="scale"
    values="1;1.05;1"
    dur="3s"
    repeatCount="indefinite"
    additive="sum"/>
</svg>
