<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lanternLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#FFFACD;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="lanternFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D2691E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="ancientMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="hopeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFFACD;stop-opacity:0.9" />
      <stop offset="60%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.7" />
    </radialGradient>
    
    <filter id="eternalGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="lanternShine">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Eternal light aura -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.4" filter="url(#eternalGlow)">
    <animate attributeName="r" values="80;90;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="100" r="60" fill="none" stroke="#FFA500" stroke-width="1.5" opacity="0.5" filter="url(#eternalGlow)">
    <animate attributeName="r" values="60;70;60" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Lantern handle -->
  <path d="M 100 40 Q 95 30 100 20 Q 105 30 100 40" 
        fill="none" 
        stroke="url(#ancientMetal)" 
        stroke-width="4" 
        stroke-linecap="round"/>
  
  <!-- Handle ring -->
  <circle cx="100" cy="20" r="8" fill="none" stroke="url(#ancientMetal)" stroke-width="3"/>
  
  <!-- Lantern top -->
  <ellipse cx="100" cy="50" rx="25" ry="8" fill="url(#ancientMetal)" stroke="#FF8C00" stroke-width="1"/>
  
  <!-- Lantern main body (cylindrical) -->
  <rect x="75" y="50" width="50" height="60" rx="5" fill="url(#lanternFrame)" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Glass panels -->
  <rect x="80" y="55" width="18" height="50" rx="2" fill="url(#lanternLight)" opacity="0.8" filter="url(#lanternShine)"/>
  <rect x="102" y="55" width="18" height="50" rx="2" fill="url(#lanternLight)" opacity="0.8" filter="url(#lanternShine)"/>
  
  <!-- Frame dividers -->
  <line x1="99" y1="55" x2="99" y2="105" stroke="#8B4513" stroke-width="2"/>
  <line x1="75" y1="80" x2="125" y2="80" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Lantern bottom -->
  <ellipse cx="100" cy="110" rx="25" ry="8" fill="url(#ancientMetal)" stroke="#FF8C00" stroke-width="1"/>
  
  <!-- Base -->
  <rect x="85" y="110" width="30" height="15" rx="3" fill="url(#ancientMetal)" stroke="#FF8C00" stroke-width="1"/>
  
  <!-- Base decorations -->
  <circle cx="90" cy="117" r="2" fill="#FFD700"/>
  <circle cx="100" cy="117" r="2" fill="#FFA500"/>
  <circle cx="110" cy="117" r="2" fill="#FFD700"/>
  
  <!-- Eternal flame core -->
  <ellipse cx="89" cy="80" rx="8" ry="12" fill="url(#hopeCore)" filter="url(#eternalGlow)">
    <animate attributeName="rx" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="12;15;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <ellipse cx="111" cy="80" rx="8" ry="12" fill="url(#hopeCore)" filter="url(#eternalGlow)">
    <animate attributeName="rx" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="12;15;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Flame animation -->
  <g opacity="0.8">
    <path d="M 89 75 Q 87 70 89 65 Q 91 70 89 75" fill="#FFD700">
      <animate attributeName="d" values="M 89 75 Q 87 70 89 65 Q 91 70 89 75;M 89 75 Q 86 72 89 67 Q 92 72 89 75;M 89 75 Q 87 70 89 65 Q 91 70 89 75" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 111 75 Q 109 70 111 65 Q 113 70 111 75" fill="#FFD700">
      <animate attributeName="d" values="M 111 75 Q 109 70 111 65 Q 113 70 111 75;M 111 75 Q 108 72 111 67 Q 114 72 111 75;M 111 75 Q 109 70 111 65 Q 113 70 111 75" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Ancient runes on lantern -->
  <g opacity="0.7">
    <text x="89" y="95" text-anchor="middle" fill="#FFD700" font-size="6" font-weight="bold">✦</text>
    <text x="111" y="95" text-anchor="middle" fill="#FFD700" font-size="6" font-weight="bold">✧</text>
  </g>
  
  <!-- Light rays emanating from lantern -->
  <g opacity="0.4">
    <line x1="89" y1="80" x2="70" y2="60" stroke="#FFD700" stroke-width="1">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="89" y1="80" x2="70" y2="100" stroke="#FFA500" stroke-width="1">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="111" y1="80" x2="130" y2="60" stroke="#FFD700" stroke-width="1">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="111" y1="80" x2="130" y2="100" stroke="#FFA500" stroke-width="1">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="80" x2="100" y2="50" stroke="#FFFFFF" stroke-width="1">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="80" x2="100" y2="110" stroke="#FFFACD" stroke-width="1">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Hope particles floating around lantern -->
  <circle cx="60" cy="70" r="2" fill="#FFFACD" opacity="0.8">
    <animate attributeName="cx" values="60;40;60" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;50;70" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="140" cy="80" r="1.5" fill="#FFD700" opacity="0.7">
    <animate attributeName="cx" values="140;160;140" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="70" cy="120" r="2.5" fill="#FFA500" opacity="0.6">
    <animate attributeName="cx" values="70;50;70" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;140;120" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="130" cy="130" r="1.8" fill="#FFFACD" opacity="0.9">
    <animate attributeName="cx" values="130;150;130" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;150;130" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Light energy waves -->
  <g opacity="0.3">
    <ellipse cx="100" cy="80" rx="40" ry="25" fill="none" stroke="#FFD700" stroke-width="1">
      <animate attributeName="rx" values="40;50;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="25;35;25" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="80" rx="30" ry="20" fill="none" stroke="#FFA500" stroke-width="1">
      <animate attributeName="rx" values="30;40;30" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="20;30;20" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Lantern highlights -->
  <ellipse cx="85" cy="60" rx="5" ry="3" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="115" cy="60" rx="5" ry="3" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Erdwin's symbol on lantern -->
  <g transform="translate(100, 80)" opacity="0.6">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#FFD700" stroke-width="0.5"/>
    <path d="M 0,-4 L 1,-1 L 4,-1 L 2,1 L 3,4 L 0,2 L -3,4 L -2,1 L -4,-1 L -1,-1 Z" 
          fill="#FFA500">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
