<svg width="150" height="180" viewBox="0 0 150 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Village Clothes - Starting armor -->
  
  <!-- Shirt -->
  <path d="M 50 60 Q 75 40 100 60 L 100 120 Q 75 130 50 120 Z" fill="#4169E1"/>
  
  <!-- Collar -->
  <path d="M 60 60 Q 75 50 90 60" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  
  <!-- Sleeves -->
  <ellipse cx="40" cy="80" rx="15" ry="25" fill="#4169E1" transform="rotate(-30 40 80)"/>
  <ellipse cx="110" cy="80" rx="15" ry="25" fill="#4169E1" transform="rotate(30 110 80)"/>
  
  <!-- Belt -->
  <rect x="45" y="110" width="60" height="8" fill="#8B4513"/>
  
  <!-- Pants -->
  <rect x="60" y="118" width="15" height="40" fill="#000080"/>
  <rect x="75" y="118" width="15" height="40" fill="#000080"/>
  
  <!-- Boots -->
  <ellipse cx="67" cy="162" rx="10" ry="8" fill="#8B4513"/>
  <ellipse cx="82" cy="162" rx="10" ry="8" fill="#8B4513"/>
  
  <!-- Simple pattern on shirt -->
  <g opacity="0.3">
    <circle cx="65" cy="80" r="3" fill="#FFFFFF"/>
    <circle cx="85" cy="80" r="3" fill="#FFFFFF"/>
    <circle cx="75" cy="95" r="3" fill="#FFFFFF"/>
  </g>
  
  <!-- Protective aura -->
  <ellipse cx="75" cy="90" rx="45" ry="55" fill="none" stroke="#87CEEB" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
  </ellipse>
</svg>
