<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ring metal gradient -->
    <linearGradient id="ringMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    
    <!-- Diamond gradient -->
    <radialGradient id="diamondGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#E6E6FA;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#B0C4DE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </radialGradient>
    
    <!-- Love energy gradient -->
    <radialGradient id="loveEnergy" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#FF69B4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:0.2" />
    </radialGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Diamond sparkle filter -->
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Love energy aura -->
  <circle cx="100" cy="100" r="80" 
          fill="url(#loveEnergy)" 
          filter="url(#glow)">
    <animate attributeName="r" 
             values="80;85;80" 
             dur="4s" 
             repeatCount="indefinite"/>
    <animate attributeName="opacity" 
             values="0.4;0.6;0.4" 
             dur="4s" 
             repeatCount="indefinite"/>
  </circle>
  
  <!-- Main ring -->
  <g transform="translate(100, 100)">
    <!-- Ring band -->
    <ellipse cx="0" cy="0" rx="45" ry="20" 
             fill="none" 
             stroke="url(#ringMetal)" 
             stroke-width="12"
             filter="url(#shadow)"/>
    
    <!-- Ring band highlight -->
    <ellipse cx="0" cy="-5" rx="40" ry="15" 
             fill="none" 
             stroke="#FFD700" 
             stroke-width="2" 
             opacity="0.7"/>
    
    <!-- Diamond setting -->
    <g transform="translate(0, -15)">
      <!-- Setting base -->
      <rect x="-8" y="0" width="16" height="8" 
            fill="url(#ringMetal)" 
            stroke="#FFA500" 
            stroke-width="1"/>
      
      <!-- Main diamond -->
      <polygon points="0,-15 8,-8 0,0 -8,-8" 
               fill="url(#diamondGradient)" 
               stroke="#E6E6FA" 
               stroke-width="1"
               filter="url(#sparkle)">
        <animate attributeName="opacity" 
                 values="1;0.8;1" 
                 dur="2s" 
                 repeatCount="indefinite"/>
      </polygon>
      
      <!-- Diamond facets -->
      <line x1="0" y1="-15" x2="0" y2="0" 
            stroke="#FFFFFF" 
            stroke-width="0.5" 
            opacity="0.8"/>
      <line x1="-8" y1="-8" x2="8" y2="-8" 
            stroke="#FFFFFF" 
            stroke-width="0.5" 
            opacity="0.8"/>
      <line x1="-8" y1="-8" x2="0" y2="-15" 
            stroke="#FFFFFF" 
            stroke-width="0.5" 
            opacity="0.6"/>
      <line x1="8" y1="-8" x2="0" y2="-15" 
            stroke="#FFFFFF" 
            stroke-width="0.5" 
            opacity="0.6"/>
      <line x1="-8" y1="-8" x2="0" y2="0" 
            stroke="#FFFFFF" 
            stroke-width="0.5" 
            opacity="0.6"/>
      <line x1="8" y1="-8" x2="0" y2="0" 
            stroke="#FFFFFF" 
            stroke-width="0.5" 
            opacity="0.6"/>
    </g>
    
    <!-- Small side diamonds -->
    <g transform="translate(-25, -5)">
      <polygon points="0,-6 4,-3 0,0 -4,-3" 
               fill="url(#diamondGradient)" 
               stroke="#E6E6FA" 
               stroke-width="0.5"
               filter="url(#sparkle)">
        <animate attributeName="opacity" 
                 values="0.8;0.6;0.8" 
                 dur="2.5s" 
                 repeatCount="indefinite"/>
      </polygon>
    </g>
    
    <g transform="translate(25, -5)">
      <polygon points="0,-6 4,-3 0,0 -4,-3" 
               fill="url(#diamondGradient)" 
               stroke="#E6E6FA" 
               stroke-width="0.5"
               filter="url(#sparkle)">
        <animate attributeName="opacity" 
                 values="0.8;0.6;0.8" 
                 dur="2.5s" 
                 begin="1s"
                 repeatCount="indefinite"/>
      </polygon>
    </g>
    
    <!-- Ring engraving details -->
    <g opacity="0.6">
      <text x="0" y="5" 
            font-family="serif" 
            font-size="8" 
            fill="#FFD700" 
            text-anchor="middle">♥</text>
      <text x="-15" y="2" 
            font-family="serif" 
            font-size="6" 
            fill="#FFA500" 
            text-anchor="middle">∞</text>
      <text x="15" y="2" 
            font-family="serif" 
            font-size="6" 
            fill="#FFA500" 
            text-anchor="middle">∞</text>
    </g>
    
    <!-- Floating love particles -->
    <g opacity="0.7">
      <path d="M -35,-25 C -37,-27 -40,-27 -40,-24 C -40,-21 -35,-15 -35,-15 C -35,-15 -30,-21 -30,-24 C -30,-27 -33,-27 -35,-25 Z" 
            fill="#FF69B4">
        <animate attributeName="cy" 
                 values="-25;-35;-25" 
                 dur="3s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.7;0.3;0.7" 
                 dur="3s" 
                 repeatCount="indefinite"/>
      </path>
      <path d="M 35,-25 C 33,-27 30,-27 30,-24 C 30,-21 35,-15 35,-15 C 35,-15 40,-21 40,-24 C 40,-27 37,-27 35,-25 Z" 
            fill="#FFB6C1">
        <animate attributeName="cy" 
                 values="-25;-35;-25" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.7;0.3;0.7" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
      </path>
      <path d="M 0,-40 C -2,-42 -5,-42 -5,-39 C -5,-36 0,-30 0,-30 C 0,-30 5,-36 5,-39 C 5,-42 2,-42 0,-40 Z" 
            fill="#FF69B4">
        <animate attributeName="cy" 
                 values="-40;-50;-40" 
                 dur="4s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.7;0.3;0.7" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Diamond sparkles -->
    <g opacity="0.8">
      <circle cx="0" cy="-20" r="1" fill="#FFFFFF">
        <animate attributeName="r" 
                 values="1;2;1" 
                 dur="1.5s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.8;0.2;0.8" 
                 dur="1.5s" 
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="5" cy="-18" r="0.8" fill="#FFFFFF">
        <animate attributeName="r" 
                 values="0.8;1.5;0.8" 
                 dur="1.8s" 
                 begin="0.5s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.8;0.2;0.8" 
                 dur="1.8s" 
                 begin="0.5s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="-5" cy="-18" r="0.8" fill="#FFFFFF">
        <animate attributeName="r" 
                 values="0.8;1.5;0.8" 
                 dur="1.8s" 
                 begin="1s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.8;0.2;0.8" 
                 dur="1.8s" 
                 begin="1s"
                 repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Eternal love energy pulses -->
    <g opacity="0.5">
      <circle cx="0" cy="0" r="50" 
              fill="none" 
              stroke="#FF69B4" 
              stroke-width="2">
        <animate attributeName="r" 
                 values="50;70;50" 
                 dur="4s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.5;0;0.5" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="50" 
              fill="none" 
              stroke="#FFB6C1" 
              stroke-width="1.5">
        <animate attributeName="r" 
                 values="50;70;50" 
                 dur="4s" 
                 begin="2s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.5;0;0.5" 
                 dur="4s" 
                 begin="2s"
                 repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
