<svg width="120" height="140" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Birthday Cake - Special celebration item -->
  
  <!-- Cake base -->
  <rect x="20" y="80" width="80" height="40" fill="#F5DEB3"/>
  
  <!-- Cake layers -->
  <rect x="25" y="70" width="70" height="15" fill="#FFB6C1"/>
  <rect x="30" y="60" width="60" height="15" fill="#FFC0CB"/>
  
  <!-- Cake plate -->
  <ellipse cx="60" cy="125" rx="45" ry="8" fill="#C0C0C0"/>
  <rect x="15" y="120" width="90" height="8" fill="#C0C0C0"/>
  
  <!-- Candles -->
  <rect x="35" y="45" width="4" height="20" fill="#FFD700"/>
  <rect x="50" y="40" width="4" height="25" fill="#FFD700"/>
  <rect x="65" y="45" width="4" height="20" fill="#FFD700"/>
  <rect x="80" y="40" width="4" height="25" fill="#FFD700"/>
  
  <!-- Candle flames -->
  <g>
    <ellipse cx="37" cy="42" rx="3" ry="4" fill="#FF4500">
      <animate attributeName="ry" values="4;5;4" dur="1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="52" cy="37" rx="3" ry="4" fill="#FF4500">
      <animate attributeName="ry" values="4;5;4" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="67" cy="42" rx="3" ry="4" fill="#FF4500">
      <animate attributeName="ry" values="4;5;4" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="82" cy="37" rx="3" ry="4" fill="#FF4500">
      <animate attributeName="ry" values="4;5;4" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Decorative frosting -->
  <g stroke="#FFFFFF" stroke-width="2" fill="none">
    <path d="M 25 75 Q 30 73 35 75 T 45 75 T 55 75 T 65 75 T 75 75 T 85 75 T 95 75"/>
    <path d="M 30 65 Q 35 63 40 65 T 50 65 T 60 65 T 70 65 T 80 65 T 90 65"/>
  </g>
  
  <!-- Celebration sparkles -->
  <g opacity="0.8">
    <circle cx="15" cy="30" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="35" r="1.5" fill="#FF69B4">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="50" r="1.8" fill="#FFD700">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="55" r="1.5" fill="#FF69B4">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Magical celebration aura -->
  <ellipse cx="60" cy="80" rx="50" ry="45" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
