<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sea Breeze Sword Item -->
  
  <!-- Blade - Flowing wave-like design -->
  <path d="M100 35 Q85 75 90 115 L95 120 L105 120 L110 115 Q115 75 100 35" fill="#87ceeb" stroke="#4682b4" stroke-width="2"/>
  
  <!-- Blade wave patterns -->
  <path d="M95 50 Q100 55 105 50 Q100 60 95 65 Q100 70 105 65 Q100 75 95 80 Q100 85 105 80 Q100 90 95 95 Q100 100 105 95" fill="none" stroke="#4682b4" stroke-width="1"/>
  
  <!-- Blade edge highlight -->
  <path d="M100 35 Q88 70 92 110 L100 115" fill="none" stroke="#add8e6" stroke-width="1"/>
  
  <!-- Cross guard - Ocean wave design -->
  <path d="M70 115 Q100 110 130 115 L125 125 L75 125 Z" fill="#4682b4" stroke="#1e3a8a" stroke-width="2"/>
  <path d="M75 118 Q100 115 125 118" fill="none" stroke="#87ceeb" stroke-width="1"/>
  
  <!-- Handle -->
  <rect x="95" y="125" width="10" height="45" fill="#8b4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Handle wrap - Sea shell pattern -->
  <rect x="95" y="127" width="10" height="6" fill="#87ceeb"/>
  <rect x="95" y="138" width="10" height="6" fill="#4682b4"/>
  <rect x="95" y="149" width="10" height="6" fill="#87ceeb"/>
  <rect x="95" y="160" width="10" height="6" fill="#4682b4"/>
  
  <!-- Pommel - Coral design -->
  <circle cx="100" cy="175" r="10" fill="#ff6347" stroke="#8b0000" stroke-width="2"/>
  <circle cx="100" cy="175" r="7" fill="#ff7f50"/>
  <circle cx="100" cy="175" r="4" fill="#ffa500"/>
  
  <!-- Blood groove -->
  <path d="M100 45 Q95 75 98 110" stroke="#4682b4" stroke-width="2" fill="none"/>
  
  <!-- Sharp point -->
  <path d="M100 35 L97 38 L100 41 L103 38 Z" fill="#add8e6"/>
  
  <!-- Water runes on blade -->
  <text x="100" y="65" text-anchor="middle" font-family="Arial" font-size="8" fill="#1e3a8a" transform="rotate(-5 100 65)">≈</text>
  <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="8" fill="#1e3a8a" transform="rotate(-5 100 85)">≈</text>
  <text x="100" y="105" text-anchor="middle" font-family="Arial" font-size="8" fill="#1e3a8a" transform="rotate(-5 100 105)">≈</text>
  
  <!-- Sea gems on cross guard -->
  <circle cx="80" cy="120" r="3" fill="#00bfff" stroke="#0080ff" stroke-width="1"/>
  <circle cx="100" cy="118" r="3" fill="#87ceeb" stroke="#4682b4" stroke-width="1"/>
  <circle cx="120" cy="120" r="3" fill="#00bfff" stroke="#0080ff" stroke-width="1"/>
  
  <!-- Water droplets around sword -->
  <circle cx="75" cy="140" r="2" fill="#87ceeb" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="125" cy="150" r="2" fill="#87ceeb" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="160" r="2" fill="#87ceeb" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Wind effect lines -->
  <path d="M60 100 Q70 95 80 100" fill="none" stroke="#87ceeb" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M120 100 Q130 95 140 100" fill="none" stroke="#87ceeb" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Sea breeze aura -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#87ceeb" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Animation: Flowing water effect -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="rotate"
    values="0 100 100; 3 100 100; 0 100 100; -3 100 100; 0 100 100"
    dur="5s"
    repeatCount="indefinite"
    additive="sum"/>
</svg>
