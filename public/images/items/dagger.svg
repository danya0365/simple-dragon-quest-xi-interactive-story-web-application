<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Erik's Dagger -->
  
  <!-- Dagger blade -->
  <g transform="rotate(45 50 50)">
    <path d="M 50 20 L 55 40 L 50 45 L 45 40 Z" fill="#C0C0C0"/>
    <path d="M 50 22 L 53 38 L 50 42 L 47 38 Z" fill="#E5E5E5"/>
    
    <!-- Blade edge -->
    <line x1="50" y1="20" x2="45" y2="40" stroke="#A9A9A9" stroke-width="1"/>
    <line x1="50" y1="20" x2="55" y2="40" stroke="#A9A9A9" stroke-width="1"/>
    
    <!-- Dagger guard -->
    <rect x="42" y="45" width="16" height="3" fill="#8B4513"/>
    <rect x="43" y="46" width="14" height="1" fill="#A0522D"/>
    
    <!-- Dagger handle -->
    <rect x="47" y="48" width="6" height="12" fill="#8B4513"/>
    <rect x="48" y="49" width="4" height="10" fill="#A0522D"/>
    
    <!-- Handle wrap pattern -->
    <rect x="47" y="51" width="6" height="1" fill="#654321"/>
    <rect x="47" y="54" width="6" height="1" fill="#654321"/>
    <rect x="47" y="57" width="6" height="1" fill="#654321"/>
    
    <!-- Pommel -->
    <circle cx="50" cy="62" r="3" fill="#654321"/>
    <circle cx="50" cy="62" r="2" fill="#8B4513"/>
  </g>
  
  <!-- Mysterious aura effect -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#9370DB" stroke-width="1" opacity="0.3"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#8A2BE2" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Thieves' guild symbol on handle -->
  <g transform="translate(50, 50) rotate(45) translate(-50, -50)">
    <circle cx="50" cy="54" r="2" fill="#4B0082"/>
    <path d="M 48 54 L 52 54 M 50 52 L 50 56" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>
  
  <!-- Sharpness sparkles -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="30" cy="30" r="0.5"/>
    <circle cx="70" cy="35" r="0.5"/>
    <circle cx="25" cy="45" r="0.5"/>
    <circle cx="75" cy="50" r="0.5"/>
  </g>
  
  <!-- Shadow -->
  <ellipse cx="50" cy="85" rx="20" ry="4" fill="#000000" opacity="0.2"/>
</svg>
