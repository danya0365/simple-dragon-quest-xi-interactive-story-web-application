<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert Robes - Heat-resistant desert robes -->
  
  <!-- Robe body (main) -->
  <path d="M 20 20 L 20 50 Q 20 55 25 55 L 39 55 Q 44 55 44 50 L 44 20 Q 44 15 39 15 L 25 15 Q 20 15 20 20" fill="#F4A460" stroke="#D2691E" stroke-width="1"/>
  
  <!-- Robe hood -->
  <path d="M 25 15 Q 25 8 32 8 Q 39 8 39 15" fill="#DEB887" stroke="#D2691E" stroke-width="1"/>
  
  <!-- Hood opening -->
  <ellipse cx="32" cy="15" rx="8" ry="4" fill="#FDBCB4" stroke="#D2691E" stroke-width="1"/>
  
  <!-- Face opening -->
  <ellipse cx="32" cy="20" rx="6" ry="3" fill="#FDBCB4"/>
  
  <!-- Robe sleeves -->
  <rect x="12" y="25" width="8" height="20" fill="#F4A460" stroke="#D2691E" stroke-width="1"/>
  <rect x="44" y="25" width="8" height="20" fill="#F4A460" stroke="#D2691E" stroke-width="1"/>
  
  <!-- Sleeve openings -->
  <ellipse cx="16" cy="45" rx="4" ry="2" fill="#DEB887"/>
  <ellipse cx="48" cy="45" rx="4" ry="2" fill="#DEB887"/>
  
  <!-- Robe belt -->
  <rect x="20" y="35" width="24" height="3" fill="#8B4513"/>
  <circle cx="32" cy="36.5" r="2" fill="#DAA520"/>
  
  <!-- Desert pattern on robe -->
  <path d="M 25 25 Q 27 23 29 25 T 33 25 T 37 25 T 39 25" stroke="#D2691E" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M 25 30 Q 27 28 29 30 T 33 30 T 37 30 T 39 30" stroke="#D2691E" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M 25 45 Q 27 43 29 45 T 33 45 T 37 45 T 39 45" stroke="#D2691E" stroke-width="0.5" fill="none" opacity="0.6"/>
  
  <!-- Heat resistance symbols -->
  <text x="32" y="42" text-anchor="middle" font-family="serif" font-size="4" fill="#8B4513">☀</text>
  
  <!-- Sand particles on robe -->
  <circle cx="28" cy="28" r="0.5" fill="#DEB887" opacity="0.7"/>
  <circle cx="36" cy="32" r="0.5" fill="#DEB887" opacity="0.7"/>
  <circle cx="30" cy="48" r="0.5" fill="#DEB887" opacity="0.7"/>
  <circle cx="38" cy="50" r="0.5" fill="#DEB887" opacity="0.7"/>
  
  <!-- Robe folds -->
  <line x1="25" y1="20" x2="25" y2="50" stroke="#D2691E" stroke-width="0.5" opacity="0.4"/>
  <line x1="39" y1="20" x2="39" y2="50" stroke="#D2691E" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Wind protection effect -->
  <path d="M 15 35 Q 20 33 25 35 T 35 35 T 45 35 T 50 35" stroke="#87CEEB" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>
