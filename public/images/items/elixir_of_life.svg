<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Elixir of Life Item -->
  <g transform="translate(100, 100)">
    <!-- Divine Healing Aura -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FF69B4" stroke-width="3" opacity="0.5">
      <animate attributeName="r" values="50;60;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Elixir Bottle -->
    <g transform="translate(0, 10)">
      <!-- Bottle Body -->
      <path d="M -15 -30 L -12 20 L 12 20 L 15 -30 Z" fill="#FFE4E1" stroke="#DC143C" stroke-width="2"/>
      
      <!-- Bottle Neck -->
      <rect x="-8" y="-40" width="16" height="10" fill="#FFE4E1" stroke="#DC143C" stroke-width="2"/>
      
      <!-- Bottle Cap -->
      <rect x="-10" y="-45" width="20" height="8" rx="2" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
      <rect x="-8" y="-43" width="16" height="4" rx="1" fill="#FFF8DC"/>
      
      <!-- Elixir Liquid -->
      <path d="M -13 -25 L -11 15 L 11 15 L 13 -25 Z" fill="#FF69B4" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.6;0.8" dur="3s" repeatCount="indefinite"/>
      </path>
      
      <!-- Liquid Surface -->
      <ellipse cx="0" cy="-25" rx="13" ry="3" fill="#FF1493" opacity="0.9">
        <animate attributeName="ry" values="3;4;3" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      
      <!-- Bubbles -->
      <circle cx="-5" cy="-10" r="2" fill="#FFB6C1" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="6" cy="5" r="1.5" fill="#FFB6C1" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-5" r="1" fill="#FFB6C1" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Bottle Label -->
      <rect x="-10" y="-5" width="20" height="12" rx="1" fill="#FFF8DC" stroke="#FFD700" stroke-width="1"/>
      <text x="0" y="2" font-family="Arial" font-size="6" text-anchor="middle" fill="#DC143C">ELIXIR</text>
    </g>
    
    <!-- Divine Light Particles -->
    <circle cx="-25" cy="-20" r="2" fill="#FFD700" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,-15; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="-10" r="1.5" fill="#FFB6C1" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; -6,-12; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-20" cy="25" r="1" fill="#FF69B4" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-8; 0,0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="30" r="1.2" fill="#FFD700" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-10; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Healing Energy Waves -->
    <g transform="translate(0, 10)">
      <ellipse cx="0" cy="-10" rx="20" ry="15" fill="none" stroke="#FF69B4" stroke-width="1" opacity="0.4">
        <animate attributeName="rx" values="20;25;20" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="-10" rx="25" ry="20" fill="none" stroke="#FFB6C1" stroke-width="1" opacity="0.3">
        <animate attributeName="rx" values="25;30;25" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Life Restoration Symbol -->
    <g transform="translate(0, -55)" opacity="0.9">
      <text x="-8" y="3" font-family="Arial" font-size="16" fill="#FF69B4">❤️</text>
    </g>
    
    <!-- Divine Power Glow -->
    <circle cx="0" cy="10" r="35" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="35;40;35" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Sacred Healing Field -->
    <g transform="translate(0, 10)">
      <path d="M -20 -20 L 20 20 M 20 -20 L -20 20" stroke="#FF69B4" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M -15 -15 L 15 15 M 15 -15 L -15 15" stroke="#FFB6C1" stroke-width="1" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Eternal Life Symbol -->
    <g transform="translate(0, 10)" opacity="0.8">
      <text x="-6" y="3" font-family="Arial" font-size="12" fill="#FFD700">∞</text>
    </g>
    
    <!-- Revitalization Energy -->
    <circle cx="0" cy="10" r="25" fill="none" stroke="#FF1493" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="25;30;25" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Divine Blessing -->
    <g transform="translate(0, -35)">
      <path d="M -10 0 L 0 -10 L 10 0" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
      </path>
      <circle cx="0" cy="-10" r="3" fill="#FFD700" opacity="0.8">
        <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Ultimate Healing Power -->
    <circle cx="0" cy="10" r="45" fill="none" stroke="#FF69B4" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="45;50;45" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
