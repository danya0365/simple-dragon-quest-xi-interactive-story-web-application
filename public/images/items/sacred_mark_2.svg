<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sacred Mark - Luminary's divine symbol -->
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="#FFA500" stroke-width="2"/>
  
  <!-- Central star -->
  <path d="M50 20 L55 35 L70 35 L58 45 L63 60 L50 50 L37 60 L42 45 L30 35 L45 35 Z" 
        fill="#FFD700" stroke="#FF8C00" stroke-width="1.5"/>
  
  <!-- Sacred rays -->
  <path d="M50 10 L50 25" stroke="#FFD700" stroke-width="2"/>
  <path d="M50 75 L50 90" stroke="#FFD700" stroke-width="2"/>
  <path d="M10 50 L25 50" stroke="#FFD700" stroke-width="2"/>
  <path d="M75 50 L90 50" stroke="#FFD700" stroke-width="2"/>
  <path d="M22 22 L32 32" stroke="#FFD700" stroke-width="2"/>
  <path d="M68 68 L78 78" stroke="#FFD700" stroke-width="2"/>
  <path d="M78 22 L68 32" stroke="#FFD700" stroke-width="2"/>
  <path d="M32 68 L22 78" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Sacred symbols in corners -->
  <circle cx="25" cy="25" r="3" fill="#FFA500"/>
  <circle cx="75" cy="25" r="3" fill="#FFA500"/>
  <circle cx="25" cy="75" r="3" fill="#FFA500"/>
  <circle cx="75" cy="75" r="3" fill="#FFA500"/>
  
  <!-- Divine glow effect -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#FFFFE0" stroke-width="1" opacity="0.5"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#FFFFE0" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Center gem -->
  <circle cx="50" cy="50" r="5" fill="#FF6347" stroke="#8B0000" stroke-width="1"/>
  
  <!-- Mystical text around -->
  <text x="50" y="15" text-anchor="middle" font-size="6" fill="#FFD700">LUMINARY</text>
</svg>
