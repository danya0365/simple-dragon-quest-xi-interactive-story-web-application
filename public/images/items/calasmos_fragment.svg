<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fragmentCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF6347;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF0000;stop-opacity:0.6" />
    </radialGradient>
    
    <radialGradient id="voidEnergy" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#4B0082;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.8" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Main fragment shape -->
  <g transform="translate(100, 100)">
    <!-- Fragment body -->
    <path d="M -40,-20 L -20,-40 L 20,-35 L 40,-15 L 35,20 L 15,40 L -20,35 L -40,15 Z" 
          fill="url(#fragmentCore)" 
          stroke="#8B0000" 
          stroke-width="2" 
          filter="url(#shadow)"/>
    
    <!-- Fragment cracks -->
    <path d="M -20,-30 L -10,-10 L -25,10" 
          fill="none" 
          stroke="#000000" 
          stroke-width="1.5" 
          opacity="0.7"/>
    <path d="M 15,-25 L 5,0 L 20,20" 
          fill="none" 
          stroke="#000000" 
          stroke-width="1.5" 
          opacity="0.7"/>
    <path d="M -30,5 L 0,15 L 25,5" 
          fill="none" 
          stroke="#000000" 
          stroke-width="1.5" 
          opacity="0.7"/>
    
    <!-- Dark energy core -->
    <circle cx="0" cy="0" r="15" 
            fill="url(#voidEnergy)" 
            filter="url(#glow)">
      <animate attributeName="r" 
               values="15;18;15" 
               dur="3s" 
               repeatCount="indefinite"/>
    </circle>
    
    <!-- Evil eye symbol -->
    <g transform="translate(0, 0)">
      <ellipse cx="0" cy="0" rx="8" ry="6" 
               fill="#FF0000" 
               opacity="0.8"/>
      <circle cx="0" cy="0" r="3" 
              fill="#000000"/>
      <circle cx="1" cy="-1" r="1" 
              fill="#FFFFFF"/>
    </g>
    
    <!-- Floating dark particles -->
    <g opacity="0.6">
      <circle cx="-25" cy="-25" r="2" fill="#8B0000">
        <animate attributeName="cy" 
                 values="-25;-35;-25" 
                 dur="4s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="25" cy="-20" r="1.5" fill="#DC143C">
        <animate attributeName="cy" 
                 values="-20;-30;-20" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="25" r="2" fill="#8B0000">
        <animate attributeName="cy" 
                 values="25;35;25" 
                 dur="4.5s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="4.5s" 
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="20" r="1.5" fill="#DC143C">
        <animate attributeName="cy" 
                 values="20;30;20" 
                 dur="3.8s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="3.8s" 
                 repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Void energy aura -->
    <circle cx="0" cy="0" r="45" 
            fill="none" 
            stroke="#4B0082" 
            stroke-width="1" 
            opacity="0.3"
            filter="url(#glow)">
      <animate attributeName="r" 
               values="45;50;45" 
               dur="5s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="0.3;0.1;0.3" 
               dur="5s" 
               repeatCount="indefinite"/>
    </circle>
    
    <!-- Dark energy pulses -->
    <g opacity="0.4">
      <circle cx="0" cy="0" r="35" 
              fill="none" 
              stroke="#8B0000" 
              stroke-width="2">
        <animate attributeName="r" 
                 values="35;55;35" 
                 dur="4s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.4;0;0.4" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="35" 
              fill="none" 
              stroke="#DC143C" 
              stroke-width="1.5">
        <animate attributeName="r" 
                 values="35;55;35" 
                 dur="4s" 
                 begin="2s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.4;0;0.4" 
                 dur="4s" 
                 begin="2s"
                 repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
