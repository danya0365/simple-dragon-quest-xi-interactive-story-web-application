<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Seed of Yggdrasil Item -->
  <g transform="translate(100, 100)">
    <!-- Life Force Aura -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#32CD32" stroke-width="3" opacity="0.5">
      <animate attributeName="r" values="55;65;55" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Main Seed Body -->
    <ellipse cx="0" cy="0" rx="25" ry="30" fill="#8B4513" stroke="#654321" stroke-width="2"/>
    
    <!-- Seed Texture Lines -->
    <path d="M -15 -20 Q -10 -15, -5 -20" fill="none" stroke="#654321" stroke-width="1"/>
    <path d="M 5 -20 Q 10 -15, 15 -20" fill="none" stroke="#654321" stroke-width="1"/>
    <path d="M -10 0 Q -5 5, 0 0" fill="none" stroke="#654321" stroke-width="1"/>
    <path d="M 0 0 Q 5 5, 10 0" fill="none" stroke="#654321" stroke-width="1"/>
    <path d="M -15 15 Q -10 20, -5 15" fill="none" stroke="#654321" stroke-width="1"/>
    <path d="M 5 15 Q 10 20, 15 15" fill="none" stroke="#654321" stroke-width="1"/>
    
    <!-- Sprout Emerging -->
    <g transform="translate(0, -25)">
      <!-- Stem -->
      <rect x="-2" y="-15" width="4" height="15" fill="#228B22" stroke="#006400" stroke-width="1"/>
      
      <!-- Leaves -->
      <ellipse cx="-8" cy="-18" rx="6" ry="4" fill="#32CD32" stroke="#228B22" stroke-width="1" transform="rotate(-30 -8 -18)"/>
      <ellipse cx="8" cy="-18" rx="6" ry="4" fill="#32CD32" stroke="#228B22" stroke-width="1" transform="rotate(30 8 -18)"/>
      <ellipse cx="0" cy="-22" rx="5" ry="3" fill="#228B22" stroke="#006400" stroke-width="1"/>
      
      <!-- Leaf Veins -->
      <path d="M -8 -18 L -8 -16" stroke="#006400" stroke-width="0.5"/>
      <path d="M 8 -18 L 8 -16" stroke="#006400" stroke-width="0.5"/>
      <path d="M 0 -22 L 0 -20" stroke="#006400" stroke-width="0.5"/>
    </g>
    
    <!-- Root System -->
    <g transform="translate(0, 25)">
      <path d="M 0 0 L -8 8 L -12 12" fill="none" stroke="#654321" stroke-width="2" stroke-linecap="round"/>
      <path d="M 0 0 L 0 10 L 0 15" fill="none" stroke="#654321" stroke-width="2" stroke-linecap="round"/>
      <path d="M 0 0 L 8 8 L 12 12" fill="none" stroke="#654321" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Root Tips -->
      <circle cx="-12" cy="12" r="2" fill="#8B4513"/>
      <circle cx="0" cy="15" r="2" fill="#8B4513"/>
      <circle cx="12" cy="12" r="2" fill="#8B4513"/>
    </g>
    
    <!-- Life Energy Core -->
    <circle cx="0" cy="0" r="12" fill="#90EE90" opacity="0.6" stroke="#32CD32" stroke-width="1">
      <animate attributeName="r" values="12;16;12" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Inner Glow -->
    <circle cx="0" cy="0" r="8" fill="#32CD32" opacity="0.8">
      <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Floating Life Particles -->
    <circle cx="-30" cy="-20" r="2" fill="#90EE90" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-15; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="-10" r="1.5" fill="#32CD32" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-12; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-25" cy="30" r="1" fill="#228B22" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 12,-8; 0,0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="25" r="1.2" fill="#90EE90" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,-10; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- World Creation Energy -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#228B22" stroke-width="1" opacity="0.4">
        <animate attributeName="r" values="35;40;35" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#32CD32" stroke-width="1" opacity="0.5">
        <animate attributeName="r" values="25;30;25" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Nature Symbols -->
    <g transform="translate(0, 0)" opacity="0.8">
      <text x="-8" y="3" font-family="Arial" font-size="12" fill="#228B22">🌱</text>
      <text x="2" y="3" font-family="Arial" font-size="12" fill="#32CD32">🌿</text>
    </g>
    
    <!-- Growth Animation -->
    <g transform="translate(0, -25)">
      <rect x="-2" y="-15" width="4" height="15" fill="#228B22" stroke="#006400" stroke-width="1">
        <animate attributeName="height" values="15;18;15" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-15;-18;-15" dur="4s" repeatCount="indefinite"/>
      </rect>
      
      <ellipse cx="-8" cy="-18" rx="6" ry="4" fill="#32CD32" stroke="#228B22" stroke-width="1" transform="rotate(-30 -8 -18)">
        <animate attributeName="rx" values="6;8;6" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="4;5;4" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="8" cy="-18" rx="6" ry="4" fill="#32CD32" stroke="#228B22" stroke-width="1" transform="rotate(30 8 -18)">
        <animate attributeName="rx" values="6;8;6" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="4;5;4" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Sacred Power Pulse -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#90EE90" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="20;28;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- World Restoration Energy -->
    <g transform="translate(0, 0)">
      <path d="M -15 -15 L 15 15 M 15 -15 L -15 15" stroke="#32CD32" stroke-width="1" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M -10 -10 L 10 10 M 10 -10 L -10 10" stroke="#90EE90" stroke-width="1" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
