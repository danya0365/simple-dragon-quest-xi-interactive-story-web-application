<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Frost Blade Item -->
  <g transform="translate(100, 100)">
    <!-- Sword Blade -->
    <path d="M -8 -60 L -6 20 L 6 20 L 8 -60 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Ice Crystal Pattern on Blade -->
    <path d="M 0 -50 L -3 -45 L 0 -40 L 3 -45 Z" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
    <path d="M 0 -35 L -2 -32 L 0 -29 L 2 -32 Z" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
    <path d="M 0 -20 L -3 -17 L 0 -14 L 3 -17 Z" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
    <path d="M 0 -5 L -2 -2 L 0 1 L 2 -2 Z" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
    
    <!-- Sword Guard -->
    <rect x="-15" y="18" width="30" height="8" rx="2" fill="#B0C4DE" stroke="#4682B4" stroke-width="2"/>
    <rect x="-12" y="20" width="24" height="4" rx="1" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
    
    <!-- Sword Handle -->
    <rect x="-6" y="26" width="12" height="25" rx="2" fill="#4682B4" stroke="#2F4F4F" stroke-width="2"/>
    
    <!-- Handle Wrapping -->
    <rect x="-6" y="28" width="12" height="3" rx="1" fill="#87CEEB"/>
    <rect x="-6" y="33" width="12" height="3" rx="1" fill="#87CEEB"/>
    <rect x="-6" y="38" width="12" height="3" rx="1" fill="#87CEEB"/>
    <rect x="-6" y="43" width="12" height="3" rx="1" fill="#87CEEB"/>
    
    <!-- Pommel -->
    <circle cx="0" cy="55" r="8" fill="#B0C4DE" stroke="#4682B4" stroke-width="2"/>
    <circle cx="0" cy="55" r="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
    
    <!-- Ice Edge Glow -->
    <path d="M -8 -60 L -6 20 L 6 20 L 8 -60 Z" fill="none" stroke="#00BFFF" stroke-width="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Frost Particles -->
    <circle cx="-15" cy="-40" r="2" fill="#F0F9FF" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-10; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="-25" r="1.5" fill="#BAE6FD" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,-8; 0,0" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-12" cy="10" r="1" fill="#E0F2FE" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0,0; 6,-6; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="35" r="1.2" fill="#F0F9FF" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,-7; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cold Aura -->
    <ellipse cx="0" cy="0" rx="40" ry="80" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.3">
      <animate attributeName="rx" values="40;45;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Ice Shards -->
    <g transform="translate(-20, -50)">
      <path d="M 0 0 L 2 -4 L 4 0 L 2 1 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.5" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(20, -30)">
      <path d="M 0 0 L 1.5 -3 L 3 0 L 1.5 0.5 Z" fill="#BAE6FD" stroke="#0284C7" stroke-width="0.5" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Power Core at Tip -->
    <circle cx="0" cy="-60" r="4" fill="#00BFFF" stroke="#0080FF" stroke-width="1">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Magic Runes -->
    <g transform="translate(0, -10)" opacity="0.6">
      <text x="-3" y="0" font-family="Arial" font-size="8" fill="#0284C7">❄</text>
      <text x="-3" y="15" font-family="Arial" font-size="8" fill="#0284C7">❅</text>
      <text x="-3" y="30" font-family="Arial" font-size="8" fill="#0284C7">❆</text>
    </g>
  </g>
</svg>
