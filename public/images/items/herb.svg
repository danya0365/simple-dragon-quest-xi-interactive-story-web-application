<svg width="100" height="150" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Medicinal Herb - Healing item -->
  
  <!-- Stem -->
  <rect x="47" y="80" width="6" height="60" fill="#228B22"/>
  
  <!-- Leaves -->
  <ellipse cx="35" cy="70" rx="15" ry="25" fill="#32CD32" transform="rotate(-30 35 70)"/>
  <ellipse cx="65" cy="70" rx="15" ry="25" fill="#32CD32" transform="rotate(30 65 70)"/>
  <ellipse cx="50" cy="60" rx="12" ry="20" fill="#228B22"/>
  
  <!-- Leaf veins -->
  <g stroke="#006400" stroke-width="1" fill="none" opacity="0.5">
    <line x1="35" y1="70" x2="35" y2="50"/>
    <line x1="65" y1="70" x2="65" y2="50"/>
    <line x1="50" y1="60" x2="50" y2="40"/>
  </g>
  
  <!-- Roots -->
  <g stroke="#8B4513" stroke-width="2" fill="none">
    <path d="M 47 140 Q 40 145 35 150"/>
    <path d="M 53 140 Q 60 145 65 150"/>
    <path d="M 50 140 Q 50 145 50 150"/>
  </g>
  
  <!-- Healing particles -->
  <g opacity="0.7">
    <circle cx="30" cy="40" r="2" fill="#90EE90">
      <animate attributeName="cy" values="40;30;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="45" r="1.5" fill="#90EE90">
      <animate attributeName="cy" values="45;35;45" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="30" r="2" fill="#90EE90">
      <animate attributeName="cy" values="30;20;30" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Magical glow -->
  <ellipse cx="50" cy="70" rx="25" ry="35" fill="none" stroke="#90EE90" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite"/>
  </ellipse>
</svg>
