<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Aura Effect -->
  <defs>
    <radialGradient id="darkAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4a0080;stop-opacity:0.3">
        <animate attributeName="stop-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" style="stop-color:#1a0033;stop-opacity:0.2">
        <animate attributeName="stop-opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b00ff;stop-opacity:0.9"/>
      <stop offset="30%" style="stop-color:#4a0080;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#1a0033;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.6"/>
    </radialGradient>
    
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.8">
        <animate attributeName="stop-opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#8b00ff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#4a0080;stop-opacity:0.2"/>
    </radialGradient>
    
    <filter id="darkGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark Aura Background -->
  <circle cx="100" cy="100" r="90" fill="url(#darkAura)">
    <animate attributeName="r" values="90;100;90" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main Orb Body -->
  <circle cx="100" cy="100" r="60" fill="url(#orbCore)" filter="url(#darkGlow)">
    <animate attributeName="r" values="60;62;60" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner Dark Energy Core -->
  <circle cx="100" cy="100" r="35" fill="url(#innerGlow)">
    <animate attributeName="r" values="35;38;35" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Dark Energy Swirls -->
  <path d="M 100 65 Q 120 80 115 100 T 100 135 Q 80 120 85 100 T 100 65" 
        fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 100 100;360 100 100" dur="8s" repeatCount="indefinite"/>
  </path>
  
  <path d="M 100 65 Q 80 80 85 100 T 100 135 Q 120 120 115 100 T 100 65" 
        fill="none" stroke="#8b00ff" stroke-width="1.5" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 100 100;-360 100 100" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Dark Cracks on Surface -->
  <path d="M 70 85 L 75 95 L 80 90" fill="none" stroke="#000000" stroke-width="1" opacity="0.7"/>
  <path d="M 120 80 L 125 90 L 130 85" fill="none" stroke="#000000" stroke-width="1" opacity="0.7"/>
  <path d="M 85 115 L 90 125 L 95 120" fill="none" stroke="#000000" stroke-width="1" opacity="0.7"/>
  <path d="M 105 110 L 110 120 L 115 115" fill="none" stroke="#000000" stroke-width="1" opacity="0.7"/>
  
  <!-- Floating Dark Particles -->
  <circle cx="85" cy="75" r="2" fill="#4a0080" opacity="0.8">
    <animate attributeName="cy" values="75;65;75" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="115" cy="85" r="1.5" fill="#8b00ff" opacity="0.7">
    <animate attributeName="cy" values="85;75;85" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="90" cy="125" r="2" fill="#ff00ff" opacity="0.6">
    <animate attributeName="cy" values="125;115;125" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="110" cy="120" r="1" fill="#4a0080" opacity="0.9">
    <animate attributeName="cy" values="120;110;120" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Dark Energy Burst Effect -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#ff00ff" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="40;70;40" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="100" r="45" fill="none" stroke="#8b00ff" stroke-width="0.3" opacity="0">
    <animate attributeName="r" values="45;75;45" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central Dark Eye -->
  <ellipse cx="100" cy="100" rx="8" ry="12" fill="#000000" opacity="0.9">
    <animate attributeName="rx" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="12;14;12" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <ellipse cx="100" cy="100" rx="4" ry="6" fill="#ff00ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
</svg>
