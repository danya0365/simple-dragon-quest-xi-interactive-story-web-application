<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Prison Key - old, rusty, dungeon key -->
  
  <!-- Key head (circular part) -->
  <circle cx="20" cy="32" r="12" fill="#8B7355" stroke="#654321" stroke-width="2"/>
  
  <!-- Key hole in head -->
  <circle cx="20" cy="32" r="4" fill="#2C1810"/>
  
  <!-- Key shaft -->
  <rect x="32" y="28" width="24" height="8" fill="#8B7355" stroke="#654321" stroke-width="1"/>
  
  <!-- Key teeth (bottom) -->
  <rect x="44" y="36" width="4" height="6" fill="#8B7355" stroke="#654321" stroke-width="1"/>
  <rect x="50" y="36" width="4" height="8" fill="#8B7355" stroke="#654321" stroke-width="1"/>
  
  <!-- Key teeth (top) -->
  <rect x="38" y="20" width="4" height="8" fill="#8B7355" stroke="#654321" stroke-width="1"/>
  
  <!-- Rust spots -->
  <circle cx="15" cy="28" r="1.5" fill="#A0522D" opacity="0.7"/>
  <circle cx="25" cy="35" r="1" fill="#A0522D" opacity="0.7"/>
  <circle cx="40" cy="30" r="1" fill="#A0522D" opacity="0.7"/>
  <circle cx="48" cy="34" r="1.5" fill="#A0522D" opacity="0.7"/>
  
  <!-- Wear and tear marks -->
  <line x1="18" y1="24" x2="22" y2="26" stroke="#654321" stroke-width="0.5" opacity="0.5"/>
  <line x1="35" y1="29" x2="38" y2="31" stroke="#654321" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Highlight for 3D effect -->
  <ellipse cx="18" cy="28" rx="3" ry="2" fill="#A0826D" opacity="0.4"/>
</svg>
