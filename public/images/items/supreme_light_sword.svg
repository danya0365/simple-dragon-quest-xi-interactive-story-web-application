<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="supremeBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#FFFACD;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="hiltGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="lightCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFFACD;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="holyGem" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E6E6FA;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#DDA0DD;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#9370DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B0082;stop-opacity:1" />
    </radialGradient>
    
    <filter id="supremeGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="bladeShine">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Supreme light aura -->
  <ellipse cx="100" cy="100" rx="100" ry="70" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.4" filter="url(#supremeGlow)">
    <animate attributeName="rx" values="100;110;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="70;80;70" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <ellipse cx="100" cy="100" rx="80" ry="55" fill="none" stroke="#FFA500" stroke-width="2" opacity="0.5" filter="url(#supremeGlow)">
    <animate attributeName="rx" values="80;90;80" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="55;65;55" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Sword blade (supreme form) -->
  <path d="M 100 30 L 92 130 L 100 140 L 108 130 L 100 30 Z" 
        fill="url(#supremeBlade)" 
        stroke="#FF6347" 
        stroke-width="2" 
        filter="url(#bladeShine)"/>
  
  <!-- Blade edge highlights -->
  <path d="M 100 30 L 96 130 L 100 135" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="1.5" 
        opacity="0.9"/>
  
  <path d="M 100 30 L 104 130 L 100 135" 
        fill="none" 
        stroke="#FFFACD" 
        stroke-width="1.5" 
        opacity="0.7"/>
  
  <!-- Sacred runes on blade -->
  <g opacity="0.8">
    <text x="100" y="60" text-anchor="middle" fill="#FFD700" font-size="8" font-weight="bold">✦</text>
    <text x="100" y="80" text-anchor="middle" fill="#FFA500" font-size="8" font-weight="bold">✧</text>
    <text x="100" y="100" text-anchor="middle" fill="#FF8C00" font-size="8" font-weight="bold">✦</text>
  </g>
  
  <!-- Cross guard (ornate) -->
  <rect x="60" y="125" width="80" height="12" rx="3" fill="url(#hiltGold)" stroke="#FF8C00" stroke-width="2"/>
  
  <!-- Cross guard decorations -->
  <path d="M 65 131 L 75 131 M 85 131 L 95 131 M 105 131 L 115 131 M 125 131 L 135 131" 
        stroke="#FFD700" 
        stroke-width="1" 
        stroke-linecap="round"/>
  
  <!-- Holy gems on cross guard -->
  <circle cx="70" cy="131" r="3" fill="url(#holyGem)" filter="url(#bladeShine)">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="131" r="4" fill="url(#holyGem)" filter="url(#bladeShine)">
    <animate attributeName="r" values="4;5;4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="130" cy="131" r="3" fill="url(#holyGem)" filter="url(#bladeShine)">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Hilt -->
  <rect x="90" y="137" width="20" height="25" rx="2" fill="url(#hiltGold)" stroke="#FF8C00" stroke-width="1"/>
  
  <!-- Hilt wrapping -->
  <rect x="92" y="139" width="16" height="3" fill="#FFD700" opacity="0.8"/>
  <rect x="92" y="144" width="16" height="3" fill="#FFD700" opacity="0.8"/>
  <rect x="92" y="149" width="16" height="3" fill="#FFD700" opacity="0.8"/>
  <rect x="92" y="154" width="16" height="3" fill="#FFD700" opacity="0.8"/>
  
  <!-- Pommel -->
  <circle cx="100" cy="167" r="10" fill="url(#hiltGold)" stroke="#FF8C00" stroke-width="1"/>
  <circle cx="100" cy="167" r="6" fill="url(#lightCore)" filter="url(#bladeShine)">
    <animate attributeName="r" values="6;8;6" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Supreme light energy flowing along blade -->
  <g opacity="0.7">
    <path d="M 100 40 L 98 120" stroke="#FFFFFF" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.9;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 50 L 102 125" stroke="#FFFACD" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 60 L 99 115" stroke="#FFD700" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Holy light particles -->
  <circle cx="80" cy="70" r="2" fill="#FFFFFF" opacity="0.9">
    <animate attributeName="cy" values="70;50;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="120" cy="80" r="1.5" fill="#FFFACD" opacity="0.8">
    <animate attributeName="cy" values="80;60;80" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="85" cy="110" r="2.5" fill="#FFD700" opacity="0.7">
    <animate attributeName="cx" values="85;105;85" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="115" cy="120" r="1.8" fill="#FFA500" opacity="0.9">
    <animate attributeName="cx" values="115;95;115" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Light energy pulses -->
  <g opacity="0.4">
    <ellipse cx="100" cy="80" rx="20" ry="5" fill="#FFFFFF">
      <animate attributeName="rx" values="20;30;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="100" rx="15" ry="3" fill="#FFFACD">
      <animate attributeName="rx" values="15;25;15" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Sword tip energy -->
  <circle cx="100" cy="30" r="5" fill="#FFFFFF" opacity="1" filter="url(#supremeGlow)">
    <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Divine light rays -->
  <g opacity="0.5">
    <line x1="100" y1="30" x2="100" y2="10" stroke="#FFFFFF" stroke-width="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="30" x2="115" y2="20" stroke="#FFFACD" stroke-width="1.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="30" x2="85" y2="20" stroke="#FFFACD" stroke-width="1.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="30" x2="120" y2="30" stroke="#FFD700" stroke-width="1">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="30" x2="80" y2="30" stroke="#FFD700" stroke-width="1">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Supreme power symbol on blade -->
  <g transform="translate(100, 90)" opacity="0.8">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#FFD700" stroke-width="1"/>
    <path d="M 0,-6 L 2,-2 L 6,-2 L 3,1 L 4,5 L 0,3 L -4,5 L -3,1 L -6,-2 L -2,-2 Z" 
          fill="#FFA500">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
