<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bladeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6F3FF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#B3D9FF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#66B2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A75FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="hiltGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="gemCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#E6F3FF;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#66B2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A75FF;stop-opacity:1" />
    </radialGradient>
    
    <filter id="timeGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="bladeShine">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Time energy aura -->
  <ellipse cx="100" cy="100" rx="90" ry="60" fill="none" stroke="#66B2FF" stroke-width="2" opacity="0.3" filter="url(#timeGlow)">
    <animate attributeName="rx" values="90;100;90" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="60;70;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  
  <ellipse cx="100" cy="100" rx="70" ry="45" fill="none" stroke="#99CCFF" stroke-width="1.5" opacity="0.4" filter="url(#timeGlow)">
    <animate attributeName="rx" values="70;80;70" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="45;55;45" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Sword blade -->
  <path d="M 100 40 L 95 120 L 100 130 L 105 120 L 100 40 Z" 
        fill="url(#bladeGradient)" 
        stroke="#1A75FF" 
        stroke-width="2" 
        filter="url(#bladeShine)"/>
  
  <!-- Blade edge highlights -->
  <path d="M 100 40 L 97 120 L 100 125" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="1" 
        opacity="0.8"/>
  
  <path d="M 100 40 L 103 120 L 100 125" 
        fill="none" 
        stroke="#E6F3FF" 
        stroke-width="1" 
        opacity="0.6"/>
  
  <!-- Sword hilt -->
  <rect x="85" y="120" width="30" height="15" rx="3" fill="url(#hiltGradient)" stroke="#FF8C00" stroke-width="1"/>
  
  <!-- Hilt details -->
  <rect x="88" y="123" width="24" height="3" fill="#FFD700" opacity="0.8"/>
  <rect x="88" y="129" width="24" height="3" fill="#FFA500" opacity="0.6"/>
  
  <!-- Cross guard -->
  <rect x="70" y="125" width="60" height="8" rx="2" fill="url(#hiltGradient)" stroke="#FF8C00" stroke-width="1"/>
  
  <!-- Cross guard decorations -->
  <circle cx="80" cy="129" r="2" fill="#FFD700"/>
  <circle cx="100" cy="129" r="3" fill="#FFA500"/>
  <circle cx="120" cy="129" r="2" fill="#FFD700"/>
  
  <!-- Pommel -->
  <circle cx="100" cy="145" r="8" fill="url(#hiltGradient)" stroke="#FF8C00" stroke-width="1"/>
  <circle cx="100" cy="145" r="4" fill="#FFD700" opacity="0.8"/>
  
  <!-- Time gem in pommel -->
  <circle cx="100" cy="145" r="6" fill="url(#gemCore)" filter="url(#bladeShine)">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Time energy flowing along blade -->
  <g opacity="0.6">
    <path d="M 100 50 L 98 110" stroke="#E6F3FF" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 60 L 102 115" stroke="#B3D9FF" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.7;0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 70 L 99 105" stroke="#99CCFF" stroke-width="2" fill="none">
      <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Floating time symbols -->
  <g opacity="0.5">
    <!-- Hourglass symbol -->
    <g transform="translate(60, 80)">
      <path d="M -5 -8 L 5 -8 L 3 0 L 5 8 L -5 8 L -3 0 Z" fill="#66B2FF" stroke="#1A75FF" stroke-width="0.5"/>
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#1A75FF" stroke-width="0.5"/>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <g opacity="0.4">
    <!-- Clock symbol -->
    <g transform="translate(140, 90)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="#99CCFF" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="-4" stroke="#99CCFF" stroke-width="1"/>
      <line x1="0" y1="0" x2="3" y2="0" stroke="#99CCFF" stroke-width="1"/>
      <animateTransform attributeName="transform" type="rotate" values="360 0 0;0 0 0" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Time particles around blade -->
  <circle cx="75" cy="60" r="2" fill="#E6F3FF" opacity="0.8">
    <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="125" cy="70" r="1.5" fill="#B3D9FF" opacity="0.7">
    <animate attributeName="cy" values="70;50;70" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="85" cy="100" r="2.5" fill="#99CCFF" opacity="0.6">
    <animate attributeName="cx" values="85;105;85" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="115" cy="110" r="1.8" fill="#E6F3FF" opacity="0.9">
    <animate attributeName="cx" values="115;95;115" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Blade energy pulses -->
  <g opacity="0.4">
    <ellipse cx="100" cy="80" rx="15" ry="3" fill="#E6F3FF">
      <animate attributeName="rx" values="15;25;15" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="100" rx="12" ry="2" fill="#B3D9FF">
      <animate attributeName="rx" values="12;20;12" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Sword tip energy -->
  <circle cx="100" cy="40" r="4" fill="#FFFFFF" opacity="0.9" filter="url(#bladeShine)">
    <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
