<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Flower gradients -->
    <radialGradient id="roseGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="lilyGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0F8FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E6E6FA;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="daisyGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFE0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFACD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </radialGradient>
    
    <!-- Leaf gradient -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ribbon gradient -->
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    
    <!-- Fragrance aura gradient -->
    <radialGradient id="fragranceAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:0.3" />
      <stop offset="30%" style="stop-color:#FF69B4;stop-opacity:0.2" />
      <stop offset="60%" style="stop-color:#E6E6FA;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#DDA0DD;stop-opacity:0.1" />
    </radialGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fragrance aura -->
  <circle cx="100" cy="100" r="85" 
          fill="url(#fragranceAura)" 
          filter="url(#glow)">
    <animate attributeName="r" 
             values="85;90;85" 
             dur="5s" 
             repeatCount="indefinite"/>
    <animate attributeName="opacity" 
             values="0.3;0.5;0.3" 
             dur="5s" 
             repeatCount="indefinite"/>
  </circle>
  
  <!-- Main bouquet -->
  <g transform="translate(100, 100)">
    <!-- Bouquet stems -->
    <g>
      <path d="M -15,20 L -12,60 L -10,80" 
            fill="none" 
            stroke="url(#leafGradient)" 
            stroke-width="2"/>
      <path d="M -8,15 L -6,55 L -4,75" 
            fill="none" 
            stroke="url(#leafGradient)" 
            stroke-width="2"/>
      <path d="M 0,10 L 0,50 L 2,70" 
            fill="none" 
            stroke="url(#leafGradient)" 
            stroke-width="2"/>
      <path d="M 8,15 L 6,55 L 4,75" 
            fill="none" 
            stroke="url(#leafGradient)" 
            stroke-width="2"/>
      <path d="M 15,20 L 12,60 L 10,80" 
            fill="none" 
            stroke="url(#leafGradient)" 
            stroke-width="2"/>
    </g>
    
    <!-- Central rose -->
    <g transform="translate(0, 0)">
      <!-- Rose petals -->
      <circle cx="0" cy="0" r="12" fill="url(#roseGradient)" opacity="0.9"/>
      <circle cx="-8" cy="-5" r="10" fill="url(#roseGradient)" opacity="0.8"/>
      <circle cx="8" cy="-5" r="10" fill="url(#roseGradient)" opacity="0.8"/>
      <circle cx="0" cy="-10" r="9" fill="url(#roseGradient)" opacity="0.9"/>
      <circle cx="-6" cy="5" r="8" fill="url(#roseGradient)" opacity="0.7"/>
      <circle cx="6" cy="5" r="8" fill="url(#roseGradient)" opacity="0.7"/>
      
      <!-- Rose center -->
      <circle cx="0" cy="0" r="5" fill="#8B0000" opacity="0.8"/>
      <circle cx="0" cy="0" r="3" fill="#FFD700" opacity="0.9"/>
    </g>
    
    <!-- Left lily -->
    <g transform="translate(-20, -5)">
      <!-- Lily petals -->
      <ellipse cx="0" cy="-8" rx="6" ry="12" fill="url(#lilyGradient)" opacity="0.9"/>
      <ellipse cx="-8" cy="0" rx="6" ry="12" fill="url(#lilyGradient)" opacity="0.8" transform="rotate(-45 -8 0)"/>
      <ellipse cx="8" cy="0" rx="6" ry="12" fill="url(#lilyGradient)" opacity="0.8" transform="rotate(45 8 0)"/>
      <ellipse cx="0" cy="8" rx="6" ry="12" fill="url(#lilyGradient)" opacity="0.7"/>
      
      <!-- Lily center -->
      <circle cx="0" cy="0" r="4" fill="#FFD700" opacity="0.8"/>
      <circle cx="0" cy="0" r="2" fill="#FFA500" opacity="0.9"/>
    </g>
    
    <!-- Right lily -->
    <g transform="translate(20, -5)">
      <!-- Lily petals -->
      <ellipse cx="0" cy="-8" rx="6" ry="12" fill="url(#lilyGradient)" opacity="0.9"/>
      <ellipse cx="-8" cy="0" rx="6" ry="12" fill="url(#lilyGradient)" opacity="0.8" transform="rotate(-45 -8 0)"/>
      <ellipse cx="8" cy="0" rx="6" ry="12" fill="url(#lilyGradient)" opacity="0.8" transform="rotate(45 8 0)"/>
      <ellipse cx="0" cy="8" rx="6" ry="12" fill="url(#lilyGradient)" opacity="0.7"/>
      
      <!-- Lily center -->
      <circle cx="0" cy="0" r="4" fill="#FFD700" opacity="0.8"/>
      <circle cx="0" cy="0" r="2" fill="#FFA500" opacity="0.9"/>
    </g>
    
    <!-- Top daisy -->
    <g transform="translate(0, -15)">
      <!-- Daisy petals -->
      <circle cx="0" cy="-8" r="4" fill="url(#daisyGradient)"/>
      <circle cx="-6" cy="-6" r="4" fill="url(#daisyGradient)"/>
      <circle cx="-8" cy="0" r="4" fill="url(#daisyGradient)"/>
      <circle cx="-6" cy="6" r="4" fill="url(#daisyGradient)"/>
      <circle cx="0" cy="8" r="4" fill="url(#daisyGradient)"/>
      <circle cx="6" cy="6" r="4" fill="url(#daisyGradient)"/>
      <circle cx="8" cy="0" r="4" fill="url(#daisyGradient)"/>
      <circle cx="6" cy="-6" r="4" fill="url(#daisyGradient)"/>
      
      <!-- Daisy center -->
      <circle cx="0" cy="0" r="5" fill="#FFD700" opacity="0.9"/>
      <circle cx="0" cy="0" r="3" fill="#FFA500" opacity="0.8"/>
    </g>
    
    <!-- Small filler flowers -->
    <g transform="translate(-12, 8)">
      <circle cx="0" cy="0" r="3" fill="#FFB6C1" opacity="0.8"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFD700" opacity="0.9"/>
    </g>
    
    <g transform="translate(12, 8)">
      <circle cx="0" cy="0" r="3" fill="#E6E6FA" opacity="0.8"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFD700" opacity="0.9"/>
    </g>
    
    <g transform="translate(-8, -10)">
      <circle cx="0" cy="0" r="2.5" fill="#FFFFE0" opacity="0.8"/>
      <circle cx="0" cy="0" r="1" fill="#FFA500" opacity="0.9"/>
    </g>
    
    <g transform="translate(8, -10)">
      <circle cx="0" cy="0" r="2.5" fill="#FFB6C1" opacity="0.8"/>
      <circle cx="0" cy="0" r="1" fill="#FFD700" opacity="0.9"/>
    </g>
    
    <!-- Leaves -->
    <g>
      <ellipse cx="-18" cy="30" rx="8" ry="15" 
               fill="url(#leafGradient)" 
               stroke="#228B22" 
               stroke-width="1"
               transform="rotate(-30 -18 30)"/>
      <ellipse cx="18" cy="30" rx="8" ry="15" 
               fill="url(#leafGradient)" 
               stroke="#228B22" 
               stroke-width="1"
               transform="rotate(30 18 30)"/>
      <ellipse cx="0" cy="35" rx="6" ry="12" 
               fill="url(#leafGradient)" 
               stroke="#228B22" 
               stroke-width="1"/>
    </g>
    
    <!-- Ribbon wrap -->
    <g transform="translate(0, 25)">
      <rect x="-25" y="-3" width="50" height="6" 
            fill="url(#ribbonGradient)" 
            stroke="#FFA500" 
            stroke-width="1"
            filter="url(#shadow)"/>
      
      <!-- Ribbon bow -->
      <path d="M -25,0 L -35,-8 L -35,8 Z" 
            fill="url(#ribbonGradient)" 
            stroke="#FFA500" 
            stroke-width="1"/>
      <path d="M 25,0 L 35,-8 L 35,8 Z" 
            fill="url(#ribbonGradient)" 
            stroke="#FFA500" 
            stroke-width="1"/>
      
      <!-- Bow center -->
      <ellipse cx="0" cy="0" rx="8" ry="6" 
               fill="url(#ribbonGradient)" 
               stroke="#FFA500" 
               stroke-width="1"/>
    </g>
    
    <!-- Floating fragrance particles -->
    <g opacity="0.6">
      <circle cx="-20" cy="-20" r="2" fill="#FFB6C1">
        <animate attributeName="cy" 
                 values="-20;-30;-20" 
                 dur="4s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="-25" r="1.5" fill="#E6E6FA">
        <animate attributeName="cy" 
                 values="-25;-35;-25" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-30" r="2" fill="#FFFFE0">
        <animate attributeName="cy" 
                 values="-30;-40;-30" 
                 dur="4.5s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="4.5s" 
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="-10" cy="-35" r="1.5" fill="#FFD700">
        <animate attributeName="cy" 
                 values="-35;-45;-35" 
                 dur="3.8s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="3.8s" 
                 repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Sparkle effects -->
    <g opacity="0.8">
      <circle cx="-5" cy="-5" r="1" fill="#FFFFFF">
        <animate attributeName="r" 
                 values="1;2;1" 
                 dur="2s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.8;0.3;0.8" 
                 dur="2s" 
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="10" cy="-8" r="0.8" fill="#FFFFFF">
        <animate attributeName="r" 
                 values="0.8;1.5;0.8" 
                 dur="2.5s" 
                 begin="0.5s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.8;0.3;0.8" 
                 dur="2.5s" 
                 begin="0.5s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="5" cy="5" r="0.8" fill="#FFFFFF">
        <animate attributeName="r" 
                 values="0.8;1.5;0.8" 
                 dur="2.2s" 
                 begin="1s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.8;0.3;0.8" 
                 dur="2.2s" 
                 begin="1s"
                 repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
