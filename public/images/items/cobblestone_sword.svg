<svg width="120" height="200" viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cobblestone Sword - Starting weapon -->
  
  <!-- Sword blade -->
  <rect x="50" y="40" width="20" height="100" fill="#C0C0C0"/>
  <polygon points="60,30 50,40 70,40" fill="#C0C0C0"/>
  
  <!-- Sword guard -->
  <rect x="40" y="135" width="40" height="8" fill="#8B4513"/>
  
  <!-- Sword handle -->
  <rect x="55" y="143" width="10" height="40" fill="#8B4513"/>
  
  <!-- Sword pommel -->
  <circle cx="60" cy="188" r="8" fill="#8B4513"/>
  
  <!-- Cobblestone texture on blade -->
  <g opacity="0.3">
    <circle cx="55" cy="60" r="3" fill="#808080"/>
    <circle cx="65" cy="80" r="2" fill="#808080"/>
    <circle cx="58" cy="100" r="3" fill="#808080"/>
    <circle cx="62" cy="120" r="2" fill="#808080"/>
  </g>
  
  <!-- Magical glow effect -->
  <rect x="50" y="40" width="20" height="100" fill="none" stroke="#87CEEB" stroke-width="2" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
