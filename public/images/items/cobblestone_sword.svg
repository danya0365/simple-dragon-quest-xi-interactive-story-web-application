<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cobblestone Sword - Wooden training sword -->
  <!-- Handle -->
  <rect x="45" y="60" width="10" height="30" rx="2" fill="#8B4513" stroke="#333" stroke-width="1.5"/>
  <rect x="47" y="85" width="6" height="8" rx="1" fill="#654321" stroke="#333" stroke-width="1"/>
  
  <!-- Guard -->
  <rect x="35" y="55" width="30" height="8" rx="2" fill="#A0522D" stroke="#333" stroke-width="1.5"/>
  
  <!-- Blade - Wooden -->
  <rect x="47" y="15" width="6" height="40" rx="1" fill="#DEB887" stroke="#333" stroke-width="1.5"/>
  <!-- Wood grain lines -->
  <line x1="48" y1="20" x2="48" y2="50" stroke="#CD853F" stroke-width="0.5"/>
  <line x1="52" y1="20" x2="52" y2="50" stroke="#CD853F" stroke-width="0.5"/>
  
  <!-- Tip -->
  <path d="M47 15 L50 10 L53 15 Z" fill="#DEB887" stroke="#333" stroke-width="1.5"/>
  
  <!-- Cobblestone texture on handle -->
  <circle cx="48" cy="70" r="1" fill="#654321"/>
  <circle cx="52" cy="75" r="1" fill="#654321"/>
  <circle cx="50" cy="80" r="1" fill="#654321"/>
  
  <!-- Training mark -->
  <text x="50" y="35" text-anchor="middle" font-size="6" fill="#8B4513">TRAINING</text>
</svg>
