<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="giftCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="ribbonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB6C1;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="eternalBlessing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFE0;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.1" />
    </radialGradient>
    <filter id="divineGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="giftShimmer">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- Eternal blessing aura -->
  <circle cx="75" cy="75" r="70" fill="url(#eternalBlessing)"/>
  
  <!-- Gift box base -->
  <rect x="40" y="60" width="70" height="50" rx="3" fill="url(#giftCore)" stroke="#FF6347" stroke-width="2" filter="url(#divineGlow)"/>
  
  <!-- Gift box lid -->
  <rect x="35" y="55" width="80" height="15" rx="3" fill="url(#giftCore)" stroke="#FF6347" stroke-width="2" filter="url(#divineGlow)"/>
  
  <!-- Vertical ribbon -->
  <rect x="72" y="55" width="6" height="55" fill="url(#ribbonGlow)" stroke="#FF1493" stroke-width="1" filter="url(#divineGlow)"/>
  
  <!-- Horizontal ribbon -->
  <rect x="35" y="77" width="80" height="6" fill="url(#ribbonGlow)" stroke="#FF1493" stroke-width="1" filter="url(#divineGlow)"/>
  
  <!-- Ribbon bow -->
  <g transform="translate(75, 62)">
    <!-- Left bow loop -->
    <ellipse cx="-12" cy="0" rx="8" ry="12" fill="url(#ribbonGlow)" stroke="#FF1493" stroke-width="1" transform="rotate(-20 -12 0)" filter="url(#divineGlow)"/>
    <!-- Right bow loop -->
    <ellipse cx="12" cy="0" rx="8" ry="12" fill="url(#ribbonGlow)" stroke="#FF1493" stroke-width="1" transform="rotate(20 12 0)" filter="url(#divineGlow)"/>
    <!-- Bow center -->
    <circle cx="0" cy="0" r="5" fill="#FF1493" stroke="#C71585" stroke-width="1" filter="url(#divineGlow)"/>
  </g>
  
  <!-- Divine light rays emanating from gift -->
  <g opacity="0.6">
    <path d="M 75 30 L 73 50 L 77 50 Z" fill="#FFD700" filter="url(#divineGlow)">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 45 45 L 50 60 L 53 58 Z" fill="#FFD700" filter="url(#divineGlow)">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 105 45 L 100 60 L 97 58 Z" fill="#FFD700" filter="url(#divineGlow)">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 30 75 L 50 73 L 50 77 Z" fill="#FFD700" filter="url(#divineGlow)">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 120 75 L 100 73 L 100 77 Z" fill="#FFD700" filter="url(#divineGlow)">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Floating blessing particles -->
  <g opacity="0.7">
    <circle cx="25" cy="25" r="2" fill="#FFD700" filter="url(#divineGlow)">
      <animate attributeName="cy" values="25;15;25" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="125" cy="30" r="2" fill="#FFA500" filter="url(#divineGlow)">
      <animate attributeName="cy" values="30;20;30" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="120" r="2" fill="#FF69B4" filter="url(#divineGlow)">
      <animate attributeName="cy" values="120;110;120" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="125" r="2" fill="#FFB6C1" filter="url(#divineGlow)">
      <animate attributeName="cy" values="125;115;125" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="20" r="2" fill="#FFFFE0" filter="url(#divineGlow)">
      <animate attributeName="cy" values="20;10;20" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Eternal love symbol on gift -->
  <g transform="translate(75, 85)">
    <path d="M 0 -5 C -3 -8, -8 -8, -8 -5 C -8 -2, -4 2, 0 6 C 4 2, 8 -2, 8 -5 C 8 -8, 3 -8, 0 -5 Z" 
          fill="#FF1493" stroke="#C71585" stroke-width="0.5" filter="url(#giftShimmer)" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Peace ring around gift -->
  <circle cx="75" cy="75" r="60" fill="none" stroke="url(#ribbonGlow)" stroke-width="2" opacity="0.4" filter="url(#divineGlow)">
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="60;65;60" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
