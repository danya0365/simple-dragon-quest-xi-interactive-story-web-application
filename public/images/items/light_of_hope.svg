<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Divine Light Aura -->
  <defs>
    <radialGradient id="lightAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4">
        <animate attributeName="stop-opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#ffeb3b;stop-opacity:0.3">
        <animate attributeName="stop-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ffc107;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="lightCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#ffeb3b;stop-opacity:0.9"/>
      <stop offset="60%" style="stop-color:#ffc107;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:0.7"/>
    </radialGradient>
    
    <radialGradient id="innerRadiance" cx="50%" cy="50%" r="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1">
        <animate attributeName="stop-opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#ffeb3b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffc107;stop-opacity:0.5"/>
    </radialGradient>
    
    <filter id="divineGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Divine Light Aura Background -->
  <circle cx="100" cy="100" r="90" fill="url(#lightAura)">
    <animate attributeName="r" values="90;105;90" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main Light Orb Body -->
  <circle cx="100" cy="100" r="55" fill="url(#lightCore)" filter="url(#divineGlow)">
    <animate attributeName="r" values="55;58;55" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner Radiant Core -->
  <circle cx="100" cy="100" r="30" fill="url(#innerRadiance)">
    <animate attributeName="r" values="30;33;30" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Divine Light Rays -->
  <g transform="translate(100, 100)">
    <!-- Primary Light Rays -->
    <line x1="0" y1="-45" x2="0" y2="-70" stroke="#ffffff" stroke-width="3" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;360" dur="20s" repeatCount="indefinite"/>
    </line>
    
    <line x1="0" y1="-45" x2="0" y2="-70" stroke="#ffeb3b" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="45;405" dur="20s" repeatCount="indefinite"/>
    </line>
    
    <line x1="0" y1="-45" x2="0" y2="-70" stroke="#ffc107" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="90;450" dur="20s" repeatCount="indefinite"/>
    </line>
    
    <line x1="0" y1="-45" x2="0" y2="-70" stroke="#ffffff" stroke-width="3" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="135;495" dur="20s" repeatCount="indefinite"/>
    </line>
    
    <line x1="0" y1="-45" x2="0" y2="-70" stroke="#ffeb3b" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="180;540" dur="20s" repeatCount="indefinite"/>
    </line>
    
    <line x1="0" y1="-45" x2="0" y2="-70" stroke="#ffc107" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="225;585" dur="20s" repeatCount="indefinite"/>
    </line>
    
    <line x1="0" y1="-45" x2="0" y2="-70" stroke="#ffffff" stroke-width="3" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="270;630" dur="20s" repeatCount="indefinite"/>
    </line>
    
    <line x1="0" y1="-45" x2="0" y2="-70" stroke="#ffeb3b" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" 
                        values="315;675" dur="20s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Divine Light Swirls -->
  <path d="M 100 55 Q 120 70 115 100 T 100 145 Q 80 130 85 100 T 100 55" 
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 100 100;360 100 100" dur="8s" repeatCount="indefinite"/>
  </path>
  
  <path d="M 100 55 Q 80 70 85 100 T 100 145 Q 120 130 115 100 T 100 55" 
        fill="none" stroke="#ffeb3b" stroke-width="1.5" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 100 100;-360 100 100" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Floating Light Particles -->
  <circle cx="85" cy="70" r="2" fill="#ffffff" opacity="0.9">
    <animate attributeName="cy" values="70;60;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="115" cy="80" r="1.5" fill="#ffeb3b" opacity="0.8">
    <animate attributeName="cy" values="80;70;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="90" cy="130" r="2" fill="#ffc107" opacity="0.7">
    <animate attributeName="cy" values="130;120;130" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="110" cy="125" r="1" fill="#ffffff" opacity="1">
    <animate attributeName="cy" values="125;115;125" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Divine Light Burst Effect -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#ffffff" stroke-width="1" opacity="0">
    <animate attributeName="r" values="35;65;35" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="100" r="40" fill="none" stroke="#ffeb3b" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="40;70;40" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central Divine Star -->
  <g transform="translate(100, 100)">
    <path d="M 0,-12 L 3,-3 L 12,-2 L 6,4 L 8,13 L 0,8 L -8,13 L -6,4 L -12,-2 L -3,-3 Z" 
          fill="#ffffff" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;360" dur="10s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 0,-8 L 2,-2 L 8,-1 L 4,3 L 5,9 L 0,5 L -5,9 L -4,3 L -8,-1 L -2,-2 Z" 
          fill="#ffeb3b" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;-360" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
