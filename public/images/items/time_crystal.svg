<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="crystalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E6F3FF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#B3D9FF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#66B2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A75FF;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="crystalFace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#E6F3FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#B3D9FF;stop-opacity:0.4" />
    </linearGradient>
    
    <linearGradient id="crystalFace2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#99CCFF;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#4D94FF;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="crystalFace3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#B3E6FF;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#66CCFF;stop-opacity:0.3" />
    </linearGradient>
    
    <filter id="timeGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="crystalShine">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Time energy aura -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#66B2FF" stroke-width="2" opacity="0.3" filter="url(#timeGlow)">
    <animate attributeName="r" values="80;90;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="100" r="60" fill="none" stroke="#99CCFF" stroke-width="1.5" opacity="0.4" filter="url(#timeGlow)">
    <animate attributeName="r" values="60;70;60" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Crystal main body (hexagonal shape) -->
  <polygon points="100,40 140,60 140,100 100,120 60,100 60,60" 
           fill="url(#crystalCore)" 
           stroke="#1A75FF" 
           stroke-width="2" 
           filter="url(#crystalShine)"/>
  
  <!-- Crystal faces for 3D effect -->
  <polygon points="100,40 140,60 100,80 60,60" 
           fill="url(#crystalFace1)" 
           opacity="0.8"/>
  
  <polygon points="140,60 140,100 100,120 100,80" 
           fill="url(#crystalFace2)" 
           opacity="0.7"/>
  
  <polygon points="60,60 100,80 100,120 60,100" 
           fill="url(#crystalFace3)" 
           opacity="0.6"/>
  
  <!-- Crystal core energy -->
  <circle cx="100" cy="80" r="15" fill="#FFFFFF" opacity="0.9" filter="url(#crystalShine)">
    <animate attributeName="r" values="15;18;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="80" r="8" fill="#E6F3FF" opacity="1">
    <animate attributeName="r" values="8;10;8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Time symbols floating around crystal -->
  <g opacity="0.6">
    <!-- Clock face 1 -->
    <circle cx="70" cy="50" r="8" fill="none" stroke="#66B2FF" stroke-width="1"/>
    <line x1="70" y1="50" x2="70" y2="45" stroke="#66B2FF" stroke-width="1"/>
    <line x1="70" y1="50" x2="74" y2="50" stroke="#66B2FF" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" values="0 70 50;360 70 50" dur="8s" repeatCount="indefinite"/>
  </g>
  
  <g opacity="0.5">
    <!-- Clock face 2 -->
    <circle cx="130" cy="70" r="6" fill="none" stroke="#99CCFF" stroke-width="1"/>
    <line x1="130" y1="70" x2="130" y2="66" stroke="#99CCFF" stroke-width="1"/>
    <line x1="130" y1="70" x2="133" y2="70" stroke="#99CCFF" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" values="360 130 70;0 130 70" dur="6s" repeatCount="indefinite"/>
  </g>
  
  <g opacity="0.4">
    <!-- Clock face 3 -->
    <circle cx="120" cy="110" r="7" fill="none" stroke="#B3D9FF" stroke-width="1"/>
    <line x1="120" y1="110" x2="120" y2="106" stroke="#B3D9FF" stroke-width="1"/>
    <line x1="120" y1="110" x2="123" y2="110" stroke="#B3D9FF" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" values="0 120 110;360 120 110" dur="7s" repeatCount="indefinite"/>
  </g>
  
  <!-- Time particles -->
  <circle cx="50" cy="80" r="2" fill="#E6F3FF" opacity="0.8">
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="150" cy="90" r="1.5" fill="#B3D9FF" opacity="0.7">
    <animate attributeName="cy" values="90;70;90" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="80" cy="130" r="2.5" fill="#99CCFF" opacity="0.6">
    <animate attributeName="cy" values="130;110;130" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="120" cy="40" r="1.8" fill="#E6F3FF" opacity="0.9">
    <animate attributeName="cy" values="40;60;40" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Crystal highlights -->
  <polygon points="100,40 110,45 105,55 95,55" fill="#FFFFFF" opacity="0.8"/>
  <polygon points="140,60 135,70 125,65 130,55" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Time energy rays -->
  <g opacity="0.3">
    <line x1="100" y1="80" x2="100" y2="20" stroke="#66B2FF" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="80" x2="160" y2="80" stroke="#99CCFF" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="80" x2="100" y2="140" stroke="#B3D9FF" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="80" x2="40" y2="80" stroke="#66B2FF" stroke-width="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
