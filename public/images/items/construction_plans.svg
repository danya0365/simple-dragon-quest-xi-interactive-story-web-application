<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Paper gradient -->
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFACD;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0E68C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
    
    <!-- Blueprint gradient -->
    <linearGradient id="blueprintGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6F3FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B3D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ink gradient -->
    <linearGradient id="inkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2F4F4F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#708090;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2F4F4F;stop-opacity:1" />
    </linearGradient>
    
    <!-- Construction aura gradient -->
    <radialGradient id="constructionAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3" />
      <stop offset="30%" style="stop-color:#FFA500;stop-opacity:0.2" />
      <stop offset="60%" style="stop-color:#FF8C00;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:0.1" />
    </radialGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Paper texture filter -->
    <filter id="paperTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="1">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  
  <!-- Construction aura -->
  <circle cx="100" cy="100" r="85" 
          fill="url(#constructionAura)" 
          filter="url(#glow)">
    <animate attributeName="r" 
             values="85;90;85" 
             dur="4s" 
             repeatCount="indefinite"/>
    <animate attributeName="opacity" 
             values="0.3;0.5;0.3" 
             dur="4s" 
             repeatCount="indefinite"/>
  </circle>
  
  <!-- Main blueprint scroll -->
  <g transform="translate(100, 100)">
    <!-- Scroll background -->
    <rect x="-60" y="-40" width="120" height="80" 
          fill="url(#blueprintGradient)" 
          stroke="#4682B4" 
          stroke-width="2"
          filter="url(#shadow)"
          rx="5" ry="5"/>
    
    <!-- Paper texture overlay -->
    <rect x="-58" y="-38" width="116" height="76" 
          fill="url(#paperGradient)" 
          opacity="0.3"
          rx="3" ry="3"/>
    
    <!-- Grid lines -->
    <g stroke="#87CEEB" stroke-width="0.5" opacity="0.6">
      <line x1="-50" y1="-30" x2="50" y2="-30"/>
      <line x1="-50" y1="-20" x2="50" y2="-20"/>
      <line x1="-50" y1="-10" x2="50" y2="-10"/>
      <line x1="-50" y1="0" x2="50" y2="0"/>
      <line x1="-50" y1="10" x2="50" y2="10"/>
      <line x1="-50" y1="20" x2="50" y2="20"/>
      <line x1="-50" y1="30" x2="50" y2="30"/>
      
      <line x1="-40" y1="-35" x2="-40" y2="35"/>
      <line x1="-30" y1="-35" x2="-30" y2="35"/>
      <line x1="-20" y1="-35" x2="-20" y2="35"/>
      <line x1="-10" y1="-35" x2="-10" y2="35"/>
      <line x1="0" y1="-35" x2="0" y2="35"/>
      <line x1="10" y1="-35" x2="10" y2="35"/>
      <line x1="20" y1="-35" x2="20" y2="35"/>
      <line x1="30" y1="-35" x2="30" y2="35"/>
      <line x1="40" y1="-35" x2="40" y2="35"/>
    </g>
    
    <!-- Village layout -->
    <g stroke="url(#inkGradient)" stroke-width="2" fill="none">
      <!-- Main house -->
      <rect x="-35" y="-20" width="20" height="15" stroke-width="1.5"/>
      <polygon points="-35,-20 -25,-25 -15,-20" stroke-width="1.5"/>
      
      <!-- Second house -->
      <rect x="15" y="-20" width="20" height="15" stroke-width="1.5"/>
      <polygon points="15,-20 25,-25 35,-20" stroke-width="1.5"/>
      
      <!-- Village square -->
      <rect x="-10" y="-5" width="20" height="20" stroke-width="1.5" stroke-dasharray="2,2"/>
      
      <!-- Chapel -->
      <rect x="-5" y="20" width="10" height="12" stroke-width="1.5"/>
      <polygon points="-5,20 0,15 5,20" stroke-width="1.5"/>
      <rect x="-2" y="22" width="4" height="6" stroke-width="1"/>
      
      <!-- Pathways -->
      <path d="M -25,-12 L -10,5" stroke-width="1"/>
      <path d="M 25,-12 L 10,5" stroke-width="1"/>
      <path d="M 0,15 L 0,20" stroke-width="1"/>
    </g>
    
    <!-- Blueprint labels -->
    <g font-family="serif" font-size="6" fill="url(#inkGradient)" text-anchor="middle">
      <text x="-25" y="-28">HOUSE</text>
      <text x="25" y="-28">HOUSE</text>
      <text x="0" y="2">SQUARE</text>
      <text x="0" y="38">CHAPEL</text>
    </g>
    
    <!-- Measurements -->
    <g stroke="#FF6347" stroke-width="1" fill="none" opacity="0.8">
      <line x1="-35" y1="-35" x2="-15" y2="-35"/>
      <line x1="-35" y1="-37" x2="-35" y2="-33"/>
      <line x1="-15" y1="-37" x2="-15" y2="-33"/>
      <text x="-25" y="-40" font-family="serif" font-size="5" fill="#FF6347" text-anchor="middle">20m</text>
      
      <line x1="15" y1="-35" x2="35" y2="-35"/>
      <line x1="15" y1="-37" x2="15" y2="-33"/>
      <line x1="35" y1="-37" x2="35" y2="-33"/>
      <text x="25" y="-40" font-family="serif" font-size="5" fill="#FF6347" text-anchor="middle">20m</text>
    </g>
    
    <!-- Title -->
    <text x="0" y="-45" 
          font-family="serif" 
          font-size="10" 
          font-weight="bold" 
          fill="url(#inkGradient)" 
          text-anchor="middle">COBBLESTONE</text>
    <text x="0" y="-35" 
          font-family="serif" 
          font-size="8" 
          fill="url(#inkGradient)" 
          text-anchor="middle">REBUILT</text>
    
    <!-- Compass rose -->
    <g transform="translate(45, -25)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="url(#inkGradient)" stroke-width="1"/>
      <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="none" stroke="url(#inkGradient)" stroke-width="1"/>
      <text x="0" y="-6" font-family="serif" font-size="6" fill="url(#inkGradient)" text-anchor="middle">N</text>
      <text x="6" y="2" font-family="serif" font-size="4" fill="url(#inkGradient)" text-anchor="middle">E</text>
      <text x="0" y="8" font-family="serif" font-size="4" fill="url(#inkGradient)" text-anchor="middle">S</text>
      <text x="-6" y="2" font-family="serif" font-size="4" fill="url(#inkGradient)" text-anchor="middle">W</text>
    </g>
    
    <!-- Scale indicator -->
    <g transform="translate(-45, 30)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="url(#inkGradient)" stroke-width="1"/>
      <line x1="0" y1="-2" x2="0" y2="2" stroke="url(#inkGradient)" stroke-width="1"/>
      <line x1="20" y1="-2" x2="20" y2="2" stroke="url(#inkGradient)" stroke-width="1"/>
      <text x="10" y="5" font-family="serif" font-size="4" fill="url(#inkGradient)" text-anchor="middle">10m</text>
    </g>
    
    <!-- Floating construction particles -->
    <g opacity="0.6">
      <rect x="-30" y="-50" width="3" height="3" fill="#FFD700">
        <animate attributeName="y" 
                 values="-50;-60;-50" 
                 dur="3s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="3s" 
                 repeatCount="indefinite"/>
      </rect>
      <rect x="30" y="-45" width="3" height="3" fill="#FFA500">
        <animate attributeName="y" 
                 values="-45;-55;-45" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="3.5s" 
                 repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="-55" width="3" height="3" fill="#FF8C00">
        <animate attributeName="y" 
                 values="-55;-65;-55" 
                 dur="4s" 
                 repeatCount="indefinite"/>
        <animate attributeName="opacity" 
                 values="0.6;0.2;0.6" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- Blueprint glow effects -->
    <g opacity="0.4">
      <rect x="-35" y="-20" width="20" height="15" 
            fill="none" 
            stroke="#FFD700" 
            stroke-width="1">
        <animate attributeName="opacity" 
                 values="0.4;0.8;0.4" 
                 dur="3s" 
                 repeatCount="indefinite"/>
      </rect>
      <rect x="15" y="-20" width="20" height="15" 
            fill="none" 
            stroke="#FFD700" 
            stroke-width="1">
        <animate attributeName="opacity" 
                 values="0.4;0.8;0.4" 
                 dur="3s" 
                 begin="1.5s"
                 repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- Scroll edges -->
    <g fill="url(#paperGradient)" stroke="#DAA520" stroke-width="1">
      <ellipse cx="-60" cy="0" rx="8" ry="40" filter="url(#shadow)"/>
      <ellipse cx="60" cy="0" rx="8" ry="40" filter="url(#shadow)"/>
    </g>
  </g>
</svg>
