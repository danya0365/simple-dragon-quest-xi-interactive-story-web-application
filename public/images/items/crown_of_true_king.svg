<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Royal Aura Effect -->
  <defs>
    <radialGradient id="royalAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.3">
        <animate attributeName="stop-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:0.2">
        <animate attributeName="stop-opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#fff59d;stop-opacity:0"/>
    </radialGradient>
    
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffed4e"/>
      <stop offset="100%" style="stop-color:#ffb300"/>
    </linearGradient>
    
    <linearGradient id="crownJewel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63"/>
      <stop offset="50%" style="stop-color:#f06292"/>
      <stop offset="100%" style="stop-color:#c2185b"/>
    </linearGradient>
    
    <radialGradient id="jewelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8">
        <animate attributeName="stop-opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#e91e63;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#c2185b;stop-opacity:0.2"/>
    </radialGradient>
    
    <filter id="royalGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Royal Aura Background -->
  <ellipse cx="100" cy="120" rx="80" ry="60" fill="url(#royalAura)">
    <animate attributeName="rx" values="80;90;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="60;70;60" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Crown Base Band -->
  <path d="M 60 110 L 60 130 Q 60 135 65 135 L 135 135 Q 140 135 140 130 L 140 110 Z" 
        fill="url(#crownGold)" stroke="#ffb300" stroke-width="1" filter="url(#royalGlow)"/>
  
  <!-- Crown Points -->
  <!-- Left Point -->
  <path d="M 60 110 L 60 80 Q 60 75 65 75 L 75 75 Q 80 75 80 80 L 80 110 Z" 
        fill="url(#crownGold)" stroke="#ffb300" stroke-width="1"/>
  
  <!-- Center Point (Tallest) -->
  <path d="M 90 110 L 90 60 Q 90 55 95 55 L 105 55 Q 110 55 110 60 L 110 110 Z" 
        fill="url(#crownGold)" stroke="#ffb300" stroke-width="1"/>
  
  <!-- Right Point -->
  <path d="M 120 110 L 120 80 Q 120 75 125 75 L 135 75 Q 140 75 140 80 L 140 110 Z" 
        fill="url(#crownGold)" stroke="#ffb300" stroke-width="1"/>
  
  <!-- Crown Cross on Center Point -->
  <line x1="100" y1="55" x2="100" y2="45" stroke="#ffd700" stroke-width="3"/>
  <line x1="95" y1="50" x2="105" y2="50" stroke="#ffd700" stroke-width="3"/>
  
  <!-- Royal Jewels -->
  <!-- Left Jewel -->
  <ellipse cx="70" cy="90" rx="8" ry="10" fill="url(#crownJewel)" filter="url(#royalGlow)">
    <animate attributeName="rx" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="10;12;10" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="70" cy="90" rx="4" ry="5" fill="url(#jewelGlow)">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Center Jewel (Largest) -->
  <ellipse cx="100" cy="75" rx="10" ry="12" fill="url(#crownJewel)" filter="url(#royalGlow)">
    <animate attributeName="rx" values="10;12;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="12;14;12" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="100" cy="75" rx="5" ry="6" fill="url(#jewelGlow)">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Right Jewel -->
  <ellipse cx="130" cy="90" rx="8" ry="10" fill="url(#crownJewel)" filter="url(#royalGlow)">
    <animate attributeName="rx" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="10;12;10" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="130" cy="90" rx="4" ry="5" fill="url(#jewelGlow)">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Crown Decorative Details -->
  <!-- Left Side Decoration -->
  <circle cx="50" cy="120" r="3" fill="#ffd700"/>
  <circle cx="45" cy="125" r="2" fill="#ffed4e"/>
  <circle cx="55" cy="125" r="2" fill="#ffed4e"/>
  
  <!-- Right Side Decoration -->
  <circle cx="150" cy="120" r="3" fill="#ffd700"/>
  <circle cx="145" cy="125" r="2" fill="#ffed4e"/>
  <circle cx="155" cy="125" r="2" fill="#ffed4e"/>
  
  <!-- Crown Base Jewels -->
  <circle cx="75" cy="125" r="3" fill="#e91e63" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="125" r="3" fill="#e91e63" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="125" cy="125" r="3" fill="#e91e63" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating Royal Particles -->
  <circle cx="80" cy="60" r="1.5" fill="#ffd700" opacity="0.8">
    <animate attributeName="cy" values="60;50;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="120" cy="65" r="1" fill="#ffed4e" opacity="0.7">
    <animate attributeName="cy" values="65;55;65" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="95" cy="140" r="1.5" fill="#e91e63" opacity="0.6">
    <animate attributeName="cy" values="140;130;140" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="105" cy="145" r="1" fill="#ffd700" opacity="0.9">
    <animate attributeName="cy" values="145;135;145" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Divine Light Burst Effect -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="50;80;50" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="100" r="55" fill="none" stroke="#ffed4e" stroke-width="0.3" opacity="0">
    <animate attributeName="r" values="55;85;55" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
