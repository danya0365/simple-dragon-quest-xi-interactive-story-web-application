<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Prison Key -->
  
  <!-- Key head (circular part) -->
  <circle cx="35" cy="35" r="12" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  <circle cx="35" cy="35" r="8" fill="#FFA500"/>
  <circle cx="35" cy="35" r="4" fill="#FFD700"/>
  
  <!-- Key shaft -->
  <rect x="45" y="33" width="25" height="4" fill="#FFD700"/>
  
  <!-- Key teeth -->
  <g>
    <!-- First tooth -->
    <rect x="65" y="33" width="4" height="8" fill="#FFD700"/>
    <rect x="65" y="37" width="4" height="4" fill="#FFA500"/>
    
    <!-- Second tooth -->
    <rect x="69" y="29" width="4" height="8" fill="#FFD700"/>
    <rect x="69" y="33" width="4" height="4" fill="#FFA500"/>
    
    <!-- Third tooth -->
    <rect x="73" y="33" width="4" height="6" fill="#FFD700"/>
    <rect x="73" y="37" width="4" height="2" fill="#FFA500"/>
  </g>
  
  <!-- Key details -->
  <line x1="35" y1="23" x2="35" y2="47" stroke="#FFA500" stroke-width="1" opacity="0.7"/>
  <line x1="23" y1="35" x2="47" y2="35" stroke="#FFA500" stroke-width="1" opacity="0.7"/>
  
  <!-- Key ring attachment -->
  <circle cx="35" cy="35" r="2" fill="#FFA500"/>
  
  <!-- Shine effect -->
  <ellipse cx="30" cy="30" rx="3" ry="2" fill="#FFFFE0" opacity="0.8"/>
  
  <!-- Shadow -->
  <ellipse cx="50" cy="85" rx="25" ry="5" fill="#000000" opacity="0.2"/>
  
  <!-- Prison label -->
  <text x="50" y="95" text-anchor="middle" font-size="6" fill="#666666">PRISON</text>
</svg>
