<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Trident of the Seas - Legendary Weapon -->
  
  <defs>
    <linearGradient id="tridentShaftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#E6E6FA;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#4682B4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#191970;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tridentHeadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#00CED1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4169E1;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="powerCoreGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#00CED1;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4169E1;stop-opacity:0.6"/>
    </radialGradient>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Shaft -->
  <rect x="95" y="50" width="10" height="120" fill="url(#tridentShaftGradient)" stroke="#696969" stroke-width="1" rx="2">
    <animate attributeName="opacity" values="1;0.9;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Shaft Decorations -->
  <rect x="93" y="70" width="14" height="3" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>
  <rect x="93" y="90" width="14" height="3" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>
  <rect x="93" y="110" width="14" height="3" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>
  <rect x="93" y="130" width="14" height="3" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>
  
  <!-- Trident Head Base -->
  <path d="M 85 45 L 100 30 L 115 45 L 110 60 L 90 60 Z" fill="url(#tridentHeadGradient)" stroke="#4169E1" stroke-width="2" filter="url(#glowEffect)">
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Central Prong -->
  <path d="M 100 30 L 100 10" stroke="url(#tridentHeadGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glowEffect)">
    <animate attributeName="stroke-width" values="6;8;6" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Left Prong -->
  <path d="M 90 35 L 85 15" stroke="url(#tridentHeadGradient)" stroke-width="5" stroke-linecap="round" filter="url(#glowEffect)">
    <animate attributeName="stroke-width" values="5;7;5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Right Prong -->
  <path d="M 110 35 L 115 15" stroke="url(#tridentHeadGradient)" stroke-width="5" stroke-linecap="round" filter="url(#glowEffect)">
    <animate attributeName="stroke-width" values="5;7;5" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Prong Tips -->
  <circle cx="100" cy="10" r="4" fill="#00FFFF" filter="url(#glowEffect)">
    <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="15" r="3" fill="#00FFFF" filter="url(#glowEffect)">
    <animate attributeName="r" values="3;5;3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="115" cy="15" r="3" fill="#00FFFF" filter="url(#glowEffect)">
    <animate attributeName="r" values="3;5;3" dur="1.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Power Core -->
  <circle cx="100" cy="45" r="8" fill="url(#powerCoreGradient)" filter="url(#glowEffect)">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Water Runes on Shaft -->
  <text x="100" y="80" font-family="Arial" font-size="8" fill="#00CED1" text-anchor="middle" opacity="0.8">≈</text>
  <text x="100" y="100" font-family="Arial" font-size="8" fill="#00CED1" text-anchor="middle" opacity="0.8">∿</text>
  <text x="100" y="120" font-family="Arial" font-size="8" fill="#00CED1" text-anchor="middle" opacity="0.8">≋</text>
  
  <!-- Water Particles -->
  <circle cx="80" cy="40" r="1" fill="#87CEEB" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; -2,-5; 0,0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="35" r="1" fill="#87CEEB" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 2,-6; 0,0" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="25" r="0.8" fill="#87CEEB" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0; -1,-4; 0,0" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="20" r="0.8" fill="#87CEEB" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0,0; 1,-4; 0,0" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Magical Water Waves -->
  <path d="M 70 50 Q 80 45, 90 50 T 110 50 T 130 50" fill="none" stroke="#00CED1" stroke-width="1" opacity="0.5">
    <animate attributeName="d" values="M 70 50 Q 80 45, 90 50 T 110 50 T 130 50; M 70 50 Q 80 55, 90 50 T 110 50 T 130 50; M 70 50 Q 80 45, 90 50 T 110 50 T 130 50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Energy Waves -->
  <circle cx="100" cy="45" r="20" fill="none" stroke="#00CED1" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="20;35;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="45" r="25" fill="none" stroke="#4169E1" stroke-width="0.5" opacity="0.3">
    <animate attributeName="r" values="25;40;25" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Handle Grip -->
  <rect x="93" y="150" width="14" height="20" fill="#8B4513" stroke="#654321" stroke-width="1" rx="2"/>
  <rect x="95" y="155" width="10" height="10" fill="#A0522D" stroke="#8B4513" stroke-width="0.5" rx="1"/>
  
  <!-- Handle End Cap -->
  <ellipse cx="100" cy="175" rx="8" ry="5" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  
  <!-- Lightning Effects -->
  <path d="M 100 15 L 102 8 L 100 10 L 105 5" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 85 20 L 87 13 L 85 15 L 90 10" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 115 20 L 117 13 L 115 15 L 120 10" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" begin="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Power Sparkles -->
  <circle cx="95" cy="35" r="1" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="105" cy="40" r="1" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="30" r="1" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>
