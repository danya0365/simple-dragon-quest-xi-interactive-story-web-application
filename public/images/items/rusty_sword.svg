<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Rusty Sword -->
  
  <!-- Sword blade with rust effect -->
  <g transform="rotate(45 50 50)">
    <rect x="47" y="20" width="6" height="50" fill="#8B4513"/>
    <rect x="48" y="22" width="4" height="46" fill="#A0522D"/>
    
    <!-- Rust spots -->
    <circle cx="49" cy="25" r="1" fill="#CD853F"/>
    <circle cx="51" cy="30" r="0.8" fill="#D2691E"/>
    <circle cx="49" cy="35" r="1.2" fill="#CD853F"/>
    <circle cx="51" cy="40" r="0.9" fill="#D2691E"/>
    <circle cx="49" cy="45" r="1" fill="#CD853F"/>
    <circle cx="51" cy="50" r="0.7" fill="#D2691E"/>
    <circle cx="49" cy="55" r="1.1" fill="#CD853F"/>
    <circle cx="51" cy="60" r="0.8" fill="#D2691E"/>
    
    <!-- Sword guard -->
    <rect x="42" y="65" width="16" height="4" fill="#654321"/>
    <rect x="43" y="66" width="14" height="2" fill="#8B4513"/>
    
    <!-- Sword handle -->
    <rect x="47" y="69" width="6" height="15" fill="#8B4513"/>
    <rect x="48" y="70" width="4" height="13" fill="#A0522D"/>
    
    <!-- Handle wrap -->
    <rect x="47" y="72" width="6" height="2" fill="#654321"/>
    <rect x="47" y="76" width="6" height="2" fill="#654321"/>
    <rect x="47" y="80" width="6" height="2" fill="#654321"/>
    
    <!-- Pommel -->
    <circle cx="50" cy="87" r="4" fill="#654321"/>
    <circle cx="50" cy="87" r="3" fill="#8B4513"/>
  </g>
  
  <!-- Rust particles floating around -->
  <g opacity="0.6">
    <circle cx="25" cy="25" r="1" fill="#CD853F"/>
    <circle cx="75" cy="30" r="0.8" fill="#D2691E"/>
    <circle cx="30" cy="70" r="1.2" fill="#CD853F"/>
    <circle cx="70" cy="75" r="0.9" fill="#D2691E"/>
  </g>
</svg>
