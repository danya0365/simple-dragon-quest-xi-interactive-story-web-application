<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Sea Breeze Sword - Sword with wave and wind power -->
  
  <!-- Sword blade -->
  <rect x="28" y="8" width="8" height="35" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
  
  <!-- Blade tip -->
  <polygon points="32,8 28,12 36,12" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
  
  <!-- Wave pattern on blade -->
  <path d="M 28 15 Q 32 13 36 15 T 36 19 Q 32 17 28 19 T 28 23 Q 32 21 36 23 T 36 27 Q 32 25 28 27 T 28 31 Q 32 29 36 31 T 36 35" stroke="#4682B4" stroke-width="1" fill="none"/>
  
  <!-- Cross guard -->
  <rect x="20" y="40" width="24" height="6" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Handle -->
  <rect x="29" y="46" width="6" height="12" fill="#4682B4" stroke="#1E90FF" stroke-width="1"/>
  
  <!-- Handle wrapping -->
  <line x1="29" y1="48" x2="35" y2="48" stroke="#1E90FF" stroke-width="0.5"/>
  <line x1="29" y1="50" x2="35" y2="50" stroke="#1E90FF" stroke-width="0.5"/>
  <line x1="29" y1="52" x2="35" y2="52" stroke="#1E90FF" stroke-width="0.5"/>
  <line x1="29" y1="54" x2="35" y2="54" stroke="#1E90FF" stroke-width="0.5"/>
  
  <!-- Pommel -->
  <circle cx="32" cy="60" r="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Wind swirls around blade -->
  <path d="M 25 20 Q 20 18 22 23 Q 24 28 20 30" stroke="#87CEEB" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 39 25 Q 44 23 42 28 Q 40 33 44 35" stroke="#87CEEB" stroke-width="1" fill="none" opacity="0.6"/>
  
  <!-- Water droplets -->
  <circle cx="24" cy="35" r="1" fill="#00BFFF" opacity="0.8"/>
  <circle cx="40" cy="30" r="1" fill="#00BFFF" opacity="0.8"/>
  <circle cx="30" cy="25" r="1" fill="#00BFFF" opacity="0.8"/>
  <circle cx="34" cy="40" r="1" fill="#00BFFF" opacity="0.8"/>
  
  <!-- Sea breeze effect -->
  <path d="M 15 15 Q 20 13 25 15 T 35 15 T 45 15 T 50 15" stroke="#87CEEB" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M 15 45 Q 20 43 25 45 T 35 45 T 45 45 T 50 45" stroke="#87CEEB" stroke-width="0.5" fill="none" opacity="0.4"/>
  
  <!-- Blade reflection -->
  <rect x="30" y="12" width="2" height="25" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- Power symbols -->
  <text x="32" y="22" text-anchor="middle" font-family="serif" font-size="4" fill="#FFFFFF">≋</text>
  <text x="32" y="32" text-anchor="middle" font-family="serif" font-size="4" fill="#FFFFFF">☁</text>
</svg>
