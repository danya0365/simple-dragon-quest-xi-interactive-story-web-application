<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Sword of Light Item -->
  <g transform="translate(100, 100)">
    <!-- Divine Light Aura -->
    <ellipse cx="0" cy="0" rx="45" ry="80" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.6">
      <animate attributeName="rx" values="45;55;45" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Sword Blade -->
    <path d="M -8 -65 L -6 25 L 6 25 L 8 -65 Z" fill="#F0F8FF" stroke="#4169E1" stroke-width="2"/>
    
    <!-- Holy Runes on Blade -->
    <g transform="rotate(0)">
      <text x="-4" y="-50" font-family="Arial" font-size="8" fill="#FFD700">✦</text>
      <text x="-4" y="-35" font-family="Arial" font-size="8" fill="#FFD700">✧</text>
      <text x="-4" y="-20" font-family="Arial" font-size="8" fill="#FFD700">✦</text>
      <text x="-4" y="-5" font-family="Arial" font-size="8" fill="#FFD700">✧</text>
      <text x="-4" y="10" font-family="Arial" font-size="8" fill="#FFD700">✦</text>
    </g>
    
    <!-- Light Energy Core -->
    <path d="M 0 -65 L -3 -70 L 0 -75 L 3 -70 Z" fill="#FFD700" stroke="#FFA500" stroke-width="1">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Divine Crossguard -->
    <rect x="-20" y="23" width="40" height="12" rx="3" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    <rect x="-18" y="25" width="36" height="8" rx="2" fill="#FFF8DC" stroke="#FFD700" stroke-width="1"/>
    
    <!-- Crossguard Wings -->
    <path d="M -20 29 L -25 25 L -20 21" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
    <path d="M 20 29 L 25 25 L 20 21" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
    
    <!-- Sacred Handle -->
    <rect x="-6" y="35" width="12" height="30" rx="2" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    
    <!-- Handle Wrapping -->
    <rect x="-6" y="37" width="12" height="4" rx="1" fill="#FFF8DC"/>
    <rect x="-6" y="43" width="12" height="4" rx="1" fill="#FFF8DC"/>
    <rect x="-6" y="49" width="12" height="4" rx="1" fill="#FFF8DC"/>
    <rect x="-6" y="55" width="12" height="4" rx="1" fill="#FFF8DC"/>
    
    <!-- Holy Pommel -->
    <circle cx="0" cy="70" r="10" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    <circle cx="0" cy="70" r="7" fill="#FFF8DC" stroke="#FFD700" stroke-width="1"/>
    <circle cx="0" cy="70" r="4" fill="#FFD700">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Light Blade Edge -->
    <path d="M -8 -65 L -6 25 L 6 25 L 8 -65 Z" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Divine Light Particles -->
    <circle cx="-20" cy="-50" r="2" fill="#FFD700" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,-15; 0,0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="-30" r="1.5" fill="#FFF8DC" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; -6,-12; 0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-15" cy="15" r="1" fill="#FFA500" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-8; 0,0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="40" r="1.2" fill="#FFD700" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-10; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Sacred Energy Waves -->
    <g transform="translate(0, -20)">
      <ellipse cx="0" cy="0" rx="15" ry="25" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5">
        <animate attributeName="rx" values="15;20;15" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="0" rx="20" ry="35" fill="none" stroke="#FFF8DC" stroke-width="1" opacity="0.3">
        <animate attributeName="rx" values="20;25;20" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Holy Light Burst -->
    <g transform="translate(0, -65)">
      <circle cx="0" cy="0" r="8" fill="#FFD700" opacity="0.8">
        <animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <path d="M 0 -10 L 3 -7 L 0 -4 L -3 -7 Z" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Ultimate Weapon Symbol -->
    <g transform="translate(0, 0)" opacity="0.8">
      <text x="-12" y="5" font-family="Arial" font-size="16" fill="#FFD700">⚔</text>
    </g>
    
    <!-- Luminary Power Glow -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="60;70;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Divine Protection Field -->
    <ellipse cx="0" cy="0" rx="35" ry="60" fill="none" stroke="#4169E1" stroke-width="1" opacity="0.4">
      <animate attributeName="rx" values="35;40;35" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
